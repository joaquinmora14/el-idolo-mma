// 1.0 regional · 1.3 nivel mundial · 1.65 élite (ventanas más cortas, zonas más chicas)
function tierDifficulty(){
  const t = ORGS[state.player.orgId].tier;
  if(t==='global') return 1.65;
  if(t==='continental') return 1.3;
  return 1.0;
}
// Las primeras peleas de la carrera son más amables: más tiempo y zonas más grandes.
function fightsSoFar(){ const r = state.player && state.player.record; return r ? r.w+r.l+r.d : 0; }
function rookieEase(){
  const n = fightsSoFar();
  if(n===0) return 1.75;   // debut
  if(n===1) return 1.45;
  if(n===2) return 1.25;
  if(n===3) return 1.12;
  return 1;
}
/* Lo que importa NO es la valoración general, sino la habilidad puntual:
   en un juego de striking pesa tu striking contra el suyo, en uno de lucha
   tu wrestling contra el suyo, y así. Un especialista domina lo suyo. */
function myStatFor(cat){
  const p = state.player;
  if(cat==='striking') return effStriking();
  if(cat==='wrestling') return p.wrestling;
  if(cat==='sumision') return p.sumision;
  return powerScore(p);
}
function catGap(cat){
  if(!fight || !fight.opponent) return 0;
  const c = cat || fight.currentCat || 'striking';
  const support = (effCardio() + state.player.chin) / 2;          // cardio y mentón ayudan un poco
  const mine = myStatFor(c)*0.85 + support*0.15;
  return (fight.opponent[c] || 0) - mine;
}
function gapMult(){
  if(!fight || !fight.opponent) return 1;
  return clamp(1 + Math.max(0, catGap())*0.185, 1, 2.9);
}
function staminaMult(){
  if(!fight || fight.stamina===undefined) return 1;
  return clamp(0.62 + (fight.stamina/100)*0.38, 0.62, 1);   // sin aire, menos tiempo de reacción
}
function dw(ms){ return Math.round(ms * rookieEase() * staminaMult() / (tierDifficulty()*gapMult())); }
function dz(size){ return size * rookieEase() / (tierDifficulty()*gapMult()); }

function startPendingGame(){
  if(!fight || fight.phase!=='briefing' || !fight.currentGame) return;
  fight.currentGame.start();
}
function difficultyLabel(){
  const m = tierDifficulty()*gapMult();
  if(m>=2.4) return {t:'BRUTAL',   c:'var(--red)'};
  if(m>=1.8) return {t:'MUY DIFÍCIL', c:'#ff9a4a'};
  if(m>=1.35) return {t:'DIFÍCIL',  c:'var(--gold)'};
  if(m>=1.12) return {t:'EXIGENTE', c:'var(--text)'};
  return {t:'NORMAL', c:'var(--neon)'};
}
function posPool(pos){ return MINIGAME_POOL.filter(g => (g.pos||'pie') === pos); }
/* La pelea fluye: de pie -> clinch -> piso, según lo que va pasando */
function advancePosition(won){
  const p=state.player, o=fight.opponent, pos=fight.position;
  if(fight.forcePosition){ fight.position=fight.forcePosition; fight.forcePosition=null; return; }
  const lastId = fight.currentGame && fight.currentGame.id;
  if(pos==='pie'){
    if(lastId==='grap_shoot' && won){ fight.position='arriba'; return; }
    if(lastId==='def_sprawl' && !won){ fight.position='abajo'; return; }
    const shootOdds = clamp(0.14 + (o.wrestling - p.wrestling)*0.006, 0.06, 0.34);
    if(Math.random()<shootOdds){ fight.pendingShot=true; return; }
    if(Math.random()<0.12) fight.position='clinch';
  } else if(pos==='clinch'){
    if(won && Math.random()<0.45) fight.position = (state.gamePlan==='striking') ? 'pie' : 'arriba';
    else if(!won && Math.random()<0.40) fight.position='abajo';
    else if(Math.random()<0.25) fight.position='pie';
  } else if(pos==='arriba'){
    if(!won && Math.random()<0.35) fight.position='pie';
  } else if(pos==='abajo'){
    if(won && Math.random()<0.30) fight.position='pie';
  }
}
function startGameNow(g){
  fight.currentCat=g.cat; fight.currentGame=g; fight.isDefensive=!!g.def; fight.canCounter=false;
  state.lastGameId=g.id;
  if(!state.seenGames) state.seenGames={};
  if(state.seenGames[g.id]) g.start();
  else { state.seenGames[g.id]=true; fight.phase='briefing'; render(); }
}
function pickAndStartMinigame(){
  fight.popup=null; fight.flash=''; fight.counter=null;
  if(!fight.usedGames) fight.usedGames=[];
  if(!fight.position) fight.position = state.startPosition || 'pie';
  if(fight.pendingShot){                       // se tiró a las piernas: hay que defender
    fight.pendingShot=false;
    startGameNow(MINIGAME_POOL.find(x=>x.id==='def_sprawl'));
    return;
  }
  let pool = posPool(fight.position).filter(g=>!fight.usedGames.includes(g.id));
  if(!pool.length) pool = posPool(fight.position);
  if(!pool.length){ fight.position='pie'; pool = posPool('pie'); }
  if(!pool.length) pool = MINIGAME_POOL.slice();
  if(fightsSoFar()===0){
    const BEG=['strike_target','strike_bar','grap_shoot','sub_nodes','gnp_ground'];
    const rp = pool.filter(g=>BEG.includes(g.id));
    if(rp.length) pool = rp;
  }
  let g;
  const plan = state.gamePlan;
  if(plan && plan!=='mixto' && Math.random()<0.66){
    const favs = state.planRead ? pool.filter(x=>x.cat===plan && x.def) : pool.filter(x=>x.cat===plan);
    g = favs.length ? choice(favs) : choice(pool);
  } else g = choice(pool);
  fight.usedGames.push(g.id);
  startGameNow(g);
}
/* ---- STRIKING variante A: barra de precisión (FALLO | GOLPE | KO | GOLPE | FALLO) ---- */
function beginPrecisionBar(){
  const p=state.player, o=fight.opponent;
  const diff = effStriking() - o.striking;
  const koW  = clamp(dz(11 + diff*0.22)*reachMult(), 4, 26);      // zona de KO
  const hitW = clamp(dz(26 + diff*0.35)*reachMult(), 12, 52);     // zona de golpe (a cada lado)
  fight.pbKo = {left:50-koW/2, width:koW};
  fight.pbHit = {left:50-koW/2-hitW, width:hitW*2+koW};
  fight.pbSpeed = 1.5 + o.striking*0.016*tierDifficulty()*gapMult();
  fight.pbMarker = 0;
  fight.phase='precisionbar';
  fight._start=performance.now();
  render();
  cancelAnimationFrame(rafId);
  (function tick(t){
    if(!fight || fight.phase!=='precisionbar') return;
    const el=(t-fight._start)/1000;
    fight.pbMarker=(Math.sin(el*fight.pbSpeed*2.4)+1)/2*100;
    const m=document.getElementById('pbMarker'); if(m) m.style.left=fight.pbMarker+'%';
    if(el>3.4){ resolvePrecisionBar(true); return; }
    rafId=requestAnimationFrame(tick);
  })(performance.now());
}
function hitPrecisionBar(){ if(!fight||fight.phase!=='precisionbar') return; cancelAnimationFrame(rafId); resolvePrecisionBar(false); }
function resolvePrecisionBar(timedOut){
  fight.phase='resolved';
  const m=fight.pbMarker;
  const inKo  = !timedOut && m>=fight.pbKo.left  && m<=fight.pbKo.left+fight.pbKo.width;
  const inHit = !timedOut && m>=fight.pbHit.left && m<=fight.pbHit.left+fight.pbHit.width;
  fight.strikeZoneMult = inKo ? 1.9 : 1.0;
  applyOutcome(inKo||inHit, inKo, false);
  afterExchangeResolved();
}

/* ---- STRIKING variante C: memotest DIFÍCIL (5 guardias, vistazo corto) ---- */
function beginHardMemo(){
  const p=state.player, o=fight.opponent;
  const diff = p.striking - o.striking;
  const len = 5;
  fight.mdSeq = Array.from({length:len}, ()=>randi(0,GUARD_SLOTS.length-1));
  fight.mdInput=[]; fight.mdMaxLives=1; fight.mdLives=1;
  fight.mdFlashMs = clamp(dw(330 + diff*2), 150, 420);   // vistazo MUY corto
  fight.mdGapMs   = clamp(dw(110), 60, 150);
  fight.mdIsHard  = true;
  fight.phase='memoshow';
  render();
  playMemoSequence(0);
}

/* ---- GRAPPLING variante B: control de cadera (balance) ---- */
function beginHipControl(){
  const p=state.player, o=fight.opponent;
  const diff = p.wrestling - o.wrestling;
  fight.hcPos = 50;                                   // 0 = derribado, 100 = derribado del otro lado
  fight.hcDrift = (Math.random()<0.5?-1:1) * (9 + o.wrestling*0.14) * tierDifficulty() * gapMult();
  fight.hcSafe = clamp(dz(26 + diff*0.3), 12, 40);     // ancho de zona "Defendido"
  fight.hcHoldMs = clamp(dw(3600), 1800, 3600);
  fight.hcOk = 0;
  fight.phase='hipcontrol';
  fight._start=performance.now();
  render();
  cancelAnimationFrame(rafId);
  let lastT=performance.now();
  (function tick(t){
    if(!fight || fight.phase!=='hipcontrol') return;
    const dt=(t-lastT)/1000; lastT=t;
    fight.hcPos += fight.hcDrift*dt;   // antes iba ×10: se caía en medio segundo
    if(fight.hcPos<=0 || fight.hcPos>=100){ resolveHipControl(false); return; }
    const inSafe = Math.abs(fight.hcPos-50) <= fight.hcSafe/2;
    if(inSafe) fight.hcOk += dt*1000;
    const ball=document.getElementById('hcBall'); if(ball) ball.style.left=fight.hcPos+'%';
    const bar=document.getElementById('hcTimer');
    const el=t-fight._start;
    if(bar) bar.style.width=Math.max(0,(1-el/fight.hcHoldMs)*100)+'%';
    if(el>=fight.hcHoldMs){ resolveHipControl(true); return; }
    rafId=requestAnimationFrame(tick);
  })(performance.now());
}
function pushHip(dir){
  if(!fight||fight.phase!=='hipcontrol') return;
  fight.hcPos = clamp(fight.hcPos + dir*7*speedMult(), 1, 99);
  if(Math.sign(fight.hcDrift)===dir && Math.random()<0.5) fight.hcDrift *= -1; // el rival cambia el ángulo
  const ball=document.getElementById('hcBall'); if(ball) ball.style.left=fight.hcPos+'%';
}
function resolveHipControl(survived){
  fight.phase='resolved';
  const ratio = fight.hcOk / fight.hcHoldMs;
  const success = survived && ratio>0.45;
  const crit = survived && ratio>0.78;
  applyOutcome(success, crit, false);
  afterExchangeResolved();
}

/* ---- GRAPPLING variante A: defensa de derribo (secuencia de flechas) ---- */
const ARROWS = ['↑','→','↓','←'];
function beginTakedownDefense(){
  const p=state.player, o=fight.opponent;
  const diff = p.wrestling - o.wrestling;
  const len = diff>12 ? 3 : (diff>-12 ? 4 : 5);
  fight.tdSeq = Array.from({length:len}, ()=>randi(0,3));
  fight.tdInput = [];
  fight.tdLimitMs = clamp(dw(900*len + diff*20)*speedMult(), 900, 6000);
  fight.phase='takedowndef';
  fight._start=performance.now();
  render();
  cancelAnimationFrame(rafId);
  (function tick(t){
    if(!fight || fight.phase!=='takedowndef') return;
    const el=t-fight._start;
    const bar=document.getElementById('tdTimer');
    if(bar) bar.style.width=Math.max(0,(1-el/fight.tdLimitMs)*100)+'%';
    if(el>=fight.tdLimitMs){ resolveTakedownDef(false); return; }
    rafId=requestAnimationFrame(tick);
  })(performance.now());
}
function clickArrow(idx){
  if(!fight||fight.phase!=='takedowndef') return;
  const step=fight.tdInput.length;
  if(fight.tdSeq[step]===idx){
    fight.tdInput.push(idx);
    const el=document.getElementById('tdStep'+step); if(el) el.classList.add('td-done');
    if(fight.tdInput.length>=fight.tdSeq.length){ cancelAnimationFrame(rafId); resolveTakedownDef(true); }
  } else {
    cancelAnimationFrame(rafId); resolveTakedownDef(false);
  }
}
function resolveTakedownDef(success){
  fight.phase='resolved';
  const el = performance.now()-fight._start;
  const crit = success && el < fight.tdLimitMs*0.5;
  applyOutcome(success, crit, false);
  afterExchangeResolved();
}

const ROUND_LABEL = {striking:'En pie', wrestling:'Clinch / derribo', sumision:'Piso / sumisión'};
const EXCHANGES_PER_ROUND = 2;   // peleas más cortas y con más ritmo
const GUARD_TOP = {0:'8%', 1:'44%', 2:'80%'};

function startFight(){
  const p=state.player, o=pendingOpponent;
  fight = {
    opponent:o, playerHp:100, oppHp:100, playerPoints:0, oppPoints:0, subProgress:0,
    round:0, exchange:0, log:'La pelea está por comenzar…', flash:'', popup:null,
    finished:false, method:null, winner:null, phase:'ready',
    cabalaAvailable: state.player.consumables.cabala>0,
    stamina: 100,
    position: 'pie',
  };
  state.screen='fight';
  render();
}
function clearTimers(){ cancelAnimationFrame(rafId); }
function beginExchange(){
  fight.popup=null; fight.flash='';
  pickAndStartMinigame();
}

/* ============================================================
   MINIJUEGO A — STRIKING TARGET (puntería y timing)
   El rival se desplaza de forma errática y van apareciendo puntos
   débiles (Sien / Mentón / Hígado / Plexo / Muslo) por una ventana
   breve. Tocá el punto antes de que se cierre.
   Velocidad (striking vs rival) agranda el target y alarga la ventana.
   Fuerza: cada punto tiene su propio multiplicador de daño.
   ============================================================ */
const WEAK_POINTS = [
  {id:'sien',   label:'Sien',   mult:1.9,  top:8,  left:30},
  {id:'menton', label:'Mentón', mult:1.65, top:16, left:54},
  {id:'higado', label:'Hígado', mult:1.35, top:40, left:31},
  {id:'plexo',  label:'Plexo',  mult:1.15, top:33, left:55},
  {id:'muslo',  label:'Muslo',  mult:0.7,  top:66, left:40},
];
function beginStrikingTarget(){
  const p=state.player, o=fight.opponent;
  const diff = effStriking() - o.striking;
  fight.stRadius   = clamp(dz(52 + diff*0.45)*reachMult(), 30, 88);   // más grande y depende del rival                       // velocidad -> target más grande
  fight.stSpawnMs  = clamp(dw(1250 + diff*11), 330, 2100) * scoutMult();     // ventana por aparición
  fight.stSpawnsLeft = 3;
  fight.stDrift = 0; fight.stDriftDir = Math.random()<0.5?-1:1;
  fight.stSpeed = clamp((1.5 - diff*0.011) / rookieEase(), 0.5, 2.6);   // peor que él = se mueve más rápido
  fight.phase='striketarget';
  spawnWeakPoint();
  render();
  startStrikeAnim();
}
function spawnWeakPoint(){
  const prev = fight.stPoint;
  let pick = choice(WEAK_POINTS);
  let guard=0;
  while(prev && pick.id===prev.id && guard++<8) pick = choice(WEAK_POINTS);
  fight.stPoint = pick;
  fight.stSpawnAt = performance.now();
}
function paintWeakPoint(){
  const dot = document.getElementById('stDot');
  if(!dot || !fight.stPoint) return;
  dot.style.top  = fight.stPoint.top+'%';
  dot.style.left = fight.stPoint.left+'%';
  dot.textContent = fight.stPoint.label;
  dot.classList.remove('st-pop'); void dot.offsetWidth; dot.classList.add('st-pop');
}
function startStrikeAnim(){
  cancelAnimationFrame(rafId);
  function tick(t){
    if(!fight || fight.phase!=='striketarget') return;
    // deriva errática: cambia de dirección sin aviso y a veces pega un lunge
    const sp = fight.stSpeed||2;
    if(Math.random()<0.045) fight.stDriftDir *= -1;
    if(Math.random()<0.014) fight.stDrift += fight.stDriftDir*11*sp;   // amague brusco
    fight.stDrift += fight.stDriftDir*(0.9 + Math.random()*2.2)*sp;
    if(Math.abs(fight.stDrift)>26) fight.stDriftDir = -Math.sign(fight.stDrift);
    const fig = document.getElementById('stFigure');
    if(fig) fig.style.transform = 'translateX('+fight.stDrift.toFixed(1)+'px)';
    const since = t - fight.stSpawnAt;
    const bar = document.getElementById('stTimer');
    if(bar) bar.style.width = Math.max(0,(1-since/fight.stSpawnMs)*100)+'%';
    if(since >= fight.stSpawnMs){
      fight.stSpawnsLeft--;
      if(fight.stSpawnsLeft<=0){ resolveStrike(null); return; }
      spawnWeakPoint();
      paintWeakPoint();
    }
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
}
function clickWeakPoint(){
  if(!fight || fight.phase!=='striketarget') return;
  cancelAnimationFrame(rafId);
  resolveStrike(fight.stPoint);
}
function missStrike(){
  if(!fight || fight.phase!=='striketarget') return;
  cancelAnimationFrame(rafId);
  resolveStrike(null);
}
function resolveStrike(point){
  fight.phase='resolved';
  if(!point){ fight.strikeZoneMult=1; fight.strikeZoneName=null; applyOutcome(false,false,false); afterExchangeResolved(); return; }
  const since = performance.now() - fight.stSpawnAt;
  const crit = since < fight.stSpawnMs*0.45;   // reacción rápida = golpe limpio
  fight.strikeZoneMult = point.mult;
  fight.strikeZoneName = point.label;
  applyOutcome(true, crit, false);
  afterExchangeResolved();
}

/* --- WRESTLING: shoot (timing bar) then mash (power struggle) --- */
function currentZone(){
  const p=state.player, o=fight.opponent;
  const diff = p.wrestling - o.wrestling;
  let width = clamp(dz(40+diff*0.7), 6, 74) * scoutMult();
  if(effCardio()<50) width = clamp(width-(50-effCardio())*0.4, 5, 66);
  width = clamp(width, 5, 70);
  const center = clamp(rand(width/2+4, 96-width/2-4), 6, 94);
  return {left:center-width/2, width, center};
}
function speedFactor(){ const o=fight.opponent; return 1.1 + o.wrestling*0.013; }
function beginWrestlingShoot(){
  fight.barContext='wrestlingShoot';
  zoneData = currentZone();
  fight.phase='barrunning'; fight.marker=0; fight._start=performance.now();
  render();
  startBarAnimation();
}
function startBarAnimation(){
  cancelAnimationFrame(rafId);
  const speed = speedFactor();
  function tick(t){
    if(!fight || fight.phase!=='barrunning') return;
    const elapsed=(t-fight._start)/1000;
    const pos=(Math.sin(elapsed*speed*2.4)+1)/2*100;
    fight.marker = pos;
    const marker = document.getElementById('fMarker');
    if(marker) marker.style.left = pos+'%';
    if(elapsed>3.2){ resolveBar(true); return; }
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
}
function hitAction(){ if(!fight || fight.phase!=='barrunning') return; cancelAnimationFrame(rafId); resolveBar(false); }
function resolveBar(timedOut){
  fight.phase='resolved';
  const z=zoneData;
  const inZone = !timedOut && fight.marker>=z.left && fight.marker<=z.left+z.width;
  // derribo iniciado -> ahora hay que completarlo con el memotest de guardia
  if(inZone){ beginMemoDefense(); } else { applyOutcome(false,false,false); afterExchangeResolved(); }
}
function beginMash(kind){
  fight.phase='mashing'; fight.mashKind=kind; fight.mashMeter=0; fight._start=performance.now(); fight.mashTimeLimit=2600;
  render();
  startMashAnimation();
}
function startMashAnimation(){
  cancelAnimationFrame(rafId);
  let lastT = performance.now();
  function tick(t){
    if(!fight || fight.phase!=='mashing') return;
    const dt = t-lastT; lastT=t;
    const el = t-fight._start;
    const cat = fight.currentCat; const oStat = fight.opponent[cat];
    // gentler decay so a determined masher can actually fill it
    const decayPerSec = 2.2 + oStat*0.05;
    fight.mashMeter = clamp(fight.mashMeter-decayPerSec*(dt/1000), 0, 140);
    const fillEl = document.getElementById('mashFill');
    if(fillEl) fillEl.style.width = Math.min(100,fight.mashMeter)+'%';
    if(el>=fight.mashTimeLimit){ resolveMash(); return; }
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
}
function mashClick(){
  if(!fight || fight.phase!=='mashing') return;
  fight.mashMeter = clamp(fight.mashMeter+11,0,140);
  const fillEl = document.getElementById('mashFill');
  if(fillEl) fillEl.style.width = Math.min(100,fight.mashMeter)+'%';
}
function resolveMash(){
  fight.phase='resolved';
  const tier = fight.mashMeter>=95?'full':(fight.mashMeter>=40?'partial':'fail');
  applyMashOutcome(fight.mashKind, tier);
  afterExchangeResolved();
}
function applyMashOutcome(kind, tier){
  if(tier==='fail'){ applyOutcome(false, false); return; }
  fight.flash='flash-hit';
  if(kind==='wrestling'){
    if(tier==='full'){
      // big slam — real damage
      const dmg = randi(20,30);
      fight.oppHp=clamp(fight.oppHp-dmg,0,100); fight.playerPoints+=dmg+6;
      fight.log='¡SLAM BRUTAL! Lo levantaste y lo estrellaste contra la lona.';
      fight.popup={side:'opp', text:'-'+dmg};
    } else {
      // partial now actually hurts
      const dmg = randi(10,16);
      fight.oppHp=clamp(fight.oppHp-dmg,0,100); fight.playerPoints+=dmg+3;
      fight.log='Completaste el derribo y lo castigaste desde arriba.';
      fight.popup={side:'opp', text:'-'+dmg};
    }
  } else {
    if(tier==='full'){
      const prog = randi(30,44); fight.subProgress=clamp(fight.subProgress+prog,0,100); fight.playerPoints+=Math.round(prog/2);
      fight.log='¡Cerraste la llave casi por completo! Está a punto de rendirse.';
      fight.popup={side:'opp', text:'SUM +'+prog};
    } else {
      const prog = randi(16,24); fight.subProgress=clamp(fight.subProgress+prog,0,100); fight.playerPoints+=Math.round(prog/2);
      fight.log='Mejoraste muchísimo la posición y avanzaste con la sumisión.';
      fight.popup={side:'opp', text:'SUM +'+prog};
    }
  }
}

/* ============================================================
   MINIJUEGO B — CONEXIÓN DE NODOS (sumisión)
   Para cerrar una Guillotina / Armbar / Mata León aparecen nodos
   numerados sobre el cuerpo. Conectalos EN ORDEN antes de que
   el rival se libere. Más Sumisión = menos nodos y más tiempo.
   ============================================================ */
const SUB_NAMES = ['Guillotina','Armbar','Mata León','Triangular','Kimura'];
function beginSubNodes(){
  const p=state.player, o=fight.opponent;
  const diff = p.sumision - o.sumision;
  const n = diff>12 ? 4 : (diff>-12 ? 5 : 6);          // lucha/BJJ reduce la cantidad de nodos
  const pts=[];
  for(let i=0;i<n;i++){
    let tries=0, pos;
    do{ pos={x:rand(14,86), y:rand(12,88)}; tries++; }
    while(tries<50 && pts.some(q=>Math.hypot(q.x-pos.x, q.y-pos.y) < 24));
    pts.push(pos);
  }
  fight.snName  = choice(SUB_NAMES);
  fight.snNodes = pts.map((pos,i)=>({x:pos.x, y:pos.y, n:i+1}));
  fight.snNext  = 1;
  fight.snLimitMs = clamp(dw(4200 + diff*30), 1500, 6800) * scoutMult();
  fight.phase='subnodes';
  fight._start = performance.now();
  render();
  startSubNodesTimer();
}
function startSubNodesTimer(){
  cancelAnimationFrame(rafId);
  function tick(t){
    if(!fight || fight.phase!=='subnodes') return;
    const el = t-fight._start;
    const bar = document.getElementById('snTimer');
    if(bar) bar.style.width = Math.max(0,(1-el/fight.snLimitMs)*100)+'%';
    if(el>=fight.snLimitMs){ resolveSubNodes(false); return; }
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
}
function clickSubNode(n){
  if(!fight || fight.phase!=='subnodes') return;
  if(n!==fight.snNext){                                  // orden incorrecto = se libera
    cancelAnimationFrame(rafId);
    resolveSubNodes(false);
    return;
  }
  const el = document.getElementById('snNode'+n);
  if(el) el.classList.add('sn-done');
  fight.snNext++;
  const prog = document.getElementById('snProgress');
  if(prog) prog.textContent = (fight.snNext-1)+' / '+fight.snNodes.length;
  if(fight.snNext > fight.snNodes.length){
    cancelAnimationFrame(rafId);
    resolveSubNodes(true);
  }
}
function resolveSubNodes(success){
  fight.phase='resolved';
  const el = performance.now()-fight._start;
  const crit = success && el < fight.snLimitMs*0.55;      // la cerraste rápido
  applyOutcome(success, crit, false);
  afterExchangeResolved();
}

/* ============================================================
   MINIJUEGO C — MEMOTEST DE GUARDIA (defensa de derribo / G&P)
   Se encienden posiciones de guardia en secuencia; después se
   tapan y tenés que repetirlas en el mismo orden para completar
   el derribo y castigar desde arriba.
   Más Wrestling = secuencia más corta. Mentón alto = intento extra.
   ============================================================ */
const GUARD_SLOTS = [
  {k:0, label:'🥊 Jab'},      {k:1, label:'🤜 Cross'},   {k:2, label:'🦵 Low kick'},
  {k:3, label:'🛡️ Sprawl'},   {k:4, label:'🤼 Clinch'},  {k:5, label:'🦿 Rodillazo'},
];
function beginMemoDefense(){
  const p=state.player, o=fight.opponent;
  const diff = p.wrestling - o.wrestling;
  const len = diff>12 ? 3 : (diff>-12 ? 4 : 5);
  fight.mdSeq   = Array.from({length:len}, ()=>randi(0,GUARD_SLOTS.length-1));
  fight.mdInput = [];
  fight.mdMaxLives = p.chin>=60 ? 2 : 1;                  // resistencia -> intento extra
  fight.mdLives = fight.mdMaxLives;
  fight.phase='memoshow';
  render();
  playMemoSequence(0);
}
function playMemoSequence(i){
  if(!fight || fight.phase!=='memoshow') return;
  if(i>=fight.mdSeq.length){
    setTimeout(()=>{
      if(fight && fight.phase==='memoshow'){ fight.phase='memoinput'; render(); startMemoTimer(); }
    }, 340);
    return;
  }
  const slot = fight.mdSeq[i];
  const flashMs = fight.mdFlashMs || 430;
  const gapMs   = fight.mdGapMs   || 140;
  highlightMemoSlot(slot, true);
  setTimeout(()=>{
    highlightMemoSlot(slot, false);
    setTimeout(()=>playMemoSequence(i+1), gapMs);
  }, flashMs);
}
function highlightMemoSlot(idx, on){
  const el = document.getElementById('mdSlot'+idx);
  if(el) el.classList.toggle('md-lit', on);
}
function startMemoTimer(){
  cancelAnimationFrame(rafId);
  fight._start = performance.now();
  fight.mdLimitMs = Math.round((fight.mdIsHard?900:1350)*fight.mdSeq.length * rookieEase() / (tierDifficulty()*gapMult()));
  function tick(t){
    if(!fight || fight.phase!=='memoinput') return;
    const el = t-fight._start;
    const bar = document.getElementById('mdTimer');
    if(bar) bar.style.width = Math.max(0,(1-el/fight.mdLimitMs)*100)+'%';
    if(el>=fight.mdLimitMs){ resolveMemoDefense(false); return; }
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
}
function clickMemoSlot(idx){
  if(!fight || fight.phase!=='memoinput') return;
  highlightMemoSlot(idx, true);
  setTimeout(()=>highlightMemoSlot(idx,false), 170);
  const step = fight.mdInput.length;
  if(fight.mdSeq[step]===idx){
    fight.mdInput.push(idx);
    const prog = document.getElementById('mdProgress');
    if(prog) prog.textContent = fight.mdInput.length+' / '+fight.mdSeq.length;
    if(fight.mdInput.length>=fight.mdSeq.length){
      cancelAnimationFrame(rafId);
      resolveMemoDefense(true);
    }
  } else {
    fight.mdLives--;
    if(fight.mdLives<=0){ cancelAnimationFrame(rafId); resolveMemoDefense(false); return; }
    fight.mdInput = [];
    const prog = document.getElementById('mdProgress');
    if(prog) prog.textContent = '0 / '+fight.mdSeq.length+' · te queda 1 intento';
  }
}
function resolveMemoDefense(success){
  fight.phase='resolved';
  const perfect = success && fight.mdLives>=fight.mdMaxLives;
  applyOutcome(success, perfect, false);
  afterExchangeResolved();
}


/* ---- STRIKING: contragolpe (pura reacción) ---- */
function beginCounterShot(){
  fight.csReady=false; fight.csJumped=false;
  fight.csWindow = clamp(dw(760)*speedMult(), 260, 950);
  fight.phase='countershot';
  render();
  cancelAnimationFrame(rafId);
  const wait = randi(700,1900);
  fight._csTimer = setTimeout(()=>{
    if(!fight || fight.phase!=='countershot') return;
    fight.csReady=true; fight.csAt=performance.now();
    const b=document.getElementById('csBtn');
    if(b){ b.classList.add('cs-live'); b.textContent='¡CONTRAGOLPEÁ!'; }
    fight._csFail = setTimeout(()=>{
      if(fight && fight.phase==='countershot'){ resolveCounterShot(false,false,false); }
    }, fight.csWindow);
  }, wait);
}
function tapCounterShot(){
  if(!fight || fight.phase!=='countershot') return;
  clearTimeout(fight._csTimer); clearTimeout(fight._csFail);
  if(!fight.csReady){ resolveCounterShot(false,false,true); return; }   // te adelantaste
  const rt = performance.now()-fight.csAt;
  resolveCounterShot(true, rt < fight.csWindow*0.45, false);
}
function resolveCounterShot(ok, crit, early){
  fight.phase='resolved';
  fight.strikeZoneMult = ok?1.5:1;
  applyOutcome(ok, !!crit, false);
  if(early) fight.log='Te adelantaste, se dio cuenta y te comió de contra.';
  afterExchangeResolved();
}

/* ---- STRIKING: combinación 1-2-3 ---- */
function beginComboChain(){
  const p=state.player,o=fight.opponent;
  const diff = effStriking()-o.striking;
  fight.ccOrder = shuffle([0,1,2]);
  fight.ccNext = 0;
  fight.ccLimit = clamp(dw(2600+diff*14)*reachMult(), 900, 3600);
  fight.ccHide = false;
  setTimeout(()=>{ if(fight && fight.phase==='combochain'){ fight.ccHide=true;
    for(let z=0;z<3;z++){ const el=document.getElementById('ccLbl'+z); if(el) el.textContent='?'; } } },
    clamp(dw(1000), 380, 1200));
  fight.phase='combochain';
  fight._start=performance.now();
  render();
  cancelAnimationFrame(rafId);
  (function tick(t){
    if(!fight || fight.phase!=='combochain') return;
    const el=t-fight._start;
    const bar=document.getElementById('ccTimer'); if(bar) bar.style.width=Math.max(0,(1-el/fight.ccLimit)*100)+'%';
    if(el>=fight.ccLimit){ resolveComboChain(false); return; }
    rafId=requestAnimationFrame(tick);
  })(performance.now());
}
function clickCombo(zone){
  if(!fight || fight.phase!=='combochain') return;
  if(fight.ccOrder[fight.ccNext]!==zone){ cancelAnimationFrame(rafId); resolveComboChain(false); return; }
  const el=document.getElementById('ccZone'+zone); if(el) el.classList.add('zone-open');
  fight.ccNext++;
  if(fight.ccNext>=3){ cancelAnimationFrame(rafId); resolveComboChain(true); }
}
function resolveComboChain(ok){
  fight.phase='resolved';
  const el=performance.now()-fight._start;
  fight.strikeZoneMult = ok?1.45:1;
  applyOutcome(ok, ok && el<fight.ccLimit*0.5, false);
  afterExchangeResolved();
}

/* ---- WRESTLING: pelea contra la reja (tug of war) ---- */
function beginCageBattle(){
  const o=fight.opponent;
  fight.cbPos=50;
  fight.cbPush=(6+o.wrestling*0.11)*tierDifficulty()*gapMult();
  fight.cbLimit=clamp(dw(3600),1900,3800);
  fight.phase='cagebattle';
  fight._start=performance.now();
  render();
  cancelAnimationFrame(rafId);
  let lastT=performance.now();
  (function tick(t){
    if(!fight || fight.phase!=='cagebattle') return;
    const dt=(t-lastT)/1000; lastT=t;
    fight.cbPos = clamp(fight.cbPos - fight.cbPush*dt, 0, 100);
    const f=document.getElementById('cbFill'); if(f) f.style.width=fight.cbPos+'%';
    if(fight.cbPos<=0){ resolveCageBattle(false); return; }
    if(fight.cbPos>=100){ resolveCageBattle(true); return; }
    const el=t-fight._start;
    const bar=document.getElementById('cbTimer'); if(bar) bar.style.width=Math.max(0,(1-el/fight.cbLimit)*100)+'%';
    if(el>=fight.cbLimit){ resolveCageBattle(fight.cbPos>=72); return; }
    rafId=requestAnimationFrame(tick);
  })(performance.now());
}
function pushCage(){
  if(!fight || fight.phase!=='cagebattle') return;
  fight.cbPos=clamp(fight.cbPos+4.5*speedMult(),0,100);
  const f=document.getElementById('cbFill'); if(f) f.style.width=fight.cbPos+'%';
  if(fight.cbPos>=100){ cancelAnimationFrame(rafId); resolveCageBattle(true); }
}
function resolveCageBattle(ok){
  fight.phase='resolved';
  applyOutcome(ok, ok && fight.cbPos>=99, false);
  afterExchangeResolved();
}

/* ---- SUMISIÓN: escapar de la llave (defensivo) ---- */
function beginSubEscape(){
  const p=state.player,o=fight.opponent;
  fight.seEscape=0;
  fight.seLock=0;
  fight.seRate=(11+o.sumision*0.16)*tierDifficulty()*gapMult();
  fight.phase='subescape';
  fight._start=performance.now();
  render();
  cancelAnimationFrame(rafId);
  let lastT=performance.now();
  (function tick(t){
    if(!fight || fight.phase!=='subescape') return;
    const dt=(t-lastT)/1000; lastT=t;
    fight.seLock=clamp(fight.seLock+fight.seRate*dt,0,100);
    const l=document.getElementById('seLock'); if(l) l.style.width=fight.seLock+'%';
    if(fight.seLock>=100){ resolveSubEscape(false); return; }
    rafId=requestAnimationFrame(tick);
  })(performance.now());
}
function tapEscape(){
  if(!fight || fight.phase!=='subescape') return;
  fight.seEscape=clamp(fight.seEscape+5*speedMult(),0,100);
  const e=document.getElementById('seEsc'); if(e) e.style.width=fight.seEscape+'%';
  if(fight.seEscape>=100){ cancelAnimationFrame(rafId); resolveSubEscape(true); }
}
function resolveSubEscape(ok){
  fight.phase='resolved';
  applyOutcome(ok, ok && fight.seLock<55, false);
  afterExchangeResolved();
}


/* ---- DEFENSA DE STRIKING: bloquear la zona que ataca ---- */
function beginBlockDefense(){
  const p=state.player,o=fight.opponent;
  const diff = p.chin + effStriking()*0.5 - o.striking*1.2;
  fight.bdZone = randi(0,2);
  fight.bdWindow = clamp(dw(1150 + diff*8)*speedMult(), 380, 1800);
  fight.phase='blockdef';
  fight._start=performance.now();
  render();
  cancelAnimationFrame(rafId);
  (function tick(t){
    if(!fight || fight.phase!=='blockdef') return;
    const el=t-fight._start;
    const bar=document.getElementById('bdTimer'); if(bar) bar.style.width=Math.max(0,(1-el/fight.bdWindow)*100)+'%';
    if(el>=fight.bdWindow){ resolveBlockDefense(null); return; }
    rafId=requestAnimationFrame(tick);
  })(performance.now());
}
function clickBlock(z){ if(!fight||fight.phase!=='blockdef') return; cancelAnimationFrame(rafId); resolveBlockDefense(z); }
function resolveBlockDefense(z){
  fight.phase='resolved';
  const ok = z!==null && z===fight.bdZone;
  const el = performance.now()-fight._start;
  applyOutcome(ok, ok && el<fight.bdWindow*0.5, false);
  afterExchangeResolved();
}

/* ---- DEFENSA DE DERRIBO: timing del sprawl ---- */
function beginSprawlDefense(){
  const p=state.player,o=fight.opponent;
  const diff = p.wrestling - o.wrestling;
  const w = clamp(dz(30+diff*0.6), 7, 60);
  const c = clamp(rand(w/2+5, 95-w/2), 8, 92);
  fight.spZone={left:c-w/2,width:w};
  fight.spSpeed=1.4+o.wrestling*0.014*tierDifficulty()*gapMult();
  fight.spMarker=0;
  fight.phase='sprawldef';
  fight._start=performance.now();
  render();
  cancelAnimationFrame(rafId);
  (function tick(t){
    if(!fight || fight.phase!=='sprawldef') return;
    const el=(t-fight._start)/1000;
    fight.spMarker=(Math.sin(el*fight.spSpeed*2.4)+1)/2*100;
    const m=document.getElementById('spMarker'); if(m) m.style.left=fight.spMarker+'%';
    if(el>3.0){ resolveSprawl(true); return; }
    rafId=requestAnimationFrame(tick);
  })(performance.now());
}
function hitSprawl(){ if(!fight||fight.phase!=='sprawldef') return; cancelAnimationFrame(rafId); resolveSprawl(false); }
function resolveSprawl(timedOut){
  fight.phase='resolved';
  const z=fight.spZone;
  const ok = !timedOut && fight.spMarker>=z.left && fight.spMarker<=z.left+z.width;
  applyOutcome(ok, ok && Math.abs(fight.spMarker-(z.left+z.width/2))<z.width*0.25, false);
  afterExchangeResolved();
}

/* ---- ESQUIVAR EL KO: última chance cuando te están por noquear ---- */
function beginSurviveKO(){
  fight.svLeft = state.player.chin>=65 ? 2 : 3;   // buen mentón = menos golpes que aguantar
  fight.svZone = randi(0,2);
  fight.svWindow = clamp(dw(760)*speedMult(), 300, 1050);
  fight.svAt = performance.now();
  fight.phase='surviveko';
  render();
  cancelAnimationFrame(rafId);
  (function tick(t){
    if(!fight || fight.phase!=='surviveko') return;
    const since=t-fight.svAt;
    const bar=document.getElementById('svTimer'); if(bar) bar.style.width=Math.max(0,(1-since/fight.svWindow)*100)+'%';
    if(since>=fight.svWindow){ resolveSurvive(false); return; }
    rafId=requestAnimationFrame(tick);
  })(performance.now());
}
function dodgeKO(z){
  if(!fight || fight.phase!=='surviveko') return;
  if(z!==fight.svZone){ cancelAnimationFrame(rafId); resolveSurvive(false); return; }
  fight.svLeft--;
  if(fight.svLeft<=0){ cancelAnimationFrame(rafId); resolveSurvive(true); return; }
  fight.svZone = randi(0,2); fight.svAt = performance.now();
  render();
  cancelAnimationFrame(rafId);
  (function tick(t){
    if(!fight || fight.phase!=='surviveko') return;
    const since=t-fight.svAt;
    const bar=document.getElementById('svTimer'); if(bar) bar.style.width=Math.max(0,(1-since/fight.svWindow)*100)+'%';
    if(since>=fight.svWindow){ resolveSurvive(false); return; }
    rafId=requestAnimationFrame(tick);
  })(performance.now());
}
function resolveSurvive(ok){
  fight.phase='resolved';
  if(ok){
    fight.playerHp = randi(12,20);
    fight.log = '¡Aguantaste el chaparrón! Sobreviviste al round de milagro.';
    fight.popup=null; fight.counter=null;
    render();
    setTimeout(()=>{
      if(!fight || fight.finished) return;
      fight.exchange++;
      if(fight.exchange>=EXCHANGES_PER_ROUND){ fight.exchange=0; fight.round++; if(fight.round>=ROUNDS.length){ finishFight(null,null); return; } }
      pickAndStartMinigame();
    }, 560);
  } else {
    finishFight('loss','Nocaut técnico');
  }
}

/* ---- CONTRAATAQUE: ventana corta después de defender bien ---- */
function beginCounterWindow(){
  fight.cwWindow = clamp(dw(820), 320, 900);
  fight.phase='counterwindow';
  fight._start=performance.now();
  render();
  cancelAnimationFrame(rafId);
  (function tick(t){
    if(!fight || fight.phase!=='counterwindow') return;
    const el=t-fight._start;
    const bar=document.getElementById('cwTimer'); if(bar) bar.style.width=Math.max(0,(1-el/fight.cwWindow)*100)+'%';
    if(el>=fight.cwWindow){ resolveCounterWindow(false); return; }
    rafId=requestAnimationFrame(tick);
  })(performance.now());
}
function takeCounter(){ if(!fight||fight.phase!=='counterwindow') return; cancelAnimationFrame(rafId); resolveCounterWindow(true); }
function resolveCounterWindow(ok){
  fight.phase='resolved';
  if(ok){
    const dmg = randi(12,22);
    fight.oppHp = clamp(fight.oppHp-dmg,0,100);
    fight.playerPoints += dmg;
    fight.log = '¡Contraataque perfecto! Lo agarraste saliendo.';
    fight.popup = {side:'opp', text:'-'+dmg};
  } else {
    fight.log = 'Se te fue la ventana del contraataque.';
    fight.popup = null;
  }
  render();
  setTimeout(()=>{
    if(!fight || fight.finished) return;
    if(fight.oppHp<=0){ triggerKO('Nocaut'); return; }
    fight.exchange++;
    if(fight.exchange>=EXCHANGES_PER_ROUND){ fight.exchange=0; fight.round++; if(fight.round>=ROUNDS.length){ finishFight(null,null); return; } }
    pickAndStartMinigame();
  }, 340);
}


/* ---- SUMISIÓN (avanzado): cadencia — timing puro, 4 pulsos seguidos ---- */
function beginSubRhythm(){
  const p=state.player,o=fight.opponent;
  const diff = p.sumision - o.sumision;
  fight.rhTotal = 4; fight.rhDone = 0; fight.rhMiss = 0;
  fight.rhTravel = clamp(dw(1250 + diff*8), 620, 1600);   // lo que tarda en bajar
  fight.rhWindow = clamp(dw(230 + diff*2), 95, 300);      // franja de acierto
  fight.phase='subrhythm';
  render();
  spawnRhythmNote();
}
function spawnRhythmNote(){
  if(!fight || fight.phase!=='subrhythm') return;
  fight.rhStart = performance.now();
  fight.rhResolved = false;
  const note = document.getElementById('rhNote');
  if(note){ note.style.transition='none'; note.style.top='0%';
    void note.offsetWidth;
    note.style.transition = `top ${fight.rhTravel}ms linear`;
    note.style.top='86%'; }
  cancelAnimationFrame(rafId);
  (function tick(t){
    if(!fight || fight.phase!=='subrhythm' || fight.rhResolved) return;
    if(t - fight.rhStart >= fight.rhTravel + fight.rhWindow){ rhythmJudge(false); return; }
    rafId=requestAnimationFrame(tick);
  })(performance.now());
}
function tapRhythm(){
  if(!fight || fight.phase!=='subrhythm' || fight.rhResolved) return;
  const el = performance.now() - fight.rhStart;
  const ok = Math.abs(el - fight.rhTravel) <= fight.rhWindow;
  rhythmJudge(ok);
}
function rhythmJudge(ok){
  fight.rhResolved = true;
  cancelAnimationFrame(rafId);
  if(ok) fight.rhDone++; else fight.rhMiss++;
  const fb=document.getElementById('rhFeed');
  if(fb){ fb.textContent = ok? '¡EXACTO!' : 'FUERA DE TIEMPO'; fb.style.color = ok? 'var(--neon)':'var(--red)'; }
  const cnt=document.getElementById('rhCount'); if(cnt) cnt.textContent = fight.rhDone+' / '+fight.rhTotal;
  if(fight.rhMiss>=2){ setTimeout(()=>resolveSubRhythm(false), 320); return; }
  if(fight.rhDone>=fight.rhTotal){ setTimeout(()=>resolveSubRhythm(true), 320); return; }
  setTimeout(spawnRhythmNote, 340);
}
function resolveSubRhythm(ok){
  if(!fight || fight.phase!=='subrhythm') return;
  fight.phase='resolved';
  applyOutcome(ok, ok && fight.rhMiss===0, false);
  afterExchangeResolved();
}


/* ---- PISO (arriba): ground & pound ---- */
function beginGroundPound(){
  const p=state.player,o=fight.opponent;
  const diff = p.wrestling - o.wrestling;
  const w = clamp(dz(24 + diff*0.4)*powerMult(), 8, 46);
  const c = clamp(rand(w/2+5, 95-w/2), 8, 92);
  fight.gpZ = {left:c-w/2, width:w};
  fight.gpSpeed = 1.5 + o.wrestling*0.013*tierDifficulty()*gapMult();
  fight.gpMark = 0;
  fight.phase='groundpound'; fight._start=performance.now(); render();
  cancelAnimationFrame(rafId);
  (function tick(t){
    if(!fight || fight.phase!=='groundpound') return;
    const el=(t-fight._start)/1000;
    fight.gpMark=(Math.sin(el*fight.gpSpeed*2.4)+1)/2*100;
    const m=document.getElementById('gpMark'); if(m) m.style.left=fight.gpMark+'%';
    if(el>3.0){ resolveGroundPound(true); return; }
    rafId=requestAnimationFrame(tick);
  })(performance.now());
}
function hitGroundPound(){ if(!fight||fight.phase!=='groundpound') return; cancelAnimationFrame(rafId); resolveGroundPound(false); }
function resolveGroundPound(timedOut){
  fight.phase='resolved';
  const z=fight.gpZ;
  const ok = !timedOut && fight.gpMark>=z.left && fight.gpMark<=z.left+z.width;
  applyOutcome(ok, ok && Math.abs(fight.gpMark-(z.left+z.width/2))<z.width*0.3, false);
  afterExchangeResolved();
}
/* ---- PISO (abajo): levantarte ---- */
function beginStandUp(){

}
function pushStandUp(){

/* --- shared outcome application --- */
function applyOutcome(success, crit, hitCover){
  const p=state.player, o=fight.opponent;
  const cat = fight.currentCat;
  const oStat=o[cat], pStat=p[cat];
  if(success && fight.cabalaAvailable){ crit=true; fight.cabalaAvailable=false; }
  const supportP = (effCardio() + p.chin)/2;
  const gapRaw = Math.max(0, (o[cat]||0) - (myStatFor(cat)*0.85 + supportP*0.15));
  const myDmgMult  = clamp(1 - gapRaw*0.115, 0.18, 1) * powerMult();      // tus golpes rinden menos
  const hisDmgMult = clamp(1 + gapRaw*0.130, 1, 2.9);      // los suyos duelen mucho más
  const chinEdge = p.chin - (o.striking||50);
  const chinAbsorb = clamp(1 - chinEdge*0.007, 0.60, 1.35);   // buen mentón = te hacen menos daño
  const coverPenalty = (hitCover ? 1.3 : 1) * hisDmgMult * chinAbsorb; // hitting straight into the guard = harder counter (softened)
  fight.streak = success ? (fight.streak||0)+1 : 0;
  // --- juegos DEFENSIVOS: no buscás daño, buscás no comerte uno ---
  if(fight.isDefensive){
    if(success){
      fight.flash='flash-hit';
      fight.playerPoints += 4;
      fight.log = choice(['Lo leíste perfecto y no te tocó.','Defensa impecable, no conectó nada.','Bloqueaste todo y saliste limpio.']);
      fight.popup = {side:'opp', text:'DEFENDIDO'};
      fight.canCounter = true;                       // se abre la chance de contraatacar
    } else {
      fight.flash='flash-miss';
      const oStatV = o[cat];                          // el estilo en el que te está atacando
      // duele según lo bueno que sea el rival EN ESE ESTILO, pero nunca te mata de un saque
      const absorbD = clamp(1 - (p.chin-(o.striking||50))*0.007, 0.60, 1.35);
      const dmg = clamp(Math.round((7 + oStatV*0.24) * Math.min(hisDmgMult,2.0) * absorbD), 4, 34);
      fight.playerHp = clamp(fight.playerHp-dmg,0,100);
      fight.oppPoints += dmg;
      const nm = cat==='striking' ? 'Te reventó con la mano pesada.' : (cat==='wrestling' ? 'Te llevó al piso y te castigó arriba.' : 'Cerró la llave y te hizo sufrir.');
      fight.log = nm;
      fight.popup = {side:'me', text:'-'+dmg};
      fight.counter = {ico: cat==='striking'?'🥊':(cat==='wrestling'?'🤼':'🐍'), txt:'¡TE CASTIGÓ!', dmg};
    }
    return;
  }
  if(success && gapRaw>2){
    // te sacó ventaja de nivel: aunque conectes, él te devuelve
    const back = Math.max(1, Math.round(randi(4,8) + gapRaw*2.60 - p.chin*0.03));
    fight.playerHp = clamp(fight.playerHp-back,0,100);
    fight.oppPoints += back;
    fight.counter = {ico:choice(['🥊','🤜']), txt:'TE DEVOLVIÓ', dmg:back};
  }
  if(success){
    fight.flash='flash-hit';
    if(cat==='striking'){
      const zoneMult = fight.strikeZoneMult || 1;
      // base más baja porque los puntos débiles multiplican hasta ×1.9
      const dmg = Math.max(1, Math.round((crit?randi(12,18):randi(6,11)) * zoneMult * myDmgMult));
      fight.oppHp=clamp(fight.oppHp-dmg,0,100); fight.playerPoints+=dmg;
      const zoneNote = zoneMult>1.3 ? '¡A la cabeza! ' : (zoneMult<0.8 ? 'Le pegaste a la pierna. ' : '');
      fight.log=zoneNote+choice(HIT_LINES.striking); fight.popup={side:'opp',text:'-'+dmg};
    } else if(cat==='wrestling'){
      const dmg = Math.max(1, Math.round((crit?randi(18,28):randi(9,16)) * myDmgMult));
      fight.oppHp=clamp(fight.oppHp-dmg,0,100); fight.playerPoints+=dmg+4;
      fight.log=choice(HIT_LINES.wrestling); fight.popup={side:'opp',text:'-'+dmg};
    } else {
      const prog = Math.max(4, Math.round((crit?randi(34,50):randi(20,30)) * myDmgMult));
      fight.subProgress=clamp(fight.subProgress+prog,0,100); fight.oppHp=clamp(fight.oppHp-randi(6,10),0,100);
      fight.playerPoints+=Math.round(prog/2);
      fight.log=choice(HIT_LINES.sumision); fight.popup={side:'opp',text:'SUM +'+prog};
    }
  } else {
    fight.flash='flash-miss';
    const gap = Math.max(0, oStat-pStat)*0.14;
    if(cat==='striking'){
      const dmg=Math.max(3, Math.round((rand(10,19)+gap-p.chin*0.05)*coverPenalty));
      fight.playerHp=clamp(fight.playerHp-dmg,0,100); fight.oppPoints+=dmg;
      fight.log = hitCover ? 'Le pegaste justo a la guardia — te bloqueó y te contragolpeó.' : choice(MISS_LINES.striking); fight.popup={side:'me',text:'-'+dmg};
      fight.counter = {ico: choice(['🥊','🦵','🤜']), txt: choice(['¡CONTRA!','¡TE PEGÓ!','¡CONTRAGOLPE!']), dmg};
    } else if(cat==='wrestling'){
      const dmg=Math.max(2, Math.round((rand(6,14)+gap*0.6)*hisDmgMult*clamp(1-(p.chin-(o.striking||50))*0.007,0.60,1.35)));
      fight.playerHp=clamp(fight.playerHp-dmg,0,100); fight.oppPoints+=dmg+3;
      fight.log=choice(MISS_LINES.wrestling); fight.popup={side:'me',text:'-'+dmg};
    } else {
      fight.subProgress=clamp(fight.subProgress-randi(6,16),0,100);
      const dmg=Math.max(2, Math.round((rand(5,12)+gap*0.5)*hisDmgMult*clamp(1-(p.chin-(o.striking||50))*0.007,0.60,1.35)));
      fight.playerHp=clamp(fight.playerHp-dmg,0,100); fight.oppPoints+=dmg;
      fight.log=choice(MISS_LINES.sumision); fight.popup={side:'me',text:'-'+dmg};
    }
  }
}

function afterExchangeResolved(){
  if(fight.stamina!==undefined){
    const drain = clamp(15 - effCardio()*0.10, 4, 15);
    fight.stamina = clamp(fight.stamina - drain, 0, 100);
  }
  render();
  const cat = fight.currentCat;
  if(fight.oppHp<=0){ triggerKO(cat==='sumision'?'Sumisión':'Nocaut'); return; }
  if(fight.playerHp<=0){
    if(!fight.survivedOnce){ fight.survivedOnce=true; setTimeout(()=>{ if(fight&&!fight.finished) beginSurviveKO(); }, 340); return; }
    finishFight('loss','Nocaut técnico'); return;
  }
  if(fight.canCounter){ fight.canCounter=false; setTimeout(()=>{ if(fight&&!fight.finished) beginCounterWindow(); }, 320); return; }
  if(cat==='sumision' && fight.subProgress>=100){ finishFight('win','Sumisión'); return; }
  // FINISH THE FIGHT moment: opponent hurt bad after a landed strike/slam -> chance to end it
  // cuanto mejor es el rival, más larga tiene que ser la racha Y más castigado tiene que estar
  const gapNow = Math.max(0, catGap(fight.currentCat));
  const needStreak = 5 + Math.floor(gapNow*0.8);
  const needHp     = clamp(60 - gapNow*0.9, 24, 60);
  const onFire = (fight.streak||0) >= needStreak && fight.oppHp <= needHp;
  const hurt   = fight.oppHp>0 && fight.oppHp<=22 && fight.popup && fight.popup.side==='opp';
  // OPORTUNIDAD ÚNICA: se abre sola cuando lo lastimaste, sin necesidad de racha
  const landed = fight.popup && fight.popup.side==='opp';
  const golden = landed && fight.oppHp>0 && fight.oppHp<=55 && Math.random() < (0.035 + (55-fight.oppHp)*0.0035);
  if(golden && !fight.finisherOffered){
    fight.goldenChance = true;
    // a veces la situación te elige el remate: no hay menú, hay que resolverla
    fight.forcedFinish = Math.random()<0.5 ? choice(['strike','sub','gnp']) : null;
  }
  if(!fight.finisherOffered && (onFire || hurt || fight.goldenChance) && fight.oppHp>0){
    fight.finisherOffered = true;
    setTimeout(()=>{
      if(!fight || fight.finished) return;
      if(fight.forcedFinish){ const k=fight.forcedFinish; fight.forcedFinish=null; fight.phase='finishchoice'; chooseFinisher(k); }
      else beginFinisherChoice();
    }, 380);
    return;
  }
  setTimeout(()=>{
    if(!fight || fight.finished) return;
    advancePosition(!!(fight.popup && fight.popup.side==='opp'));
    fight.exchange++;
    if(fight.exchange>=EXCHANGES_PER_ROUND){
      fight.exchange=0; fight.round++;
      if(fight.round>=ROUNDS.length){ finishFight(null,null); return; }
    }
    beginExchange();
  }, 1150);
}

/* =========================================================
   FINISHER (fatality-style KO opportunity)
   ========================================================= */
function beginFinisher(){
  fight.phase='finisher';
  fight.finisherLimb = randi(0,2);       // where the opening is
  fight.finisherHidden = false;
  fight.finisherWindowMs = clamp(dw(1100), 480, 1100);         // tight window — high risk/reward
  fight._start = performance.now();
  render();
  cancelAnimationFrame(rafId);
  let hid=false;
  function tick(t){
    if(!fight || fight.phase!=='finisher') return;
    const el = t-fight._start;
    if(!hid && el>=520){ hid=true; fight.finisherHidden=true; const b=document.getElementById('finZone'+fight.finisherLimb); if(b) b.classList.remove('zone-open'); }
    const bar=document.getElementById('finTimer'); if(bar) bar.style.width=Math.max(0,(1-el/fight.finisherWindowMs)*100)+'%';
    if(el>=fight.finisherWindowMs){ resolveFinisher(null); return; }
    rafId=requestAnimationFrame(tick);
  }
  rafId=requestAnimationFrame(tick);
}
function clickFinisher(idx){ if(!fight || fight.phase!=='finisher') return; cancelAnimationFrame(rafId); resolveFinisher(idx); }
function resolveFinisher(idx){
  fight.phase='resolved';
  const landed = idx!==null && idx===fight.finisherLimb;
  if(landed){
    fight.koFlash=true;
    triggerKO('Nocaut');
  } else {
    // missed the finisher — opponent survives, recovers a little, fight continues
    fight.oppHp = clamp(fight.oppHp+randi(6,12),0,100);
    fight.log='¡Erraste el remate! Se recuperó y sigue en pie.';
    fight.popup=null;
    render();
    setTimeout(()=>{
      if(!fight || fight.finished) return;
      fight.exchange++;
      if(fight.exchange>=EXCHANGES_PER_ROUND){ fight.exchange=0; fight.round++; if(fight.round>=ROUNDS.length){ finishFight(null,null); return; } }
      beginExchange();
    }, 1150);
  }
}

/* ============================================================
   REMATE / FATALITY — se desbloquea con racha de 4 aciertos
   Primer plano del rival tambaleándose y elegís CÓMO terminarlo.
   Cada opción abre su propio minijuego difícil.
   ============================================================ */
function beginFinisherChoice(){
  cancelAnimationFrame(rafId);
  fight.phase='finishchoice';
  render();
}
function chooseFinisher(kind){
  if(!fight || fight.phase!=='finishchoice') return;
  if(kind==='strike') beginFinStrike();
  else if(kind==='sub') beginFinSub();
  else beginFinGnp();
}
function failFinisher(msg){
  fight.phase='resolved';
  fight.streak=0;
  fight.oppHp = clamp(fight.oppHp+randi(8,15),1,100);
  fight.log = msg;
  fight.popup=null; fight.counter=null;
  render();
  setTimeout(()=>{
    if(!fight || fight.finished) return;
    fight.exchange++;
    if(fight.exchange>=EXCHANGES_PER_ROUND){
      fight.exchange=0; fight.round++;
      if(fight.round>=ROUNDS.length){ finishFight(null,null); return; }
    }
    pickAndStartMinigame();
  }, 560);
}

/* --- REMATE A: lluvia de golpes al primer plano (4 targets rapidísimos) --- */
const FIN_SPOTS = [{t:22,l:30},{t:18,l:66},{t:44,l:48},{t:34,l:24},{t:40,l:72},{t:58,l:52}];
function beginFinStrike(){
  fight.fsLeft = 4;
  fight.fsWindow = clamp(dw(900), 460, 1100);
  fight.fsSpot = choice(FIN_SPOTS);
  fight.fsAt = performance.now();
  fight.phase='fin_strike';
  render();
  cancelAnimationFrame(rafId);
  (function tick(t){
    if(!fight || fight.phase!=='fin_strike') return;
    const since=t-fight.fsAt;
    const bar=document.getElementById('fsTimer');
    if(bar) bar.style.width=Math.max(0,(1-since/fight.fsWindow)*100)+'%';
    if(since>=fight.fsWindow){ failFinisher('Se te escapó el remate — recuperó la guardia.'); return; }
    rafId=requestAnimationFrame(tick);
  })(performance.now());
}
function hitFinStrike(){
  if(!fight || fight.phase!=='fin_strike') return;
  fight.fsLeft--;
  if(fight.fsLeft<=0){ cancelAnimationFrame(rafId); triggerKO('Nocaut'); return; }
  let nxt=choice(FIN_SPOTS), g=0;
  while(nxt===fight.fsSpot && g++<8) nxt=choice(FIN_SPOTS);
  fight.fsSpot=nxt; fight.fsAt=performance.now();
  const d=document.getElementById('fsDot');
  if(d){ d.style.top=nxt.t+'%'; d.style.left=nxt.l+'%'; d.classList.remove('st-pop'); void d.offsetWidth; d.classList.add('st-pop'); }
  const c=document.getElementById('fsLeft'); if(c) c.textContent=fight.fsLeft;
}
function missFinStrike(){ if(fight && fight.phase==='fin_strike'){ cancelAnimationFrame(rafId); failFinisher('Erraste el remate y te sacó de encima.'); } }

/* --- REMATE B: mata león (apretar contrarreloj, decae fuerte) --- */
function beginFinSub(){

function squeezeFinSub(){

/* --- REMATE C: ground & pound (alternar izquierda/derecha sin fallar) --- */
function beginFinGnp(){
  fight.gpNeed = 12;
  fight.gpDone = 0;
  fight.gpSide = 0;               // 0 = izquierda, 1 = derecha
  fight.gpLimit = clamp(dw(3400),2000,3800);
  fight.phase='fin_gnp';
  fight._start=performance.now();
  render();
  cancelAnimationFrame(rafId);
  (function tick(t){
    if(!fight || fight.phase!=='fin_gnp') return;
    const el=t-fight._start;
    const bar=document.getElementById('gpTimer'); if(bar) bar.style.width=Math.max(0,(1-el/fight.gpLimit)*100)+'%';
    if(el>=fight.gpLimit){ failFinisher('Te quedaste sin nafta arriba y se paró.'); return; }
    rafId=requestAnimationFrame(tick);
  })(performance.now());
}
function gnpHit(side){
  if(!fight || fight.phase!=='fin_gnp') return;
  if(side!==fight.gpSide){ cancelAnimationFrame(rafId); failFinisher('Perdiste el ritmo del ground & pound y se recompuso.'); return; }
  fight.gpDone++; fight.gpSide = 1-fight.gpSide;
  const c=document.getElementById('gpCount'); if(c) c.textContent=fight.gpDone+' / '+fight.gpNeed;
  for(const i of [0,1]){ const b=document.getElementById('gpBtn'+i); if(b) b.classList.toggle('gp-next', i===fight.gpSide); }
  if(fight.gpDone>=fight.gpNeed){ cancelAnimationFrame(rafId); triggerKO('Nocaut'); }
}

function triggerKO(method){
  // freeze the fight and show the KO/blood splash; the splash button finalizes the win
  fight.finished = true;
  fight.koMethod = method;
  cancelAnimationFrame(rafId);
  state.screen='ko';
  render();
}
function continueFromKO(){
  const method = fight.koMethod || 'Nocaut';
  fight.finished = false; // allow finishFight to run its logic cleanly
  finishFight('win', method);
}

function finishFight(forcedWinner, method){
  fight.finished = true;
  let winner = forcedWinner;
  if(!winner){
    const diff = fight.playerPoints - fight.oppPoints;
    if(Math.abs(diff)<6){ winner='draw'; method='Decisión dividida'; }
    else if(diff>0){ winner='win'; method='Decisión unánime'; }
    else { winner='loss'; method='Decisión unánime'; }
  }
  fight.method=method; fight.winner=winner;
  applyFightOutcome(winner, method);
  state.screen='results';
  render();
}

function applyFightOutcome(winner, method){
  const p=state.player, o=fight.opponent;
  const org = ORGS[p.orgId];
  const isFinish = method==='Sumisión' || method==='Nocaut técnico' || method==='Nocaut';
  let moneyDelta, repDelta;
  const baseMoney = state.signedPurse || tierBaseMoney(org.tier);
  const titleMult = o.isTitle ? 2.1 : 1;
  if(winner==='win'){
    p.record.w++; repDelta = isFinish?randi(10,15):randi(6,10);
    moneyDelta = Math.round(baseMoney*titleMult*(isFinish?1.3:1));
    if(isFinish) p.finishes++;
  } else if(winner==='loss'){
    p.record.l++; repDelta = -randi(3,7);
    if(p.staff.psico) repDelta = Math.round(repDelta*0.5);
    moneyDelta = Math.round(baseMoney*0.4*titleMult);
  } else {
    p.record.d++; repDelta = randi(0,2);
    moneyDelta = Math.round(baseMoney*0.6);
  }
  // En UFC cobrás por contrato + bonos de la noche (estructura 2026)
  state.lastBonus = null;
  if(p.orgId==='ufc' && p.contract){
    moneyDelta = p.contract.toFight + (winner==='win' ? p.contract.toWin : 0);
    if(winner==='win' && isFinish){
      if(Math.random()<0.45){ moneyDelta += 100000; state.lastBonus = '🏆 Actuación de la Noche: +'+fmtMoney(100000); }
      else { moneyDelta += 25000; state.lastBonus = '💥 Bono por finalización: +'+fmtMoney(25000); }
    } else if(Math.random()<0.12){
      moneyDelta += 100000; state.lastBonus = '🔥 Pelea de la Noche: +'+fmtMoney(100000);
    }
    const CAP = 400000;   // techo del contrato: sin esto se iba a millones
    if(winner==='win'){
      const mult = o.isTitle ? 1.8 : 1.12;
      p.contract = {toFight: Math.min(CAP, Math.round(p.contract.toFight*mult)),
                    toWin:   Math.min(CAP, Math.round(p.contract.toWin*mult))};
    }
  }
  if(p.staff.rep) moneyDelta = Math.round(moneyDelta*1.2);
  p.money += moneyDelta;
  p.rep = clamp(p.rep+repDelta,0,100);
  // los grandes pelean menos seguido; los chicos hacen más peleas por año
  const tierNow = ORGS[p.orgId].tier;
  p.age += tierNow==='global' ? (0.5 + Math.random()*0.25) : (tierNow==='continental' ? 0.4 : 0.3);
  // desarrollo natural hasta el prime y declive después
  p.ageNotes = [];
  if(p.age < 31){
    const gains = p.age < 26 ? 2 : 1;               // los pibes crecen fuerte
    for(let i=0;i<gains;i++){
      const pool = STAT_KEYS.filter(k=>p[k] < statSoftCap());
      if(!pool.length) break;
      const k = choice(pool);
      const inc = (k===p.specialty) ? 2 : 1;         // tu estilo natural crece más
      p[k] = clamp(p[k]+inc, 10, statSoftCap());
      p.ageNotes.push('Seguís creciendo: +'+inc+' '+STAT_LABELS[k]);
    }
  }
  if(p.age >= 35 && Math.random() < (0.30 + (p.age-35)*0.09)){
    const k = choice(STAT_KEYS);
    p[k] = clamp(p[k]-1, 10, 99);
    p.ageNotes.push('La edad pesa: -1 '+STAT_LABELS[k]);
  }
  p.trainingTokens = 2;
  Object.keys(p.consumables).forEach(k=>{ if(p.consumables[k]>0) p.consumables[k]--; });
  state.boutOffers = null;
  applyRankingResult(winner==='win', o, isFinish);
  if(p.orgId==='ufc') advanceUfcRoster(p.weightClass);
  // el rival de toda la carrera también avanza
  if(p.rival && !p.rival.retired){
    const r=p.rival;
    if(Math.random()<0.68){ r.w++; if(Math.random()<0.4) r.finishes++; } else r.l++;
    if(r.power < 96) r.power += (Math.random()<0.55?1:0);
    if(r.w>=6 && r.titles===0 && Math.random()<0.22) r.titles++;
    else if(r.titles>0 && Math.random()<0.10) r.titles++;
  }
  let promoted=false, becameChamp=false, promotionMsg=null;
  if(o.isDwcs){
    p.dwcsDone = true; p.dwcsPending = false;
    if(winner==='win'){
      repDelta += 28; p.rep = clamp(p.rep+28,0,100);
      p.contractOffer = {toFight:10000, toWin:10000};
      state.lastDwcs = '🌟 ¡Ganaste en la Serie de Contendientes! Dana te ofrece contrato.';
    } else {
      state.lastDwcs = 'Perdiste tu chance en la Serie de Contendientes. Habrá que reconstruir.';
    }
  } else state.lastDwcs = null;
  if(winner==='win' && o.isTitle){
    becameChamp = true;
    if(org.tier!=='global'){
      const nextOrg = ORGS[p.orgChain[p.orgIndex+1]];
      if(p.rep >= nextOrg.repToSign){
        promoted = true; p.orgIndex++; p.orgId = p.orgChain[p.orgIndex];
        const newTier = ORGS[p.orgId].tier;
        promotionMsg = newTier==='continental'
          ? `📄 ${ORGS[p.orgId].name} te ofrece contrato. ¡Subiste al nivel mundial!`
          : `📄 ¡Firmaste con ${ORGS[p.orgId].name}! Llegaste a la élite mundial.`;
      } else {
        promotionMsg = `Sos campeón, pero ${nextOrg.name} pide <b>${nextOrg.repToSign} de reputación</b> para firmarte (tenés ${p.rep}). Seguí construyendo tu nombre.`;
      }
    }
  }
  state.lastResult = {winner, method, moneyDelta, repDelta, opponent:o, becameChamp, promoted, promotionMsg};
}

  <div class="section ${fight.flash}">
    <div class="round-badge">${org.name} · Round ${roundNum}/${ROUNDS.length} · ${ROUND_LABEL[cat]}</div>
    ${state.planRead ? `<div class="plan-read">🕵️ Te leyó el plan: se preparó para tu ${({striking:'striking',wrestling:'lucha',sumision:'sumisión'})[state.gamePlan]}</div>` : ''}
    <div class="fight-vs-line">${flagOf(p)} <b>${p.name}</b> vs ${flagOf(o)} <b>${o.name}</b> ${rankBadge(o)}${o.isTitle?' — ⭐ TITULAR':''}</div>
    <div class="hp-row"><div class="hp-name">${flagOf(p)} ${lastName(p.name)}</div><div class="hp-track"><div class="hp-fill me" style="width:${fight.playerHp}%"></div></div></div>
    <div class="hp-row"><div class="hp-name">${flagOf(o)} ${lastName(o.name)}</div><div class="hp-track"><div class="hp-fill opp" style="width:${fight.oppHp}%"></div></div></div>
    <div class="pos-bar"><span class="pos-chip ${fight.position||'pie'}">${POS_LABEL[fight.position]||'DE PIE'}</span>${fight.pendingShot?'<span class="pos-alert">¡se tira a las piernas!</span>':''}</div>
    <div class="stam-row"><span>AGUANTE</span><div class="stam-track"><div class="stam-fill" style="width:${fight.stamina===undefined?100:fight.stamina}%"></div></div>
      <span class="stam-chin">MENTÓN ${p.chin}</span></div>
    ${cat==='sumision' ? `<div class="helper" style="text-align:center;margin-top:10px;">Progreso de sumisión: <b class="mono" style="color:var(--gold)">${fight.subProgress}%</b></div>`:''}
    ${interactiveHtml}
    ${fight.counter ? `<div class="counter-hit"><div class="counter-glove">${fight.counter.ico}</div><div class="counter-txt">${fight.counter.txt}</div></div>` : ''}
    ${popupHtml}
    <div class="fight-log">${fight.log}</div>
  </div>`;
}

/* =========================================================
   RESULTS -> STAT PICK -> (BELT) -> EVENT/HUB
   ========================================================= */
function screenKO(){
  const p=state.player, o=fight.opponent;
  const isSub = fight.koMethod==='Sumisión';
  const verb = isSub ? 'SE RINDIÓ' : 'K.O.';
  const bloodSpecks = isSub ? '' : Array.from({length:14}).map((_,i)=>{
    const ang = (i/14)*360 + rand(-12,12);
    const dist = rand(60,180);
    const size = rand(6,20);
    const delay = rand(0,120);
    return `<span class="ko-speck" style="--ang:${ang}deg;--dist:${dist}px;width:${size}px;height:${size}px;animation-delay:${delay}ms;"></span>`;
  }).join('');
  return `
  <div class="ko-screen">
    <div class="ko-burst"></div>
    <div class="ko-splatter">${bloodSpecks}</div>
    <div class="ko-content">
      <div class="ko-method mono">${isSub?'FINALIZACIÓN · SUMISIÓN':'FINALIZACIÓN · NOCAUT'}</div>
      <div class="ko-big">${verb}</div>
      <div class="ko-sub">${flagOf(p)} ${p.name} liquidó a ${flagOf(o)} ${o.name}</div>
      <button class="gold-btn" style="max-width:320px;margin:28px auto 0;" onclick="continueFromKO()">VER RESULTADO</button>
    </div>
  </div>`;
}

function screenResults(){
  const r = state.lastResult, p = state.player;
  const cls = r.winner==='win'?'win':(r.winner==='loss'?'loss':'draw');
  const title = r.winner==='win' ? '¡GANASTE!' : (r.winner==='loss'?'DERROTA':'EMPATE');
  return `
  <div class="topbar"><div class="brand">EL ÍDOLO <span>MMA</span></div><div></div></div>
  <div class="section">
    <div class="result-banner ${cls}"><div class="method mono">${r.method} · vs ${flagOf(r.opponent)} ${r.opponent.name}</div><h2>${title}</h2></div>
    ${r.becameChamp ? `<div class="card" style="border-color:var(--gold-dim);text-align:center;">🏆 <b>¡Sos el nuevo campeón!</b><br><span class="helper">Vas a ver tu cinturón a continuación.</span></div>` : ''}
    ${r.promotionMsg ? `<div class="card" style="border-color:var(--gold-dim);text-align:center;">📈 ${r.promotionMsg}</div>` : ''}
    ${state.lastDwcs ? `<div class="card" style="border-color:var(--neon-deep);text-align:center;">${state.lastDwcs}</div>` : ''}
    ${state.lastBonus ? `<div class="card" style="border-color:var(--gold-dim);text-align:center;">${state.lastBonus}</div>` : ''}
    ${state.rankNews ? `<div class="card" style="text-align:center;">📊 ${state.rankNews}</div>` : ''}
    ${(p.ageNotes&&p.ageNotes.length) ? `<div class="card"><span class="label">Tu evolución</span>${p.ageNotes.map(n=>`<div class="helper" style="margin:4px 0;">• ${n}</div>`).join('')}</div>` : ''}
    ${(state.ufcNews&&state.ufcNews.length) ? `<div class="card"><span class="label">Novedades de la división</span>${state.ufcNews.map(n=>`<div class="helper" style="margin:4px 0;">• ${n}</div>`).join('')}</div>` : ''}
    <div class="result-stat-grid">
      <div class="result-stat"><span class="label">Bolsa</span><div class="v pos">+${fmtMoney(r.moneyDelta)}</div></div>
      <div class="result-stat"><span class="label">Reputación</span><div class="v ${r.repDelta>=0?'pos':'neg'}">${r.repDelta>=0?'+':''}${r.repDelta}</div></div>
      <div class="result-stat"><span class="label">Récord</span><div class="v mono">${p.record.w}-${p.record.l}-${p.record.d}</div></div>
      <div class="result-stat"><span class="label">Edad</span><div class="v mono">${p.age.toFixed(1)}</div></div>
    </div>
    ${r.becameChamp ? `<button class="gold-btn" onclick="goBelt()">VER CINTURÓN</button>` : `<button class="primary-btn" onclick="goStatPick()">CONTINUAR</button>`}
  </div>`;
}
function goStatPick(){
  if(state.player.contractOffer){ state.screen='contract'; render(); return; }
  state.screen='statpick'; render();
}
function signContract(){
  const p=state.player;
  p.contract = p.contractOffer; p.contractOffer=null;
  p.orgIndex = p.orgChain.length-1; p.orgId = 'ufc';   // te vas derecho a la élite
  state.screen='statpick'; render();
}
function screenContract(){
  const p=state.player, c=p.contractOffer;
  return `
  <div class="topbar"><div class="brand">EL ÍDOLO <span>MMA</span></div><div></div></div>
  <div class="section">
    <div class="contract">
      <div class="contract-head">
        <div class="contract-org">UFC — Ultimate Fighting Championship</div>
        <div class="contract-title">CONTRATO DE PELEADOR</div>
      </div>
      <div class="contract-body">
        <div class="c-row"><span>Peleador</span><b>${p.name}</b></div>
        <div class="c-row"><span>División</span><b>${WEIGHT_CLASSES.find(w=>w.id===p.weightClass).name}</b></div>
        <div class="c-row"><span>Récord</span><b>${p.record.w}-${p.record.l}-${p.record.d}</b></div>
        <div class="c-sep"></div>
        <div class="c-row"><span>Por pelear</span><b class="c-money">${fmtMoney(c.toFight)}</b></div>
        <div class="c-row"><span>Por ganar</span><b class="c-money">${fmtMoney(c.toWin)}</b></div>
        <div class="c-sep"></div>
        <div class="c-note">Bonos de la noche: <b>${fmtMoney(100000)}</b> por Actuación de la Noche o Pelea de la Noche.
        Si finalizás y no te llevás uno de esos, cobrás <b>${fmtMoney(25000)}</b> por la finalización (no se acumulan).</div>
      </div>
      <div class="contract-sign">
        <div class="c-signature">${p.name}</div>
        <div class="c-signline">firma del peleador</div>
      </div>
    </div>
    <button class="gold-btn" onclick="signContract()">✒️ FIRMAR CONTRATO</button>
  </div>`;
}
function previewGain(stat){
  const p=state.player; const cap=statSoftCap();
  if(p[stat]>=cap) return 0;
  const factor=clamp(1.05-Math.pow(p[stat]/100,1.8),0.12,1.0);
  return Math.max(1, Math.min(cap-p[stat], Math.round(3*factor)));
}
function pickStat(stat){
  const p=state.player;
  if(p[stat]>=statSoftCap()) return;
  const gain = previewGain(stat);
  p[stat] = clamp(p[stat]+gain, 10, statSoftCap());
  state.lastGain = {stat, gain};
  maybeTriggerEvent();
}
function screenStatPick(){
  const p = state.player;
  const cap = statSoftCap();
  return `
  <div class="topbar"><div class="brand">EL ÍDOLO <span>MMA</span></div><div></div></div>
  <div class="section">
    <h2 style="font-size:26px;margin:4px 0 4px;text-align:center;">Experiencia de la pelea</h2>
    <div class="helper" style="text-align:center;margin-bottom:18px;">Elegí una estadística para mejorar por lo que aprendiste ahí adentro (techo actual: ${cap})</div>
    <div class="statpick-grid">${STAT_KEYS.map(k=>{
      const atCap = p[k]>=cap;
      return `<button class="statpick-card" ${atCap?'disabled style="opacity:.4;cursor:not-allowed;"':''} onclick="pickStat('${k}')"><div class="nm">${STAT_LABELS[k]}</div><div class="cur">actual: ${p[k]}</div><div class="gain">${atCap?'TECHO':'+'+previewGain(k)}</div></button>`;
    }).join('')}</div>
  </div>`;
}
function maybeTriggerEvent(){
  if(dwcsAvailable() && !state.player.dwcsOffered){
    state.player.dwcsOffered = true;
    state.screen='hub'; state.modal='dwcs';
    render(); return;
  }
  if(Math.random()<0.55){ state.event = choice(EVENTS); render(); } else { state.screen='hub'; render(); }
}
function chooseEvent(i){ const ev=state.event; ev.choices[i].fx(state.player); state.event=null; state.screen='hub'; render(); }
function modalEvent(){
  const ev = state.event;
  return `<div class="modal-overlay"><div class="modal"><h3>Entre peleas</h3><p>${ev.text}</p>
    ${ev.choices.map((c,i)=>`<button class="modal-choice" onclick="chooseEvent(${i})"><span class="cl">${c.label}</span><span class="ce">${c.extra}</span></button>`).join('')}</div></div>`;
}

/* =========================================================
   BELT / RETIRE
   ========================================================= */
function goBelt(){ state.screen='belt'; render(); }
function screenBelt(){
  const p=state.player, org=ORGS[p.orgId];
  return `<div class="topbar"><div class="brand">EL ÍDOLO <span>MMA</span></div><div></div></div>
  <div class="belt-wrap"><div class="eyebrow">Campeón</div>${beltSVG()}<h1>${org.name}</h1>
  <p>${flagOf(p)} ${p.name} es ahora el campeón de ${WEIGHT_CLASSES.find(w=>w.id===p.weightClass).name.toLowerCase()} de ${org.name}. Récord: ${p.record.w}-${p.record.l}-${p.record.d}.</p>
  <button class="primary-btn" onclick="goStatPick()">SEGUIR LA CARRERA</button></div>`;
}
function beltSVG(){
  return `<svg class="belt-svg" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0d581"/><stop offset="55%" stop-color="#d4af37"/><stop offset="100%" stop-color="#8a7020"/></linearGradient></defs>
    <rect x="0" y="40" width="70" height="26" rx="4" fill="#1c2024" stroke="#3a3020" stroke-width="2"/><rect x="130" y="40" width="70" height="26" rx="4" fill="#1c2024" stroke="#3a3020" stroke-width="2"/>
    <rect x="55" y="20" width="90" height="70" rx="10" fill="url(#g1)" stroke="#5c4a15" stroke-width="2"/>
    <circle cx="100" cy="55" r="24" fill="#1c2024" stroke="#f0d581" stroke-width="3"/><text x="100" y="61" text-anchor="middle" font-family="Bebas Neue" font-size="16" fill="#d4af37">MMA</text>
    <rect x="63" y="26" width="26" height="14" rx="3" fill="#1c2024" opacity=".5"/><rect x="111" y="26" width="26" height="14" rx="3" fill="#1c2024" opacity=".5"/></svg>`;
}
function tryRetire(){ if(confirm('¿Seguro que querés retirarte y cerrar tu carrera?')){ state.retired=true; state.screen='retired'; render(); } }
function archetypeFor(p){
  const arr=[{k:'striking',txt:'un finalizador explosivo que vivía de la potencia en las manos'},
    {k:'wrestling',txt:'un controlador implacable que ganaba las peleas contra la reja'},
    {k:'sumision',txt:'un especialista de piso que convertía cada derribo en una amenaza'}];
  arr.sort((a,b)=>p[b.k]-p[a.k]); return arr[0].txt;
}
function careerScore(p){
  let sc = p.record.w*40 - p.record.l*12 + p.finishes*25 + p.isChampionOf.length*220 + p.rep*3;
  if(p.orgId==='ufc') sc += 150;
  if(p.isChampionOf.includes('ufc')) sc += 400;
  STAT_KEYS.forEach(k=>sc += p[k]);
  return Math.max(0, Math.round(sc));
}
function careerRank(sc){
  if(sc>=2200) return {t:'LEYENDA ABSOLUTA', c:'var(--gold)'};
  if(sc>=1600) return {t:'ÍDOLO',            c:'var(--gold)'};
  if(sc>=1100) return {t:'ESTRELLA MUNDIAL',  c:'var(--neon)'};
  if(sc>=700)  return {t:'PELEADOR DE ÉLITE', c:'var(--neon)'};
  if(sc>=400)  return {t:'PROFESIONAL SÓLIDO',c:'var(--text)'};
  return {t:'PASÓ SIN DEJAR HUELLA', c:'var(--text-dim)'};
}
function shareCareer(){
  const p=state.player, sc=careerScore(p), rk=careerRank(sc);
  const beatRival = myRivalScore(p) >= rivalScore(p.rival);
  const txt = [
    '🥊 EL ÍDOLO: MMA — mi carrera',
    `${p.name} (${p.countryName})`,
    `${rk.t} · ${sc} pts`,
    `Récord: ${p.record.w}-${p.record.l}-${p.record.d} (${p.finishes} finalizaciones)`,
    `Títulos: ${p.isChampionOf.length ? p.isChampionOf.map(id=>ORGS[id].short||ORGS[id].name).join(', ') : 'ninguno'}`,
    `Rival de siempre: ${beatRival?'lo superé 💪':'me superó 😤'} (${p.rival.name})`,
    `Se retiró a los ${p.age.toFixed(0)} años`,
  ].join('\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>{ const b=document.getElementById('shareBtn'); if(b) b.textContent='✅ ¡COPIADO! Pegalo donde quieras'; });
  } else {
    const b=document.getElementById('shareBtn'); if(b) b.textContent='No se pudo copiar automáticamente';
  }
}
function screenRetired(){
  const p = state.player, sc = careerScore(p), rk = careerRank(sc);
  const beatRival = myRivalScore(p) >= rivalScore(p.rival);
  return `<div class="topbar"><div class="brand">EL ÍDOLO <span>MMA</span></div><div></div></div>
  <div class="section" style="padding-top:28px;">
    <div class="final-card">
      <div class="final-eyebrow">CARRERA TERMINADA</div>
      <div class="final-rank" style="color:${rk.c}">${rk.t}</div>
      <div class="final-score">${sc} <span>pts</span></div>
      <div class="final-name">${flagOf(p,'flag-lg')} ${p.name}</div>
      <div class="final-grid">
        <div class="fg"><span>Récord</span><b>${p.record.w}-${p.record.l}-${p.record.d}</b></div>
        <div class="fg"><span>Finalizaciones</span><b>${p.finishes}</b></div>
        <div class="fg"><span>Títulos</span><b>${p.isChampionOf.length}</b></div>
        <div class="fg"><span>Se retiró a los</span><b>${p.age.toFixed(0)} años</b></div>
        <div class="fg"><span>Última casa</span><b>${ORGS[p.orgId].short||ORGS[p.orgId].name}</b></div>
        <div class="fg"><span>Reputación</span><b>${p.rep}</b></div>
      </div>
      <div class="final-rival ${beatRival?'won':'lost'}">
        ${beatRival ? '💪 Le ganaste la carrera a ' : '😤 Te superó '} <b>${p.rival.name}</b>
        <span>(${p.rival.w}-${p.rival.l}, ${p.rival.titles} título/s)</span>
      </div>
      <div class="final-legacy">Pasaste a la historia como ${archetypeFor(p)}.</div>
    </div>
    <button class="gold-btn" id="shareBtn" onclick="shareCareer()">📋 COPIAR MI CARRERA PARA COMPARTIR</button>
    <button class="primary-btn" style="margin-top:10px;" onclick="restartGame()">EMPEZAR OTRA CARRERA</button>
  </div>
  <footer class="credits">PROTOTIPO DE JUEGO — ORGANIZACIONES Y PELEADORES FICTICIOS, INSPIRADOS EN EL MMA REAL</footer>`;
}

/* =========================================================
   UTIL / INIT
   ========================================================= */
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function init(){
  state = freshState(); draft = freshDraft(); fight=null; trainCtx=null; rankingsCache={};
  clearTimers();
  render();
}
init();
</script>
</body>
</html>
