/* quién te habla en un momento especial */
function specialSpeaker(s){
  const p = G.p;
  if(s.spk==='match') return {name:p.tier===2 ? 'Mick Máynard' : 'El matchmaker', title:'Matchmaker de '+orgShort(p), role:'producer'};
  const id = s.spk==='ufc' ? 'ufc' : s.spk==='org1' ? orgIdOf(p, Math.min(2, p.tier+1)) : orgIdOf(p);
  const b = ORG_BOSS[id] || ['El presidente', ORGS[id] ? ORGS[id].short : '', 'suit'];
  return {name:b[0], title:b[1], role:b[2]};
}
function eventView(){
  const e = G.event; if(!e) return null;
  if(e.special){
    const s = SPECIALS[e.special], spk = specialSpeaker(s);
    let text = evText(s.line);
    if((e.special==='oferta1'||e.special==='oferta2') && (G.p.flags.declines||0)>=2) text += ' Y te aviso: en tu liga ya no te quedan rivales. Esta vez no hay vuelta atrás.';
    return {talk:true, spk, who:'', wn:spk.name, role:s.role, text, choices:specialChoices(e.special), special:true};
  }
  const ev = EVENTS.find(x=>x.id===e.id);
  return {who:ev.who, wn:evText(ev.wn), role:ev.role, text:evText(ev.text), choices:[ev.a, ev.b]};
}
/* lo que cuesta una opción (las de los eventos comunes no tienen efectos secundarios) */
function choiceCost(ch, special){ if(special) return 0; try{ const d = ch.fx({...G.p, flags:{...G.p.flags}}) || {}; return d.money<0 ? -d.money : 0; }catch(e){ return 0; } }
function choiceBlocked(v, i){ const cost = choiceCost(v.choices[i], v.special); if(!cost || cost<=G.p.money) return false; return v.choices.some((c,j)=>j!==i && choiceCost(c, v.special)<=G.p.money); }
function chooseEvent(i){
  const v = eventView(); if(!v || G.evRes) return;
  const ch = v.choices[i]; if(!ch || choiceBlocked(v, i)) return;
  const d = ch.fx(G.p) || {};
  G.evRes = {text:d.r || '', chips:applyDelta(d), choice:ch.t, who:v.wn, whoE:v.who, say:ch.say||'', talk:!!v.talk, spk:v.spk||null};
  if(v.talk){ G.step = 'eventReply'; return; }      // la charla sigue: el otro te contesta
  toPreview();
}
function afterReply(){
  if(G.step!=='eventReply') return;
  G.evRes.shown = true;
  if(G.celebrate){ G.step = 'signing'; return; }   // firmaste con una liga nueva: festejo
  toPreview();
}
function afterSigning(){
  G.celebrate = null;
  if(G.step==='signing') toPreview();
}
function applyDelta(d){
  const p = G.p, chips = [];
  const sg = v=>v>0 ? '+'+v : '−'+Math.abs(v);
  if(d.money<0 && -d.money>p.money) d.money = -p.money;      // si no alcanza para nada, se paga lo que hay
  if(d.money){ p.money += d.money; if(d.money>0) p.earned += d.money; chips.push({t:(d.money>0?'+':'')+fmtMoney(d.money), i:'plata', c:d.money>0?'p':'n'}); }
  if(d.fame){ const b=p.fame; p.fame = clamp(p.fame+d.fame,0,100); if(p.fame!==b) chips.push({t:`${sg(p.fame-b)} fama`, i:'estrella', c:d.fame>0?'p':'n'}); }
  if(d.fans){ const b=p.fans; p.fans = clamp(p.fans+d.fans,0,100); if(p.fans!==b) chips.push({t:`${sg(p.fans-b)} hinchada`, i:'corazon', c:d.fans>0?'p':'n'}); }
  STAT_KEYS.forEach(k=>{ if(d[k]){ const b=p[k]; p[k]=clamp(p[k]+d[k],10,99); if(p[k]!==b) chips.push({t:`${sg(p[k]-b)} ${STAT_LABEL[k].toLowerCase()}`, i:STAT_ICON[k], c:d[k]>0?'p':'n'}); } });
  if(d.amuletos){ const b=p.amuletos; p.amuletos = Math.max(0,p.amuletos+d.amuletos); if(p.amuletos!==b) chips.push({t:`${sg(p.amuletos-b)} amuleto`, i:'trebol', c:d.amuletos>0?'p':'n'}); }
  if(d.skipSeason){ G.skipSeason = true; chips.push({t:'Te perdés la temporada', i:'venda', c:'n'}); }
  if(d.scouted){ p.flags.scouted = true; chips.push({t:'La próxima pelea grande, más fácil', i:'ojo', c:'o'}); }
  if(d.promise){ p.flags.promise = true; chips.push({t:'Si ganás, vas por el título', i:'trofeo', c:'o'}); }
  if(STAT_KEYS.some(k=>d[k])) G.statFlash = Object.fromEntries(STAT_KEYS.filter(k=>d[k]).map(k=>[k,d[k]]));
  p.peak = Math.max(p.peak, ovrOf(p));
  return chips;
}
/* ---------- la tienda ---------- */
function shopItems(){ return SHOP.filter(it=>!it.cond || it.cond(G.p)); }
function shopLvl(id){ return ((G.p.upg||{})[id])||0; }
function shopPrice(it){ const lv = it.use ? 0 : shopLvl(it.id), base = it.price[Math.min(lv, it.price.length-1)]; return it.abs ? base : M(base); }
function shopState(it){
  if(!it.use && shopLvl(it.id)>=it.max) return 'max';
  const b = (G.yearLog && G.yearLog.buys) || {};
  if(it.use && (b[it.id]||0) >= (it.lim||1)) return 'used';
  return G.p.money >= shopPrice(it) ? 'ok' : 'poor';
}
function buyItem(id){
  const p = G.p, it = SHOP.find(x=>x.id===id);
  if(!it || shopState(it)!=='ok') return false;
  p.money -= shopPrice(it);
  const yl = G.yearLog; yl.buys = yl.buys || {}; yl.buys[id] = (yl.buys[id]||0)+1;
  p.upg = p.upg || {};
  if(!it.use) p.upg[id] = shopLvl(id)+1;
  const add = (k,v,lo,hi)=>{ p[k] = clamp(p[k]+v, lo, hi); };
  switch(id){
    case 'fisico': add('cardio',1,10,99); G.statFlash = {cardio:1}; break;
    case 'video': p.flags.scouted = true; break;
    case 'sparring': ['striking','wrestling','sumision'].forEach(k=>add(k,2,10,99)); G.statFlash = {striking:2, wrestling:2, sumision:2}; break;
    case 'prensa': add('fame',8,0,100); break;
    case 'asado': add('fans',6,0,100); break;
    case 'amuleto': p.amuletos++; break;
    case 'auto': add('fame',6,0,100); add('fans',-3,0,100); break;
    case 'casa': add('fans',15,0,100); news('Le compraste la casa a tu vieja. Lloraron los dos.'); break;
    case 'gym': add('fans',8,0,100); news('Abriste tu propio gimnasio. Los pibes del barrio entrenan gratis.'); break;
  }
  p.peak = Math.max(p.peak, ovrOf(p));
  return true;
}
function vacate(){
  const p = G.p;
  if(!p.champ) return;
  const lst = getList(p);
  lst.champ = lst.L.shift(); lst.L.push(makeOpp(rankOvr(p.tier,15)));
  p.champ = false;
}
function moveTier(t, rank){
  const p = G.p;
  if(t>p.tier) G.celebrate = {tier:clamp(t,0,2), org:orgShort(p, clamp(t,0,2))};
  if(t>p.tier && p.persona==='cabulero'){ p.amuletos++; if(G.yearLog) G.yearLog.news.push('Cábala nueva para la liga nueva: +1 amuleto.'); }
  p.tier = clamp(t,0,2); p.champ = false; p.rank = rank || null; p.streakL = 0;
  if(p.tier===2) p.flags.ufc = true;
  p.flags.declines = 0;
  syncRival();
}

/* ---------- peleas de la temporada: rivales y forma de ganar ---------- */
function winProb(a, b){ return clamp(sigmoid((a-b)/6.5), .04, .96); }
const KO_HOW = ['gancho de izquierda','patada a la cabeza','rodillazo volador','cross de derecha','uppercut','codazo giratorio'];
const SUB_HOW = ['mata león','guillotina','armbar','triangular','kimura','D\'Arce'];
const TKO_HOW = ['golpes en el piso','ground & pound','parada médica','lluvia de golpes'];
function methodFor(winner, loserOvr, winnerOvr, heavy){
  let fin = .42 + (winnerOvr-loserOvr)/70 + (heavy?.12:0);
  if(R() >= clamp(fin,.2,.82)) return {m:R()<.72?'Decisión unánime':'Decisión dividida', how:'3 rounds'};
  const r = R(), s = winner;
  const rd = 'R'+randi(1,3);
  if(s==='striking') return r<.78 ? {m:'KO', how:choice(KO_HOW)+' · '+rd} : {m:'TKO', how:choice(TKO_HOW)+' · '+rd};
  if(s==='sumision') return r<.75 ? {m:'Sumisión', how:choice(SUB_HOW)+' · '+rd} : {m:'TKO', how:choice(TKO_HOW)+' · '+rd};
  return r<.5 ? {m:'TKO', how:choice(TKO_HOW)+' · '+rd} : r<.8 ? {m:'Sumisión', how:choice(SUB_HOW)+' · '+rd} : {m:'KO', how:choice(KO_HOW)+' · '+rd};
}
function simOpponent(){
  const p = G.p, lst = getList(p), T = TIERS[p.tier];
  if(p.champ){ const f = pickFresh(lst, range(3,10)); if(f) return {...f, dispRank:lst.L.indexOf(f)+1}; }
  if(p.rank && R()<.65){
    const f = pickFresh(lst, range(p.rank-1, Math.min(14, p.rank+4)));
    if(f){ const i = lst.L.indexOf(f); return {...f, dispRank:dispRank(i)<=15?dispRank(i):null}; }
  }
  const base = p.rank ? rankOvr(p.tier, Math.min(15, p.rank+4)) : rand(T.unr[0], T.unr[1]);
  return {...makeOpp(base + rand(-2,2)), dispRank:null};
}
/* cómo terminó una pelea jugada, para el resumen del año */
function howFor(method){ if(/Decisi/.test(method)) return ''; return (method==='Sumisión' ? choice(SUB_HOW) : method==='TKO' ? choice(TKO_HOW) : choice(KO_HOW))+' · R'+randi(1,3); }

/* ---------- pelea grande del año ---------- */
const TITLE_KINDS = ['title','defense','dwcs','doble'];
function setupBig(){
  const p = G.p, lst = getList(p);
  let type, opp;
  const forced = G.forced; G.forced = null;
  if(forced==='dwcs'){
    type = 'dwcs'; opp = {...makeOpp(randi(70,74), genPerson()), dispRank:null};
  } else if(forced==='doble'){
    const i = WEIGHT_CLASSES.findIndex(w=>w.id===p.wc);
    const other = WEIGHT_CLASSES[i<WEIGHT_CLASSES.length-1 ? i+1 : i-1];
    const r = UFC_ROSTER[other.id][0];
    type = 'doble'; opp = {name:r[0], cc:r[1], ...makeStats(ufcPow(r[2])+3), dispRank:'C', otherWc:other.n};
  } else if(p.champ){
    type = 'defense';
    /* el campeón defiende contra el #1 (a veces el #2, o el rival si está arriba) */
    const top = lst.L.slice(0,2), rv = top.find(f=>f.isRival);
    const f = (rv && R()<.6) ? rv : (R()<.3 && top[1] && !isRecent(top[1])) ? top[1] : top[0];
    opp = {...f, dispRank:lst.L.indexOf(f)+1};
  } else if(forced==='title' || p.flags.promise2 || (p.rank && p.rank<=3) || (p.rank && p.rank<=5 && (p.streakW||0)>=4)){
    p.flags.promise2 = false;
    type = 'title'; opp = {...lst.champ, dispRank:'C'};
  } else {
    const rv = lst.L.find(f=>f.isRival);
    if(rv && R() < (G.lastClasico===G.season-1 ? .08 : .3)){ type = 'clasico'; G.lastClasico = G.season; const i=lst.L.indexOf(rv); opp = {...rv, dispRank:dispRank(i)<=15?dispRank(i):null}; }
    else {
      type = 'estelar';
      const f = p.rank ? pickFresh(lst, range(Math.max(0, p.rank-7), Math.max(0, p.rank-3))) || pickFresh(lst, range(0, Math.max(2, p.rank-2))) : pickFresh(lst, range(4,10));
      const i = f ? lst.L.indexOf(f) : (p.rank ? Math.max(0, p.rank-1-randi(3,5)) : randi(5,9));
      opp = {...lst.L[i], dispRank:dispRank(i)<=15?dispRank(i):null};
      if(opp.isRival){ type = 'clasico'; G.lastClasico = G.season; }
      else if((p.rank && p.rank<=6) || (opp.dispRank && opp.dispRank<=5)) type = 'contender';
    }
  }
  /* los títulos se pelean a 5 rounds; las de contendientes, los clásicos y la Serie, a 3. Un nocaut las termina antes */
  const rounds = ['title','defense','doble'].includes(type) ? 5 : ['contender','clasico','dwcs'].includes(type) ? 3 : 1;
  G.big = {type, opp, rounds, shortNotice:forced==='title'};
  G.step = 'preview';
}
function bigLabel(b){
  const p = G.p, org = orgShort(p);
  return ({title:`Pelea por el título · ${org}`, defense:`Defensa del título · ${org}`, dwcs:'Serie de Contendientes', doble:`Por el segundo cinturón · ${b.opp.otherWc||''}`,
           clasico:'El clásico', estelar:`Pelea estelar · ${org}`, contender:`Pelea de contendientes · ${org}`, regular:`Pelea de la temporada · ${org}`})[b.type] || 'Pelea del año';
}
function bigClass(b){ return ['title','defense','doble','dwcs'].includes(b.type) ? 'title' : ((b.type==='clasico' || b.type==='contender' || (b.opp && b.opp.isRival)) ? 'hot' : ''); }

/* ---------- aplicar el resultado de cualquier pelea ---------- */
function applyResult(opp, win, method, kind, mk){
  const p = G.p, T = TIERS[p.tier], big = kind!=='sim';
  const finish = !/Decisi/.test(method);
  const out = {win, method, kind, opp, finish, notes:[], money:0, fame:0, fans:0, rank:null, org:orgShort(p)};
  p.streakW = win ? (p.streakW||0)+1 : 0;
  if(win){ p.record.w++; G.yearLog.w++; p.streakL = 0; if(method==='Sumisión') p.sub++; else if(finish) p.ko++; }
  else { p.record.l++; G.yearLog.l++; p.streakL++; }
  /* plata */
  /* antes había dos peleas chicas por año en el regional y el mundial; ahora una, que vale doble */
  const regMul = (!big && p.tier<2) ? 2 : 1;
  let purse = big ? rand(T.big[0], T.big[1]) : rand(T.purse[0], T.purse[1])*regMul;
  if(mk==='up') purse *= 1.5; else if(mk==='safe') purse *= .7;
  if(['title','defense','doble'].includes(kind)) purse *= 2.3;
  if(kind==='dwcs') purse = 25000;
  if(!win) purse *= .45;
  if(p.persona==='bocon') purse *= 1.5;
  purse = Math.round(purse/100)*100;
  if(p.tier===2 && big && win && finish && R()<.6){ purse += 50000; out.notes.push({t:'Actuación de la Noche: +'+fmtMoney(50000), i:'rayo', c:'o'}); }
  p.money += purse; p.earned += purse; out.money = purse;
  /* fama e hinchada */
  let fame = (big ? (win?5:-3) : (win?2:-1)*regMul) * T.fame;
  if(win && finish) fame += big ? 2 : 1;
  if(win && TITLE_KINDS.includes(kind)) fame += 10;
  if(mk==='up' && win) fame += 3; else if(mk==='safe' && !win) fame -= 3;
  if(p.persona==='bocon') fame *= fame>0 ? 1.5 : 2;
  const fb = p.fame; p.fame = clamp(p.fame+Math.round(fame),0,100); out.fame = p.fame-fb;
  let fans = big ? (win?3:-2) : (win?1:0);
  if(win && TITLE_KINDS.includes(kind)) fans += 6;
  if(opp.isRival) fans += win ? 6 : -3;
  if(p.persona==='guerrero' && fans>0) fans = Math.round(fans*1.5);
  const nb = p.fans; p.fans = clamp(p.fans+fans,0,100); out.fans = p.fans-nb;
  /* ranking y títulos */
  const lst = getList(p);
  const oi = findInList(lst, opp.name);
  if(kind==='title'){
    if(win){
      const old = lst.champ;
      if(old && !old.isRival){ lst.L.unshift(old); lst.L = lst.L.slice(0,15); }
      if(old && old.isRival){ p.rival.champOf = null; lst.L.unshift(old); lst.L = lst.L.slice(0,15); }
      lst.champ = null; p.champ = true; p.rank = null;
      p.titles.push({tier:p.tier, org:orgShort(p), year:seasonYear(), age:p.age});
      if(p.tier===2 && !p.firstUfcAge) p.firstUfcAge = p.age;
      if(F && F.hist && F.hist[0] && F.hist[0].res==='l') p.flags.remontada = true;
      out.notes.push({t:`¡Campeón de ${orgShort(p)}!`, i:'cinturon', c:'o'});
      if(p.persona==='cabulero'){ p.amuletos++; out.notes.push({t:'+1 amuleto: esta cábala funciona', i:'trebol', c:'p'}); }
      out.belt = true;
    } else { p.rank = randi(4,7); out.rank = {from:null, to:p.rank}; }
  } else if(kind==='defense'){
    if(win){ p.defenses++; p.defByTier[p.tier]++; if(p.tier===2) p.ufcDef++; out.notes.push({t:`Defensa exitosa número ${p.defenses}`, i:'escudo', c:'o'});
      if(oi>=0){ const [f] = lst.L.splice(oi,1); lst.L.splice(Math.min(lst.L.length, oi+2),0,f); } }
    else {
      p.champ = false; p.rank = randi(1,2);
      if(oi>=0) lst.L.splice(oi,1);
      lst.champ = {...opp}; delete lst.champ.dispRank;
      if(opp.isRival){ p.rival.champOf = p.tier; p.rival.titles++; }
      while(lst.L.length<15) lst.L.push(makeOpp(rankOvr(p.tier,15)));
      out.notes.push({t:'Perdiste el cinturón', i:'cinturon', c:'n'});
    }
  } else if(kind==='dwcs'){
    if(win){ p.flags.dwcs = true; vacate(); moveTier(2, null); out.notes.push({t:'¡Te ganaste el contrato con la UFC!', i:'rayo', c:'o'}); }
    else out.notes.push({t:'La puerta de la UFC se cerró… por ahora.', i:'cerrar', c:'n'});
  } else if(kind==='doble'){
    if(win){ p.double = true; p.titles.push({tier:2, org:'UFC · '+(opp.otherWc||'2ª división'), year:seasonYear(), age:p.age}); out.notes.push({t:'¡DOBLE CAMPEÓN DE LA UFC!', i:'trofeo', c:'o'}); out.belt = true; }
  } else if(!p.champ){
    const before = p.rank;
    if(win){
      let nr;
      if(opp.dispRank && opp.dispRank!=='C') nr = before ? Math.min(before, opp.dispRank) : opp.dispRank;
      else nr = before ? Math.max(1, before-1) : (big ? randi(9,11) : randi(11,14));
      if(finish && nr>1) nr--;
      if(before && nr>=before) nr = Math.max(1, before-1);
      if(big && p.flags.promise){ nr = 1; p.flags.promise2 = true; out.notes.push({t:'Promesa cumplida: vas por el título', i:'trofeo', c:'o'}); }
      p.rank = nr;
      if(oi>=0 && opp.dispRank && nr<=opp.dispRank){ const [f] = lst.L.splice(oi,1); lst.L.splice(Math.min(lst.L.length, oi+1),0,f); }
    } else if(before){ const nr = before + randi(1,3) + (mk==='safe' ? 2 : 0); p.rank = nr>15 ? null : nr; }
    /* el que te ganó sube en el ranking (y deja de ser "el de al lado" para la próxima) */
    if(!win && oi>0){ const [f] = lst.L.splice(oi,1); lst.L.splice(Math.max(0, oi-2), 0, f); }
    if(big) p.flags.promise = false;
    out.rank = {from:before, to:p.rank};
  }
  /* rival */
  if(opp.isRival && p.rival){ if(win) p.rival.h2hW++; else p.rival.h2hL++; }
  if(win && p.age>=37) p.flags.lobo = true;
  p.peak = Math.max(p.peak, ovrOf(p));
  return out;
}

/* ---------- fin de temporada ---------- */
const NEWSPAPERS = ['DIARIO OCTÓGONO','LA PIÑA DEPORTIVA','EL CRONISTA DE LA JAULA','TODO MMA','GUANTE DE ORO'];
function makeHeadline(){
  const p = G.p, lb = G.lastBig, ln = lastName(p.name), org = orgShort(p);
  if(G.skipSeason) return `${ln} pasó el año recuperándose`;
  if(!lb) return `${ln} suma rodaje en ${org}`;
  const on = lb.opp ? lastName(lb.opp.name) : '';
  if(lb.kind==='doble' && lb.win) return `¡HISTÓRICO! ${ln} es doble campeón de la UFC`;
  if(lb.kind==='title' && lb.win) return (p.tier===2 && NEVER_CHAMP.includes(p.cc)) ? `¡${ln}, el primer campeón de UFC de ${p.countryName}!` : choice([`¡${ln} es el nuevo campeón de ${lb.org}!`, `${ln} toca el cielo: campeón de ${lb.org}`]);
  if(lb.kind==='defense' && lb.win) return choice([`${ln} retiene el cinturón y agranda su leyenda`, `Nadie puede con ${ln}: otra defensa exitosa`]);
  if(lb.kind==='defense') return `Se terminó el reinado de ${ln}`;
  if(lb.kind==='dwcs') return lb.win ? `${ln} brilló en la Serie de Contendientes y firmó con la UFC` : `${ln} dejó pasar el tren de la UFC`;
  if(lb.kind==='doble') return `${ln} fue por el segundo cinturón y se quemó`;
  if(lb.opp && lb.opp.isRival) return lb.win ? `${ln} ganó el clásico ante ${on}` : `${on} se quedó con el clásico ante ${ln}`;
  if(lb.win && lb.finish) return `${ln} ${lb.method==='Sumisión'?'hizo rendir':'noqueó'} a ${on} y pide pista`;
  if(lb.win) return `${ln} le ganó a ${on} y sigue subiendo`;
  if(lb.kind==='title') return `${ln} se quedó en la puerta del título`;
  return `Golpe duro para ${ln}: cayó ante ${on}`;
}
function finishSeason(){
  const p = G.p, y = G.yearLog;
  y.ovr1 = ovrOf(p); y.rank1 = rankLabel(p); y.headline = makeHeadline(); y.paper = choice(NEWSPAPERS);
  y.money = p.money - y.money0; y.org = orgShort(p);
  y.gold = !!(G.lastBig && G.lastBig.win && TITLE_KINDS.includes(G.lastBig.kind) && G.lastBig.kind!=='dwcs');
  G.timeline.unshift({year:y.year, age:y.age, org:y.org, rank:y.rank1, w:y.w, l:y.l, h:y.headline, gold:y.gold});
  const lb = G.lastBig;
  G.marks.push(G.skipSeason || !lb ? 'x' : (lb.win && ['title','defense','doble'].includes(lb.kind)) ? 't' : lb.win ? 'w' : 'l');
  checkOffers();
  G.retireAsk = p.age>=33;
  G.step = 'yearEnd';
  save();
}
function checkOffers(){
  const p = G.p, ovr = ovrOf(p);
  G.pending = [];
  if(p.tier>0 && p.streakL>=3){ G.pending.push('cortado'); return; }
  if(p.tier===0 && p.champ && !p.flags.dwcsDone && p.fame>=38) G.pending.push('dwcs');
  else if(p.tier===0 && (p.champ || (p.rank && p.rank<=2 && ovr>=68)) && p.fame>=26) G.pending.push('oferta1');
  else if(p.tier===1 && (p.champ || (p.rank && p.rank<=2 && ovr>=84)) && p.fame>=48) G.pending.push('oferta2');
  else if(p.tier===2 && p.champ && p.defenses>=1 && !p.flags.dobleTried && !p.double && R()<.3) G.pending.push('doble');
  else if(!p.champ && p.rank && p.rank>=3 && p.rank<=7 && R()<.14) G.pending.push('shortnotice');
}
function nextSeason(){
  if(G.p.age>=38){ endCareer('age'); return; }
  startSeason(false);
  save();
}

/* ---------- retiro, logros y puntaje ---------- */
function careerSummary(){
  const p = G.p;
  return {name:p.name, cc:p.cc, country:p.countryName, persona:p.persona, style:p.style, wc:p.wc,
    w:p.record.w, l:p.record.l, ko:p.ko, sub:p.sub, titles:p.titles.slice(), def:p.defenses, ufcDef:p.ufcDef, double:p.double,
    ufcTitle:p.titles.some(t=>t.tier===2), tier:p.tier, reachedUfc:!!p.flags.ufc || p.tier===2, defByTier:(p.defByTier||[0,0,p.ufcDef]).slice(), peak:p.peak, fame:p.fame, fans:p.fans, earned:p.earned, money:p.money,
    firstUfcAge:p.firstUfcAge||0, age:p.age, rivalBeat:!!(p.rival && p.rival.h2hW>0), rival:p.rival, champ:p.champ, flags:p.flags, years:G.season+1, look:p.look};
}
function achievementsOf(c){
  const on = {};
  on.reg = c.titles.some(t=>t.tier===0);
  on.mun = c.titles.some(t=>t.tier===1);
  on.ufc = c.ufcTitle;
  on.double = c.double;
  on.def3 = c.def>=3;
  on.invicto = c.l===0 && c.w>=10;
  on.ko10 = c.ko>=10;
  on.sub8 = c.sub>=8;
  on.rival = c.rivalBeat;
  on.idolo = c.fans>=90;
  on.millon = c.earned>=1e6;
  on.dwcs = !!c.flags.dwcs;
  on.remontada = !!c.flags.remontada;
  on.lobo = !!c.flags.lobo;
  on.cima = c.champ && c.tier===2;
  on.pionero = c.ufcTitle && NEVER_CHAMP.includes(c.cc);
  return on;
}
function careerScore(c, achs){
  let s = c.w*8 - c.l*4 + (c.ko+c.sub)*4;
  c.titles.forEach(t=> s += [80,200,450][t.tier]);
  s += c.defByTier[0]*15 + c.defByTier[1]*35 + c.defByTier[2]*90;
  if(c.double) s += 300;
  s += Math.max(0, c.peak-60)*6 + c.fame + c.fans + Math.min(200, Math.round(c.earned/50000));
  s += Object.values(achs).filter(Boolean).length*25;
  if(c.rivalBeat) s += 50;
  return Math.max(0, Math.round(s));
}
/* el rango sale de lo que lograste; el puntaje ordena el salón de la fama */
function careerRank(sc, c){
  if(c.ufcTitle && (c.double || c.ufcDef>=3 || sc>=2300)) return {t:'Leyenda del MMA', e:'👑', lv:6};
  if(c.ufcTitle) return {t:'Campeón de la UFC', e:'🏆', lv:5};
  if(c.reachedUfc) return {t:'Peleador de UFC', e:'🥊', lv:4};
  if(c.titles.some(t=>t.tier===1)) return {t:'Estrella internacional', e:'🌎', lv:3};
  if(c.titles.length) return {t:'Ídolo regional', e:'⭐', lv:2};
  if(c.w>c.l) return {t:'Profesional', e:'💪', lv:1};
  return {t:'Sparring de lujo', e:'🥲', lv:0};
}
function legendOf(c){ return LEGENDS.find(l=>l.t(c)); }
function endCareer(reason){

/* =========================================================
   4. PELEA GRANDE: rounds que se definen con minijuegos
   ========================================================= */
/* cómo encarás la pelea: el cabulero siempre al instinto, el habilidoso siempre con técnica, el resto elige */
function fixedMode(){ const p = G.p; return p.persona==='cabulero' ? 'luck' : p.persona==='habilidoso' ? 'skill' : null; }
function isLuck(){ return F && F.mode ? F.mode==='luck' : fixedMode()==='luck'; }
function startBig(useArenga, mode){
  const b = G.big, p = G.p;
  if(!b) return;
  F = {mode:fixedMode() || mode || 'skill', type:b.type, opp:b.opp, need:Math.floor(b.rounds/2)+1, max:b.rounds, round:0, meW:0, opW:0, hist:[], used:[], hype:0,
       game:null, phase:null, shortNotice:!!b.shortNotice, scouted:!!p.flags.scouted};
  p.flags.scouted = false;
  G.bigCount++;
  if(useArenga && p.arenga>0 && !TITLE_KINDS.includes(b.type)){
    p.arenga--; F.arenga = true; SFX.crowd();
    return finishBig(true, R()<.45 ? (p.style==='sumision' ? 'Sumisión' : 'KO') : 'Decisión unánime');
  }
  UI.screen = 'fight';
  if(p.persona==='bocon'){ F.phase = 'trash'; F.trash = pickTrash(); render(); return; }
  nextRound();
}
/* las peleas de la temporada: un round, un minijuego corto, sin cara a cara */
function startRegular(opp, mk){
  const p = G.p, n = TIERS[p.tier].sims;
  if(!(G.regLeft>0)){ setupBig(); UI.screen = 'career'; return; }
  opp = opp || G.regOpp || simOpponent(); mk = mk || G.matchKind || 'mid';
  G.regOpp = opp; G.matchKind = mk; G.step = 'fights';
  F = {mode:fixedMode() || 'skill', type:'regular', quick:true, opp, mk, need:1, max:1, round:0, meW:0, opW:0, hist:[], used:[], hype:0,
       game:null, phase:null, num:n-G.regLeft+1, of:n};
  UI.screen = 'fight';
  nextRound();
}
function finishRegular(win, method){
  mgStop();
  const opp = F.opp;
  const out = applyResult(opp, win, method, 'sim', F.mk);
  G.seasonRes.push({opp, win, m:method, how:howFor(method), rank:out.rank, money:out.money, mk:F.mk});
  G.regOpp = null;
  noteRecent(opp.name);
  F.phase = 'done'; F = null;
  G.regLeft--;
  if(G.regLeft>0){ startRegular(); save(); return; }
  setupBig();
  UI.screen = 'career';
  render(); save();
}
function pickTrash(){
  let pool = TRASH.map((t,i)=>i).filter(i=>!G.usedTrash.includes(i));
  if(!pool.length){ G.usedTrash = []; pool = TRASH.map((t,i)=>i); }
  const i = choice(pool); G.usedTrash.push(i);
  return {i, opts:shuffle(TRASH[i].o)};
}
function chooseTrash(k){
  if(!F || F.phase!=='trash' || F.trashRes) return;
  const q = k<0 ? 0 : F.trash.opts[k][1];
  F.hype = [-.3, .15, .5][q];
  F.trashRes = {q, k};
  if(q===2){ G.picantes++; G.p.fame = clamp(G.p.fame+2,0,100); SFX.crowd(); flashScreen('g'); }
  else if(q===0){ SFX.bad(); flashScreen('r'); }
  else SFX.good();
  render();
  /* el resultado del cara a cara se lee y sigue solo (tocá para no esperar) */
  if(!UI.bot){ const t = F._tt = {}; setTimeout(()=>{ if(F && F._tt===t && F.phase==='trash') afterTrash(); }, 2200); }
}
function pickGame(){
  const p = G.p;
  let pool;
  if(isLuck()) pool = LUCK_GAMES.slice();
  else if(F.max===1) pool = R()<.6 ? STYLE_GAMES[p.style].slice() : SKILL_GAMES.slice();
  else if(F.round===0) pool = STYLE_GAMES[p.style].slice();                       // el primer round, a tu manera
  else if(F.round%2===0) pool = STYLE_GAMES[F.opp.spec||'striking'].slice();     // los pares, a la manera del rival
  else pool = SKILL_GAMES.slice();
  let opts = pool.filter(g=>!F.used.includes(g));
  if(F.round===0){ const fresh = opts.filter(g=>!G.lastGames.includes(g)); if(fresh.length) opts = fresh; }
  if(!opts.length) opts = pool;
  const g = choice(opts);
  F.used.push(g);
  if(F.round===0){ G.lastGames.push(g); if(G.lastGames.length>3) G.lastGames.shift(); }
  return g;
}
function nextRound(){
  F.game = pickGame(); F.phase = 'intro'; F.retry = false;
  render();
  if(UI.bot) setTimeout(beginRound, 20);
}
function statPair(gid){
  const p = G.p, o = F.opp, g = MG[gid];
  if(g.stat==='ovr') return [ovrOf(p), o.ovr];
  if(g.stat==='defense') return [p.chin*.4 + p.cardio*.3 + p.striking*.3, o.striking];
  if(g.stat==='reflejos') return [p.striking*.6 + p.cardio*.4, o.striking*.6 + o.cardio*.4];
  return [p[g.stat], o[g.stat]];
}
function roundDiff(gid){
  const p = G.p, o = F.opp;
  const [mine, his] = statPair(gid);
  /* el rating pesa de verdad: contra alguien mejor cuesta mucho más */
  let d = (his - mine)/10 + ((o.ovr||his) - ovrOf(p))/22;
  if(F.round>0) d += (o.cardio - p.cardio)/55 * (1 + F.round*.3);   // el cardio pesa más en los rounds de campeonato
  if(F.type==='regular'){ if(G.season===0) d -= .35; }     // la primera temporada, más amable
  else if(G.bigCount<=2) d -= .55;                           // tus primeras peleas grandes son más amables
  if(F.round===0) d -= F.hype;                               // bocón: el cara a cara
  if(p.persona==='guerrero' && F.opW > F.meW) d -= .45;      // guerrero: se agranda cuando va abajo
  if(F.shortNotice) d += .3;
  if(F.scouted) d -= .3;
  if(wcOf(p).fast && ['bloqueo','zona','patada','duelo'].includes(gid)) d -= .12;
  return clamp(d, -1, 1.5);
}
function statsLine(gid){
  const g = MG[gid];
  if(g.luck) return `Tus chances: ${Math.round(luckP(roundDiff(gid))*100)}%`;
  const [a, b] = statPair(gid).map(Math.round);
  const lab = {ovr:'OVR', defense:'defensa', reflejos:'reflejos'}[g.stat] || STAT_LABEL[g.stat].toLowerCase();
  return `Tu ${lab}: ${a} · el suyo: ${b}`;
}
function diffLabel(d){
  if(d<-.5) return 'muy fácil'; if(d<-.15) return 'fácil'; if(d<.25) return 'parejo';
  if(d<.7) return 'difícil'; if(d<1.1) return 'muy difícil'; return 'brutal';
}
function luckP(d){ return clamp(sigmoid(-1.15*d), .15, .9); }
function beginRound(){
  if(!F || F.phase!=='intro') return;
  G.seenGames[F.game] = true;
  F.phase = 'play';
  F.d = roundDiff(F.game);
  render();
  SFX.bell();
  mgRun(F.game, F.d);
}
/* tier: perfect · win · lose · zero (fallaste todo) · ko (te finalizaron) */
function roundDone(tier){
  if(!F || F.phase!=='play') return;
  const p = G.p;
  if(tier==='zero') tier = (p.persona!=='guerrero' && R() < clamp(.28 + F.d*.22, .08, .6)) ? 'ko' : 'lose';
  if(tier==='ko' && p.persona==='guerrero') tier = 'lose';
  const res = (tier==='perfect'||tier==='win') ? 'w' : 'l';
  F.hist.push({g:F.game, tier, res});
  if(res==='w') F.meW++; else F.opW++;
  F.phase = 'roundEnd'; F.last = tier;
  if(tier==='perfect') F.end = {win:true, method:MG[F.game].fin || 'KO'};
  else if(tier==='ko') F.end = {win:false, method:F.opp.spec==='sumision' ? 'Sumisión' : (F.opp.spec==='wrestling' ? 'TKO' : 'KO')};
  else if(F.meW>=F.need) F.end = {win:true, method:(F.max===1 || F.opW===0) ? 'Decisión unánime' : 'Decisión dividida'};
  else if(F.opW>=F.need) F.end = {win:false, method:(F.max===1 || F.meW===0) ? 'Decisión unánime' : 'Decisión dividida'};
  else F.end = null;
  if(F.end && F.end.win && !/Decisi/.test(F.end.method) && MG[F.game].luck) F.end.method = choice(['KO','KO','TKO','Sumisión']);
  F.canAmuleto = isLuck() && res==='l' && p.amuletos>0 && F.type!=='regular';
  if(res==='w') (tier==='perfect' ? SFX.great : SFX.good)(); else (tier==='ko' ? SFX.hurt : SFX.bad)();
  if(tier==='perfect'){ flashScreen('y'); vibrate([30,40,60]); } else if(tier==='ko'){ flashScreen('r'); vibrate(120); }
  showRoundOverlay();
  if(UI.bot){ if(F.canAmuleto && UI.bot>=.5) setTimeout(useAmuleto, 20); else setTimeout(afterRound, 20); return; }
  if(!F.canAmuleto){ clearTimeout(F._adv); F._adv = setTimeout(()=>{ if(F && F.phase==='roundEnd') afterRound(); }, 1400); }
}
function useAmuleto(){
  if(!F || !F.canAmuleto || F.phase!=='roundEnd') return;
  const p = G.p; p.amuletos--;
  const h = F.hist.pop(); F.opW--;
  F.used = F.used.filter(g=>g!==h.g);
  F.game = h.g; F.end = null; F.canAmuleto = false; F.usedAmuleto = true;

  if(UI.bot) setTimeout(beginRound, 20);
}
function afterRound(){
  if(!F || F.phase!=='roundEnd') return;

}
function finishBig(win, method){
  if(F && F.type==='regular') return finishRegular(win, method);

  const b = G.big;

  out.arenga = !!(F && F.arenga);

}
function afterKO(){ if(UI.screen==='ko') afterResult(); }
function afterResult(){

}

/* =========================================================
   MINIJUEGOS: cada uno vive en #stage y termina con c.done(tier)
   ========================================================= */
const MG = {};
const MGR = {raf:0, tos:[], alive:false, key:null, keyup:null, up:null, freeze:0};
function mgUnseed(){ if(MGR.seedSave!=null){ RNGS.seeded = MGR.seedSave; MGR.seedSave = null; } }
function mgStop(){ mgUnseed(); MGR.alive = false; cancelAnimationFrame(MGR.raf); MGR.tos.forEach(clearTimeout); MGR.tos = []; MGR.key = MGR.keyup = MGR.up = null; }
function mgAfter(ms, fn){ const t = setTimeout(()=>{ if(MGR.alive) fn(); }, ms); MGR.tos.push(t); return t; }
/* bucle de animación con "hit-stop": los golpes fuertes congelan el juego un instante */
function mgLoop(fn){
  let last = performance.now();
  const tick = t=>{
    if(!MGR.alive) return;
    if(t < MGR.freeze){ last = t; MGR.raf = requestAnimationFrame(tick); return; }
    const dt = Math.min(.05, Math.max(0,(t-last)/1000)); last = t;
    if(fn(dt, t)!==false && MGR.alive) MGR.raf = requestAnimationFrame(tick);
  };
  MGR.raf = requestAnimationFrame(tick);
}
function hitStop(ms){ MGR.freeze = performance.now() + (ms||70); }
/* paleta de los minijuegos: sale de las variables CSS, así respeta el modo oscuro */
const C = {paper:'#faf5e9', paper2:'#e7dbbf', paper3:'#d6c49e', ink:'#1c1915', ink3:'#655b4d', red:'#cf3a1f', red2:'#a52a14', mustard:'#e3a92c', green:'#2e6b44', blue:'#2a5297', photo:'#e7dbbf', dark:false};
let SVG_DEFS = '', GLOVE = '';
function refreshPalette(){

    for(const k in M){ const x = v(M[k]); if(x) C[k] = x; }
    C.dark = document.documentElement.getAttribute('data-theme')==='dark';
  }catch(e){}
  SVG_DEFS = `<defs>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${C.ink}" stroke-width="1.6"/></pattern>
  <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.2" fill="${C.ink}" opacity=".25"/></pattern>
</defs>`;
  GLOVE = `<path d="M-12 -2 C-14 -12 -8 -19 1 -19 C10 -19 15 -12 14 -4 L14 4 C14 11 9 15 1 15 L-4 15 C-9 15 -12 11 -12 6 Z" fill="${C.red}" stroke="${C.ink}" stroke-width="2.6"/>
  <path d="M-12 2 C-17 2 -18 -5 -14 -7 C-11 -8 -9 -6 -9 -3" fill="${C.red}" stroke="${C.ink}" stroke-width="2.6"/>
  <rect x="-8" y="13" width="17" height="8" rx="1.5" fill="${C.paper}" stroke="${C.ink}" stroke-width="2.6"/>
  <path d="M-5 -13 C-1 -16 5 -16 8 -12" stroke="${C.paper}" stroke-width="2" fill="none" opacity=".75"/>`;

refreshPalette();
function polar(r, a){ const t = (a-90)*Math.PI/180; return [r*Math.cos(t), r*Math.sin(t)]; }
function arcPath(r, a0, a1){
  if(a1-a0>=359.9) a1 = a0+359.9;
  const [x0,y0] = polar(r,a0), [x1,y1] = polar(r,a1), large = (a1-a0)>180 ? 1 : 0;
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
/* flechas dibujadas (los caracteres ◀ ▶ se ven como emoji en algunos celulares) */
const TRI = 'M0 -9 L8.5 6 L-8.5 6 Z';
function triSvg(deg){ return `<svg class="tri" viewBox="-12 -12 24 24" width="22" height="22" aria-hidden="true"><path d="${TRI}" transform="rotate(${deg})" fill="currentColor"/></svg>`; }
function octPts(r){ return Array.from({length:8},(_,i)=>polar(r, i*45+22.5).map(v=>v.toFixed(1)).join(',')).join(' '); }
function angDist(a, b){ return Math.abs(((a-b)%360+540)%360-180); }
/* la lona: octógono en tinta con la reja rayada */
function octagonBg(){ return `<polygon points="${octPts(158)}" fill="url(#hatch)" opacity=".18"/>
  <polygon points="${octPts(150)}" fill="${C.paper}" stroke="${C.ink}" stroke-width="3"/>
  <polygon points="${octPts(142)}" fill="none" stroke="${C.ink}" stroke-width="1" stroke-dasharray="3 5"/>`; }
/* caras: la del rival (o la tuya) dibujada dentro del SVG del juego */
function contOf(cc){ const c = COUNTRIES.find(x=>x.c===cc); return c ? c.cont : null; }
function faceOf(f, expr){ return portrait(f.name, f===G.p ? 'me' : 'fighter', expr, {cont:contOf(f.cc), look:f===G.p ? f.look : undefined}); }
function faceInner(f, expr){ return faceOf(f, expr).replace(/^<svg[^>]*>|<\/svg>$/g, ''); }
/* en el modo oscuro las caras van sobre un círculo claro, como una foto pegada */
function faceBack(){ return C.dark ? `<circle cx="50" cy="52" r="47" fill="${C.photo}" stroke="${C.ink}" stroke-width="2"/>` : ''; }
function faceG(id, x, y, size){ return `<g transform="translate(${x} ${y}) scale(${size/100})">${faceBack()}<g id="${id}"></g></g>`; }


function mgRun(gid, d){
  mgStop(); MGR.alive = true; MGR.freeze = 0; refreshPalette();
  /* el azar interno de los minijuegos no toca la semilla del desafío del día */
  MGR.seedSave = RNGS.seeded; RNGS.seeded = false;

  let finished = false;

    },

    timer(frac){ if(timer){ timer.parentNode.style.visibility = frac===null ? 'hidden' : 'visible'; if(frac!==null) timer.style.transform = `scaleX(${clamp(frac,0,1)})`; } },

document.addEventListener('keydown', e=>{ if(MGR.key && MGR.alive) MGR.key(e); else if(!MGR.alive) screenKey(e); });
document.addEventListener('keyup', e=>{ if(MGR.keyup && MGR.alive) MGR.keyup(e); });
window.addEventListener('pointerup', e=>{ if(MGR.up && MGR.alive) MGR.up(e); });
window.addEventListener('pointercancel', e=>{ if(MGR.up && MGR.alive) MGR.up(e); });

function botTier(d, s, luck){
  const r = R();
  if(luck){ const p = luckP(d); if(r < p*.3) return 'perfect'; if(r < p) return 'win'; if(r > 1-(1-p)*.2) return 'ko'; return 'lose'; }
  /* calibrado con el humano simulado: promedio ~65% parejo, ~35% difícil; flojo ~40% parejo */
  const off = -.2 + (s-.3)*1.7 + Math.max(0, s-.6)*1.5;
  const pw = clamp(sigmoid(2*(off - d)), .03, .97);
  if(r < pw*(.2+.35*s)) return 'perfect';
  if(r < pw) return 'win';
  if(r > 1-(1-pw)*.2) return 'zero';
  return 'lose';

/* ---------- 6. TA-TE-TI DE LA JAULA (estrategia) ---------- */
const TTT_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function tttWinner(b){ for(const l of TTT_LINES){ if(b[l[0]] && b[l[0]]===b[l[1]] && b[l[1]]===b[l[2]]) return {w:b[l[0]], l}; } return b.every(v=>v) ? {w:0} : null; }
function tttBest(b, me){
  const other = me===1 ? 2 : 1;
  let best = -2, move = null;
  for(let i=0;i<9;i++){ if(b[i]) continue; b[i] = me; const s = -tttScore(b, other); b[i] = 0; if(s>best){ best = s; move = i; } }
  return move;
}
function tttScore(b, turn){
  const w = tttWinner(b);
  if(w) return w.w===0 ? 0 : (w.w===turn ? 1 : -1);
  let best = -2;
  for(let i=0;i<9;i++){ if(b[i]) continue; b[i] = turn; const s = -tttScore(b, turn===1?2:1); b[i] = 0; if(s>best) best = s; if(best===1) break; }
  return best;
}

MG.ruleta = {icon:'ruleta', nm:'La ruleta', stat:'ovr', luck:true, hint:'Girá y rezale a quien quieras',

    function spin(){

      const from = rot, to = rot + 360*(c.quick ? 4 : 5) + rand(0,360), dur = c.quick ? 2400 : 3300, t0 = performance.now();
      let lastSlice = -1;
      mgLoop(()=>{
        const k = Math.min(1,(performance.now()-t0)/dur), e = 1-Math.pow(1-k,3);
        rot = from + (to-from)*e; rW.setAttribute('transform', `rotate(${rot.toFixed(2)})`);
        const under = ((360 - rot%360)%360 + 360)%360;

        if(k>=1){

    const el = i=>$('kC'+i);
    const flip = (i, back)=>{ el(i).style.transform = `translate(-50%,-50%) rotateY(${back?180:0}deg)`; };

          else if(vals[0]===1 && vals[1]===1){ tier = 'ko'; c.pop('¡DOBLE UNO!','bad'); }
          else if(s>=target){ tier = 'win'; c.pop(`¡${s}!`,'ok'); }
          else { tier = 'lose'; c.pop(`${s}…`,'bad'); }
          $('dS').innerHTML = `<span style="color:${tier==='win'||tier==='perfect'?C.ink:C.red2}">Suma ${s}</span>`;
          c.done(tier); return false;
        }
      });
    }
    c.onTap(roll);
  }};

/* ---------- 11. EL DUELO (nuevo): el primero que pega ---------- */
MG.duelo = {icon:'rayo', nm:'El duelo', stat:'reflejos', fin:'KO', hint:'Esperá el ¡YA! y pegá primero',
  how:'Cara a cara y quietos. Cuando aparezca <b class="r">¡YA!</b>, tocá antes que él. Si te adelantás en un amague, perdés el cruce. Ganá dos de tres.',
  run(c){
    const rivalRT = ()=>byDiff(c.d, 470, 330, 250) + rand(-60,60);
    const feints = c.d>.8 ? 2 : c.d>-.2 ? 1 : 0;
    let n = 0, won = 0, phase = 'wait', goAt = 0;
    const res = [];
    c.stage.innerHTML = `<svg viewBox="-160 -160 320 320">${SVG_DEFS}
      <rect x="-160" y="-160" width="320" height="320" fill="${C.paper}"/>
      <rect x="-160" y="92" width="320" height="68" fill="url(#hatch)" opacity=".16"/><line x1="-160" y1="92" x2="160" y2="92" stroke="${C.ink}" stroke-width="3"/>
      <g id="duMe" style="transition:transform .12s ease-out"><g transform="translate(-156 -54) scale(1.46)">${faceBack()}${faceInner(G.p,'angry')}</g></g>
      <g id="duOp" style="transition:transform .12s ease-out"><g transform="translate(156 -54) scale(-1.46 1.46)">${faceBack()}<g id="duOpF"></g></g></g>
      <g id="duSign" transform="translate(0 -122)"><rect x="-64" y="-28" width="128" height="56" fill="${C.paper2}" stroke="${C.ink}" stroke-width="3"/><text id="duTxt" y="12" font-size="32" text-anchor="middle" fill="${C.ink}">QUIETO</text></g>
    </svg>`;
    const sign = $('duSign'), txt = $('duTxt'), opF = $('duOpF'), opG = $('duOp'), meG = $('duMe');
    const setOp = e=>{ opF.innerHTML = faceInner(c.opp, e); };
    setOp('angry');
    c.pips(3, res);
    c.tapButton('¡PEGÁ!');
    function signal(text, fill, col){ txt.textContent = text; sign.querySelector('rect').setAttribute('fill', fill); txt.setAttribute('fill', col||C.ink); }
    function round(){
      phase = 'wait'; signal('QUIETO', C.paper2); setOp('angry');
      opG.style.transform = ''; meG.style.transform = '';
      const delay = c.quick ? rand(700, 1500) : rand(900, 2000), nf = R()<.7 ? feints : 0;
      for(let k=0;k<nf;k++){
        const at = rand(350, Math.max(400, delay-300));
        mgAfter(at, ()=>{ if(phase!=='wait') return; phase = 'feint'; signal('¡UUH!', C.mustard); opG.style.transform = 'translateX(-14px)'; SFX.whoosh();
          mgAfter(280, ()=>{ if(phase==='feint'){ phase = 'wait'; signal('QUIETO', C.paper2); opG.style.transform = ''; } }); });
      }
      mgAfter(delay, ()=>{
        if(phase!=='wait' && phase!=='feint') return;
        phase = 'go'; goAt = performance.now();
        signal('¡YA!', C.red, C.paper); SFX.bell();
        const rt = rivalRT();
        mgAfter(rt, ()=>{ if(phase==='go') resolve(false, 'slow'); });
      });
    }
    function resolve(win, why){
      if(phase==='done') return;
      phase = 'done'; n++; res.push(win?1:0); if(win) won++; c.pips(3, res);
      if(win){
        const ms = Math.round(performance.now()-goAt);
        meG.style.transform = 'translateX(70px)'; setOp('crit'); c.pop(choice(ONO.gold),'gold'); SFX.crit(); hitStop(90); shake(c.stage); flashScreen('y');
        signal(ms+' ms', C.ink, C.paper);
      } else {
        opG.style.transform = 'translateX(-70px)'; setOp(why==='early' ? 'smirk' : 'happy');
        c.pop(why==='early' ? '¡ADELANTADO!' : '¡PUM!','bad'); SFX.hurt(); shake(c.stage); flashScreen('r');
        if(why==='early') signal('FALTA', C.red, C.paper);
      }
      if(n>=3) return mgAfter(500, ()=>c.done(won===3 ? 'perfect' : won===2 ? 'win' : won===1 ? 'lose' : 'zero'));
      mgAfter(1000, round);
    }
    function tap(){
      if(phase==='go') resolve(true);
      else if(phase==='wait' || phase==='feint') resolve(false, 'early');
    }
    c.onTap(tap);
    mgAfter(400, round);
  }};

/* ---------- 12. COMBO (nuevo): ritmo ---------- */
MG.combo = {icon:'nota', nm:'Combo', stat:'striking', fin:'KO', hint:'Tocá cada golpe cuando cruce la línea roja',
  how:'Los golpes bajan por tres carriles: <b>jab, cross y gancho</b>. Tocá el carril justo cuando cada golpe cruce la <b class="r">línea roja</b>. Es como la música: llevá el ritmo.',
  run(c){
    const bpm = byDiff(c.d, 96, 116, 140), beat = 60000/bpm;
    const COMBOS = [[0,1,2,1],[0,0,1,2],[0,1,0,1],[2,1,0,1],[0,1,2,2],[1,0,1,2]];
    const lanes = c.quick ? [...choice(COMBOS)] : [...choice(COMBOS), ...choice(COMBOS)], NN = lanes.length;
    const fall = byDiff(c.d, 1500, 1250, 1000), perf = byDiff(c.d, 70, 50, 35), good = byDiff(c.d, 140, 100, 70);
    const start = performance.now() + 900;
    let acc = 0;
    const notes = lanes.map((l,i)=>{ const t = start + fall + acc; acc += beat*(i%4===3 ? 1.25 : .75); return {l, t, done:false}; });
    let score = 0, streak = 0;
    const res = [], LX = [-96, 0, 96], HITY = 112, TOPY = -150;
    c.stage.innerHTML = `<svg viewBox="-160 -160 320 320">${SVG_DEFS}
      <rect x="-160" y="-160" width="320" height="320" fill="${C.paper}"/>
      ${LX.map((x,i)=>`<rect x="${x-48}" y="-160" width="96" height="320" fill="${i===1?C.paper2:C.paper}"/>`).join('')}
      <line x1="-48" y1="-160" x2="-48" y2="160" stroke="${C.ink}" stroke-width="1.5"/><line x1="48" y1="-160" x2="48" y2="160" stroke="${C.ink}" stroke-width="1.5"/>
      <rect x="-160" y="${HITY-16}" width="320" height="32" fill="rgba(207,58,31,.14)"/>
      <line x1="-160" y1="${HITY}" x2="160" y2="${HITY}" stroke="${C.red}" stroke-width="4"/>
      ${LX.map((x,i)=>`<text x="${x}" y="152" font-size="15" text-anchor="middle" fill="${C.ink}">${['JAB','CROSS','GANCHO'][i]}</text>`).join('')}
      ${notes.map((n,i)=>`<g id="cbn${i}" opacity="0"><circle r="22" fill="${C.ink}"/><circle r="22" fill="none" stroke="${C.paper}" stroke-width="2" stroke-dasharray="3 4"/><text y="8" font-size="22" text-anchor="middle" fill="${C.paper}">${n.l+1}</text></g>`).join('')}
      <text id="cbS" x="0" y="-122" font-size="26" text-anchor="middle" fill="${C.red}"></text>
    </svg>`;
    c.act.innerHTML = `<div class="lanes"><button data-l="0">1<small>jab</small></button><button data-l="1">2<small>cross</small></button><button data-l="2">3<small>gancho</small></button></div>`;
    c.pips(NN, res);
    let lastBeat = -1;
    function judge(n, dt){
      n.done = true; const g = $('cbn'+notes.indexOf(n));
      const a = Math.abs(dt);
      const pts = a<=perf ? 2 : a<=good ? 1 : 0;
      score += pts; res.push(pts); c.pips(NN, res);
      if(pts){ streak++; (pts===2 ? SFX.crit : SFX.hit)(); if(pts===2) hitStop(35); g.setAttribute('opacity',0); c.pop(pts===2 ? choice(ONO.gold) : choice(ONO.ok), pts===2?'gold':'ok', true); }
      else { streak = 0; SFX.whiff(); }
      $('cbS').textContent = streak>=3 ? `COMBO x${streak}` : '';
    }
    function lane(l){
      if(!MGR.alive) return;
      const now = performance.now();
      const cand = notes.filter(n=>!n.done && n.l===l && Math.abs(now-n.t)<=good*1.6).sort((a,b)=>Math.abs(now-a.t)-Math.abs(now-b.t))[0];
      if(cand) judge(cand, now-cand.t); else SFX.tap();
    }
    c.stage.addEventListener('pointerdown', e=>{ if(!MGR.alive) return; e.preventDefault(); const r = c.stage.getBoundingClientRect(); lane(clamp(Math.floor((e.clientX-r.left)/r.width*3),0,2)); });
    c.act.querySelectorAll('button').forEach(b=>b.addEventListener('pointerdown', e=>{ if(!MGR.alive) return; e.preventDefault(); lane(+b.dataset.l); }));
    MGR.key = e=>{ const m = {ArrowLeft:0, KeyA:0, KeyJ:0, Digit1:0, ArrowDown:1, ArrowUp:1, KeyS:1, KeyK:1, Digit2:1, ArrowRight:2, KeyD:2, KeyL:2, Digit3:2}; if(e.code in m){ e.preventDefault(); if(!e.repeat) lane(m[e.code]); } };
    mgLoop(()=>{
      const now = performance.now();
      const b = Math.floor((now-start)/beat);
      if(b!==lastBeat && now>start-200 && now < notes[notes.length-1].t){ lastBeat = b; SFX.tick(); }
      notes.forEach((n,i)=>{
        if(n.done) return;
        const g = $('cbn'+i);
        const k = 1 - (n.t-now)/fall;
        if(k<0){ g.setAttribute('opacity',0); return; }
        g.setAttribute('opacity',1);
        g.setAttribute('transform', `translate(${LX[n.l]} ${(TOPY + (HITY-TOPY)*k).toFixed(1)})`);
        if(now - n.t > good){ judge(n, 999); g.setAttribute('opacity',.25); }
      });
      if(notes.every(n=>n.done)){
        const k = NN/8; c.done(score>=14*k ? 'perfect' : score>=11*k ? 'win' : score>=5*k ? 'lose' : 'zero'); return false;
      }
    });
  }};

/* ---------- 13. GROUND & POUND (nuevo): pegale a los huecos ---------- */
MG.gnp = {icon:'puno', nm:'Ground & pound', stat:'wrestling', fin:'TKO', hint:'Pegale a los huecos rojos, no a la guardia',
  how:'Lo tenés de espaldas en el piso. Se abren <b class="r">huecos rojos</b> en su guardia: pegale rápido. Si le pegás a la <b>guardia rayada</b>, perdés el ritmo.',
  run(c){
    const win = byDiff(c.d, 800, 600, 470), every = byDiff(c.d, 560, 470, 380), total = c.quick ? 5 : 8;
    const SP = [[-92,-70],[0,-100],[92,-70],[-92,62],[0,100],[92,62]];
    let spawned = 0, hits = 0, bad = 0;
    const live = {};
    c.stage.innerHTML = `<svg viewBox="-160 -160 320 320">${SVG_DEFS}${octagonBg()}
      ${faceG('gF', -58, -60, 116)}
      ${SP.map(([x,y],i)=>`<g id="gS${i}" transform="translate(${x} ${y})" style="cursor:pointer"><circle r="34" fill="${C.paper2}" stroke="${C.ink}" stroke-width="2.5" stroke-dasharray="5 4"/><g id="gT${i}"></g></g>`).join('')}
    </svg>`;
    const gF = $('gF');
    c.face(gF, 'scared');
    c.hud.innerHTML = `Golpes <b id="gH" style="font-size:18px">0</b> · guardia <b id="gB" class="r" style="font-size:18px">0</b>`;
    function show(i, kind){
      const t = $('gT'+i);
      t.innerHTML = kind==='open' ? `<circle r="30" fill="${C.red}" stroke="${C.ink}" stroke-width="3"/><text y="9" font-size="22" text-anchor="middle" fill="${C.paper}">¡YA!</text>`
                                   : `<circle r="30" fill="${C.paper}" stroke="${C.ink}" stroke-width="3"/><circle r="30" fill="url(#hatch)" opacity=".7"/><text y="6" font-size="14" text-anchor="middle" fill="${C.ink}" stroke="${C.paper}" stroke-width="3" paint-order="stroke">GUARDIA</text>`;
      if(t.animate) t.animate([{transform:'scale(.3)'},{transform:'scale(1)'}], {duration:120, easing:'ease-out'});
    }
    function hide(i){ const t = $('gT'+i); if(t) t.innerHTML = ''; delete live[i]; }
    function spawn(){
      const free = SP.map((_,i)=>i).filter(i=>!live[i]); if(!free.length) return;
      const i = choice(free), kind = (spawned>1 && R()<.28) ? 'guard' : 'open';
      if(kind==='open') spawned++;
      const tok = {kind, at:performance.now()};
      live[i] = tok;
      show(i, kind);
      mgAfter(kind==='open' ? win : win*1.2, ()=>{ if(live[i]===tok){ if(kind==='open') c.face(gF,'smirk'); hide(i); } });
    }
    function tapSpot(i){
      if(!MGR.alive) return;
      const L = live[i]; if(!L) return;
      hide(i);
      if(L.kind==='open'){ hits++; $('gH').textContent = hits; c.pop(choice(ONO.gold),'gold',true); SFX.crit(); hitStop(55); shake(c.stage); c.face(gF, hits>=6 ? 'crit' : 'hit'); }
      else { bad++; $('gB').textContent = bad; c.pop('¡GUARDIA!','bad',true); SFX.block(); c.face(gF,'smirk'); }
    }
    SP.forEach((_,i)=>$('gS'+i).addEventListener('pointerdown', e=>{ if(!MGR.alive) return; e.preventDefault(); tapSpot(i); }));
    MGR.key = e=>{ const m = {Digit1:0, Digit2:1, Digit3:2, Digit4:3, Digit5:4, Digit6:5, KeyQ:0, KeyW:1, KeyE:2, KeyA:3, KeyS:4, KeyD:5}; if(e.code in m){ e.preventDefault(); if(!e.repeat) tapSpot(m[e.code]); } };
    const T0 = performance.now(), dur = total*every*1.35 + win + 900;
    let nextAt = T0 + 500;
    mgLoop(()=>{
      const now = performance.now();
      if(now>=nextAt && spawned<total){ spawn(); nextAt = now + every*rand(.8,1.2); }
      c.timer(1 - (now-T0)/dur);
      if((spawned>=total && !Object.values(live).some(l=>l.kind==='open')) || now-T0>dur){
        c.timer(null);
        const net = hits - bad;
        if(net>=total) c.face(gF,'ko');
        c.done(net>=total ? 'perfect' : net>=Math.round(total*.75) ? 'win' : net>=Math.round(total*.38) ? 'lose' : 'zero'); return false;
      }
    });
  }};

function render(){
  const app = $('app');
  let h = '';
  switch(UI.screen){
    case 'create': h = scrCreate(); break;
    case 'career': h = scrCareer(); break;
    case 'fight':  h = scrFight(); break;
    case 'ko':     h = scrKO(); break;
    case 'end':    h = scrEnd(); break;
    default:       h = scrMenu();
  }
  if(UI.modal) h += modalHtml();
  app.innerHTML = h;
  const stepKey = UI.screen + (G ? ':'+G.step+':'+G.season : '') + (F ? ':'+F.phase+F.round : '');
  if(stepKey!==UI.lastKey){ UI.lastKey = stepKey; if(!UI.bot) window.scrollTo(0,0); }
  if(UI.screen==='career' && G.step==='yearEnd' && G.lastFight && G.lastFight.belt && !G.lastFight._conf){ G.lastFight._conf = true; if(!UI.bot){ confetti(110); SFX.great(); } }
  if(UI.screen==='end' && !G.final._conf){ G.final._conf = true; if(!UI.bot && G.final.rk.lv>=4){ confetti(130); SFX.great(); } }
  if(UI.bot) botStep(); else typewrite();
}
/* los diálogos aparecen letra por letra (tocá el globo para verlo entero) */
function typewrite(){
  document.querySelectorAll('[data-tw]:not([data-done])').forEach(el=>{
    const full = el.textContent; el.dataset.done = 1; el.textContent = '';
    let i = 0; const t = setInterval(()=>{ i += 2; el.textContent = full.slice(0, i); if(i>=full.length) clearInterval(t); }, 16);
    el.addEventListener('click', ()=>{ clearInterval(t); el.textContent = full; });
  });
}

/* ---------- PELEA ---------- */
function scrFight(){
  const p = G.p, o = F.opp, b = F.type==='regular' ? {type:'regular', opp:o} : G.big;
  const body = F.phase==='trash' ? fightTrash() : F.phase==='intro' ? fightIntro() : fightPlay();
  const side = (f, me)=>`<aside class="f-side ${me?'me':'op'}">${me ? meFace('angry') : oppFace(f,'angry')}<div class="nm">${escapeHtml(f.name)}</div>
      <div class="mt">${me ? `${f.record.w}-${f.record.l} · ${rankLabel(f)}` : `${f.dispRank==='C' ? 'Campeón' : f.dispRank ? '#'+f.dispRank : 'Sin ranking'}${f.spec ? ' · '+STAT_LABEL[f.spec] : ''}`}</div>
      <div class="o">${me ? ovrOf(f) : f.ovr}</div></aside>`;
  return mast() + `<div class="fight">${side(p, true)}<div class="f-center"><div class="fhead">
      <div class="fside">${meFace('angry')}<div style="min-width:0"><div class="n">${escapeHtml(lastName(p.name))}</div><div class="o">OVR ${ovrOf(p)}</div></div></div>
      <div class="rdots" id="rdots">${roundDots()}</div>
      <div class="fside op">${oppFace(o,'angry')}<div style="min-width:0"><div class="n">${escapeHtml(lastName(o.name))}</div><div class="o">OVR ${o.ovr}</div></div></div>
    </div>
    <div class="ftag ${bigClass(b)}">${bigLabel(b)}</div>
    <div class="fbody">${body}</div></div>${side(o, false)}</div>`;
}
function roundDots(){ return Array.from({length:F.max},(_,i)=>{ const h = F.hist[i]; return `<span class="rdot ${h?(h.res==='w'?'w':'l'):''}"></span>`; }).join(''); }
function fightTrash(){
  const t = TRASH[F.trash.i], o = F.opp, me = G.p;
  if(F.trashRes){
    const q = F.trashRes.q, said = F.trashRes.k>=0 ? F.trash.opts[F.trashRes.k][0].replace('{me}', me.name) : '…';
    const RS = [{t:'Papelón', c:'bad', d:'Hasta tu equipo se rió. Entrás con la cabeza caliente: el primer round es más difícil.'},
                {t:'Tibio', c:'', d:'Zafaste. Un poquito de ventaja para el primer round.'},
                {t:'¡Picante!', c:'gold', d:'El estadio explotó y lo sacaste de quicio: el primer round es mucho más fácil. +2 de fama.'}][q];
    return `<div class="round-k">Cara a cara</div>
      <div class="intro">
        <div style="width:110px;margin:0 auto 8px;border:2.5px solid var(--ink);background:var(--photo)">${oppFace(o, q===2 ? 'scared' : q===0 ? 'happy' : 'neutral')}</div>
        <div class="round-res" style="position:static;background:none;padding:0;animation:none"><div class="big ${RS.c}">${RS.t}</div></div>
        <div class="bubble" style="text-align:left;margin-top:16px">«${escapeHtml(said)}»</div>
        <p class="hw">${RS.d}</p>
        <button class="btn" data-k="enter" onclick="afterTrash()">¡A pelear!</button>
        <div class="timer" style="margin-top:12px"><i style="animation:drain 2.2s linear forwards"></i></div>
      </div>`;
  }
  return `<div class="round-k">Cara a cara</div>
    <div class="ev" style="margin-top:8px">${oppFace(o,'angry')}<div><div class="ev-who">${escapeHtml(o.name)}</div><div class="ev-role">Te mira fijo y te dice:</div></div></div>
    <div class="bubble">«${escapeHtml(t.l)}»</div>
    <div class="step-k" style="margin:14px 0 8px"><span>Tu respuesta</span></div>
    ${F.trash.opts.map((op,i)=>`<button class="choice" data-k="${i+1}" onclick="chooseTrash(${i})"><span class="n">${i+1}</span><span>${escapeHtml(op[0].replace('{me}', me.name))}</span><span></span></button>`).join('')}`;
}
function afterTrash(){ if(F && F.phase==='trash' && F.trashRes) nextRound(); }
function fightIntro(){
  const g = MG[F.game], d = roundDiff(F.game), isNew = !G.seenGames[F.game], o = F.opp;
  const oRank = o.dispRank==='C' ? 'campeón' : o.dispRank ? '#'+o.dispRank : 'sin ranking';
  const head = F.type==='regular' ? `Pelea ${F.num} de ${F.of+1} del año · contra ${escapeHtml(o.name)}, ${oRank}, OVR ${o.ovr}`
    : F.max===1 ? 'La pelea del año, a un round' : `Round ${F.round+1} de ${F.max}${F.meW||F.opW ? ` · van ${F.meW}-${F.opW}` : ''}`;
  return `<div class="round-k">${head}</div>
    <div class="intro">
      ${F.retry ? '<span class="nv">Segunda chance</span>' : isNew ? '<span class="nv">Juego nuevo</span>' : ''}
      ${ico(g.icon,'gi')}

      <p class="hw">${(isNew || F.retry) ? g.how : g.hint}</p>
      <div class="df">${g.luck ? '' : diffMeter(d)+' '}${statsLine(F.game)}</div>
      <button class="btn" data-k="enter" onclick="beginRound()">¡Vamos!</button>
    </div>`;
}
function fightPlay(){
  const g = MG[F.game];
  return `<div class="mg-t">${ico(g.icon)}${g.nm}</div><div class="mg-sub" id="mgSub">${g.hint||''}</div>
    <div class="stage" id="stage"></div>
    <div class="timer" style="visibility:hidden"><i id="mgTimer"></i></div>
    <div class="hud" id="mgHud"></div>
    <div class="act" id="mgAct"></div>`;
}
function showRoundOverlay(){
  const st = $('stage');
  if(!st){ render(); return; }
  const t = F.last, win = t==='perfect' || t==='win', single = F.max===1;
  let big, cls, sm;
  if(t==='perfect'){ big = F.end.method==='Sumisión' ? '¡Se rindió!' : F.end.method==='TKO' ? '¡T.K.O.!' : '¡Nocaut!'; cls = 'gold'; sm = 'Perfecto: se terminó la pelea.'; }
  else if(t==='ko'){ big = F.end.method==='Sumisión' ? '¡Te hizo rendir!' : '¡Te noqueó!'; cls = 'bad'; sm = 'Fallaste todo y te castigó.'; }
  else if(win){ big = single ? '¡Ganaste!' : '¡Round tuyo!'; cls = 'ok'; sm = F.end ? (single ? 'Por decisión de los jueces.' : `Ganaste la pelea ${F.meW}-${F.opW}.`) : `Vas ${F.meW}-${F.opW}.`; }
  else { big = single ? 'Perdiste' : 'Round de él'; cls = 'bad'; sm = F.end ? (single ? 'Los jueces vieron ganar al rival.' : `Perdiste ${F.meW}-${F.opW}.`) : `Van ${F.meW}-${F.opW}.`; }
  const div = document.createElement('div'); div.className = 'round-res';
  div.addEventListener('pointerdown', e=>e.stopPropagation());
  if(!F.canAmuleto) div.addEventListener('click', ()=>afterRound());
  div.innerHTML = `<div class="big ${cls}">${big}</div><div class="sm">${sm}</div>
    ${F.canAmuleto ? `<div class="btns stack"><button class="btn gold" onclick="useAmuleto()">Usar un amuleto (${G.p.amuletos})</button><button class="btn txt" style="width:100%" onclick="afterRound()">Seguir así</button></div>`
      : `<div class="sm muted" style="margin-top:8px;font-size:12px">Tocá para seguir</div><button data-k="enter" style="position:absolute;opacity:0;pointer-events:none" tabindex="-1" onclick="afterRound()">seguir</button>`}`;
  st.appendChild(div);
  const rd = $('rdots'); if(rd) rd.innerHTML = roundDots();
  const act = $('mgAct'); if(act) act.innerHTML = '';
}

/* ---------- KO ---------- */
function scrKO(){
  const lb = G.lastBig, p = G.p, o = lb.opp, win = lb.win, m = lb.method;

      <button data-k="enter" style="position:absolute;opacity:0;pointer-events:none" tabindex="-1" onclick="event.stopPropagation();afterKO()">seguir</button>
    </div></div>`;
}

      <button class="btn txt" style="width:100%" onclick="UI.screen='menu';render()">Volver al afiche</button>
    </div>
    <div class="wrap"><div class="sec-h"><h2>Salón de la fama</h2><small>En este dispositivo</small></div>${hofHtml(f.hofPos)}</div></div></div>`;
}
function hofHtml(hi){
  const hof = LS.get('idolo_mma_hof', []);
  if(!hof.length) return '<p class="muted" style="font-size:13px">Todavía no hay carreras terminadas.</p>';
  return hof.map((h,i)=>`<div class="hof-row ${i===hi?'me':''}"><div class="p">${i+1}</div>
    <div style="min-width:0"><div class="n">${flag(h.cc)}<span>${escapeHtml(h.n)}</span></div><div class="d">${h.rk} · ${h.rec} · como ${escapeHtml(h.lg)}</div></div>
    <div class="s">${h.sc}</div></div>`).join('');
}
/* el texto para compartir: corto y con cuadraditos, como Wordle */
function shareText(){
  const f = G.final, c = f.c;
  const SQ = {w:'🟩', l:'🟥', t:'🟨', x:'⬛'};
  const marks = (f.marks||[]).map(m=>SQ[m]||'⬛').join('');
  return [f.daily ? `El Ídolo: MMA · Desafío N.º ${dailyNo(f.daily)}` : 'El Ídolo: MMA',
    `${f.rk.t} · ${f.sc} pts`,
    marks,
    `${c.w}-${c.l} · ${c.ko} KO · ${c.sub} SUB${c.titles.length ? ' · '+c.titles.length+(c.titles.length===1?' cinturón':' cinturones') : ''}`,
    `Como ${f.lg.n}`].join('\n');
}
function shareCareer(){
  const txt = shareText(), b = $('shareBtn');
  const done = ok=>{ if(b) b.textContent = ok ? 'Copiado: pegalo donde quieras' : 'No se pudo copiar'; };
  if(navigator.share && /Mobi|Android|iPhone/i.test(navigator.userAgent)){ navigator.share({text:txt}).catch(()=>{}); return; }
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(()=>done(true), ()=>done(false));
  else done(false);
}
function playAgain(){
  const c = G.final.c;
  UI.draft = {name:c.name, cc:c.cc, wc:c.wc, style:c.style, persona:c.persona, look:c.look, err:''};
  startCareer();
}

/* ---------- MODALES ---------- */
function openModal(k){ UI.modal = k; SFX.tap(); render(); }
function closeModal(){ UI.modal = null; render(); }
function shopHtml(){
  const p = G.p;
  return `<h3>La tienda</h3><p>Tenés <b>${fmtMoney(p.money)}</b>. Lo que es para siempre dura toda la carrera; lo demás se compra una vez por temporada.</p>
    <div class="shop">${shopItems().map(it=>{ const st = shopState(it), lv = shopLvl(it.id);
      return `<div class="shop-row ${st}">${ico(it.icon)}<div class="si"><b>${it.nm}${it.max>1 ? ` <small>nivel ${lv} de ${it.max}</small>` : it.max===1 && lv ? ' <small>tuyo</small>' : ''}</b><span>${it.ds}</span></div>
        <button class="btn sm ${st==='ok'?'gold':'paper'}" ${st==='ok'?'':'disabled'} onclick="doBuy('${it.id}')">${st==='max' ? 'Listo' : st==='used' ? 'Este año, ya' : fmtMoney(shopPrice(it))}</button></div>`; }).join('')}</div>
    <button class="btn paper" style="margin-top:12px" onclick="closeModal()">Cerrar</button>`;
}
function doBuy(id){ if(buyItem(id)){ SFX.coin(); render(); save(); } else SFX.buzz(); }
function confirmRetire(b){
  if(b.dataset.sure){ retireNow(); return; }
  b.dataset.sure = 1; b.textContent = '¿Seguro? Tocá de nuevo';
}
function modalHtml(){
  let inner = '';
  if(UI.modal==='hof') inner = `<h3>Salón de la fama</h3>${hofHtml(-1)}<button class="btn paper" style="margin-top:12px" onclick="closeModal()">Cerrar</button>`;
  if(UI.modal==='how') inner = `<h3>Cómo se juega</h3>
    <p>Cada temporada elegís <b>una carta</b> de mejora, a veces tomás <b>una decisión</b> y jugás <b>todas tus peleas</b>: una de cartelera, corta, y <b>la pelea del año</b>. Cada pelea se define con un minijuego; contra mejores rivales, más difícil.</p>
    <p>Ganá, subí en el ranking, sacá cinturones y llegá a la UFC antes de que el cuerpo diga basta. A los 33 te preguntan si seguís; a los 38 se termina.</p>
    <p><b>La personalidad cambia todo:</b> el cabulero juega a la suerte, el habilidoso a la técnica, el bocón bardea antes de pelear y el guerrero no se rinde nunca. El bocón y el guerrero eligen antes de cada pelea grande si la juegan con técnica o al instinto.</p>
    <p>En el <b>desafío del día</b> todos arrancan con el mismo peleador y la misma suerte.</p>
    <button class="btn paper" onclick="closeModal()">Entendido</button>`;
  if(UI.modal==='shop' && G && G.p) inner = shopHtml();
  if(UI.modal==='look' && G && G.p) inner = `<h3>Tu look</h3><p>Cambialo cuando quieras: pelo, barba, marcas.</p>${lookEditor('p')}<button class="btn" style="margin-top:12px" onclick="closeModal()">Listo</button>`;
  if(UI.modal==='menu') inner = `<h3>Pausa</h3>
    <p>Tu carrera se guarda sola. Podés salir y volver cuando quieras.</p>
    <div class="stack">
      <button class="btn paper" onclick="openModal('shop')">La tienda</button>
      <button class="btn paper" onclick="openModal('look')">Cambiar el look</button>
      <button class="btn paper" onclick="UI.modal=null;UI.screen='menu';render()">Salir al afiche</button>
      <button class="btn ink" onclick="confirmRetire(this)">Retirarme ahora</button>
      <button class="btn" onclick="closeModal()">Volver a la carrera</button>
    </div>`;
  return `<div class="modal-bg" onclick="if(event.target===this) closeModal()"><div class="modal">${inner}</div></div>`;
}

/* ---------- teclado ---------- */
function screenKey(e){
  if(e.target && e.target.tagName==='INPUT') return;
  if(e.code==='KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey){ toggleFullscreen(); return; }
  if(UI.modal && e.code==='Escape'){ closeModal(); return; }
  const n = {Digit1:1, Digit2:2, Digit3:3, Digit4:4, Numpad1:1, Numpad2:2, Numpad3:3, Numpad4:4}[e.code];
  if(n){ const b = document.querySelector(`[data-k="${n}"]`); if(b && !b.disabled){ e.preventDefault(); b.click(); } return; }
  if(e.code==='Enter' || e.code==='Space'){
    const b = document.querySelector('[data-k="enter"]');
    if(b && !b.disabled){ e.preventDefault(); b.click(); }
  }
}

/* ---------- bot de prueba (?bot=0.7) ---------- */
function botPickCard(){
  const p = G.p;
  let best = 0, bv = -1e9;
  G.cards.forEach((id,i)=>{
    const c = cardById(id), cost = cardCost(c);
    if(cost && p.money<cost) return;
    let v = 0;
    if(c.g){ const q = {...p}; Object.entries(c.g).forEach(([k,d])=>q[k]=clamp(q[k]+d,10,99)); v = ovrOf(q)-ovrOf(p) + (c.g[p.style]||0)*.15; }
    else v = c.r==='l' ? 3 : 1;
    if(v>bv){ bv = v; best = i; }
  });
  return best;
}
function botShop(){ ['coach','fisico'].forEach(id=>{ const it = SHOP.find(x=>x.id===id); if(shopState(it)==='ok' && G.p.money > shopPrice(it)*1.4) buyItem(id); }); }
function botStep(){
  clearTimeout(UI._bt);
  UI._bt = setTimeout(()=>{
    try{
      if(UI.screen==='career'){
        if(G.step==='card'){ if(!G.picked){ botShop(); pickCard(botPickCard()); } }
        else if(G.celebrate && (G.step==='signing' || G.step==='yearEnd')) doneSigning();
        else if(G.step==='event'){ botShop(); const v = eventView(); const ok = v.choices.map((c,i)=>i).filter(i=>!choiceBlocked(v,i)); doEvent(v.special ? 0 : choice(ok)); }
        else if(G.step==='eventReply') doReply();
        else if(G.step==='match'){ const o = G.matchOpts||[], w = o.findIndex(x=>x.k==='wait'); const r = Math.random(); const pick = w>=0 && r<.5 ? w : o.findIndex(x=>x.k===(r<.25 ? 'up' : r<.8 ? 'mid' : 'safe')); pickMatch(pick>=0 ? pick : 0); }
        else if(G.step==='fights') startRegular();
        else if(G.step==='preview') goFight(Math.random()<.5, Math.random()<.5 ? 'skill' : 'luck');
        else if(G.step==='yearEnd'){ if(G.p.age>=38 || (G.retireAsk && G.p.age>=UI.botRetire)) retireNow(); else goNext(); }
      } else if(UI.screen==='fight'){ if(F && F.phase==='trash'){ if(F.trashRes) afterTrash(); else chooseTrash(randi(0,2)); } }
      else if(UI.screen==='ko') afterKO();
      else if(UI.screen==='end'){ if(UI.onBotEnd) UI.onBotEnd(G.final); }
    }catch(err){ console.error('BOT', err); window.__botError = String(err && err.stack || err); }
  }, UI.botDelay||1);
}

/* ---------- arranque ---------- */
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e=>{ let saved = null; try{ saved = localStorage.getItem('idolo_mma_theme'); }catch(_){ } if(saved) return; setTheme(e.matches ? 'dark' : 'light'); if(!(F && F.phase==='play')) render(); }); }catch(e){}
function init(){
  const q = new URLSearchParams(location.search);
  if(q.has('bot')){
    UI.bot = parseFloat(q.get('bot')) || .6; UI.botRetire = parseInt(q.get('retire')) || 36;
    if(q.get('daily')){ if(q.get('autostart')!=='0'){ startDaily(); return; } }
    UI.draft = {name:'', cc:q.get('cc')||'AR', wc:q.get('wc')||choice(WEIGHT_CLASSES).id, style:q.get('style')||choice(STYLES).id, persona:q.get('persona')||choice(Object.keys(PERSONAS)), err:''};
    if(q.get('autostart')!=='0'){ startCareer(); return; }
  }
  render();
}
window.__idolo = { get G(){ return G; }, get F(){ return F; }, UI, MG, newGame, startCareer, startDaily, render, LS, dailyCfg, todayKey };
init();
