<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="description" content="Simulador de carrera de MMA en el navegador: creá tu peleador y llevalo del circuito regional a la élite mundial.">
<meta name="theme-color" content="#050807">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Ídolo: MMA — Simulador de carrera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg:#050807; --bg-elev:#0c110e; --bg-elev-2:#121a15; --line:#213026;
    --neon:#3bf07a; --neon-deep:#12994a; --neon-glow:rgba(59,240,122,.45); --neon-soft:rgba(59,240,122,.12);
    --red:#ff2e46; --red-dim:#8a1122; --red-glow:rgba(255,46,70,.5);
    --gold:#f2c94c; --gold-dim:#8a7020;
    --text:#f4f7f4; --text-dim:#87968c; --steel:#46564c; --green:#3bf07a;
    --font-display:'Bebas Neue', sans-serif; --font-body:'Inter', sans-serif; --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 720px 480px at 50% -6%, rgba(59,240,122,.14), transparent 60%),
      radial-gradient(ellipse 640px 520px at 0% 100%, rgba(59,240,122,.05), transparent 60%),
      radial-gradient(ellipse 500px 400px at 100% 40%, rgba(255,46,70,.05), transparent 60%),
      var(--bg);
    color:var(--text);font-family:var(--font-body);min-height:100vh;-webkit-font-smoothing:antialiased;
  }
  #app{max-width:760px;margin:0 auto;min-height:100vh;padding:0 0 48px;position:relative;}
  #app::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.6;
    background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.022) 1px, transparent 0);
    background-size:24px 24px;
  }
  #app>*:not(.modal-overlay){position:relative;z-index:1;}
  #app>.modal-overlay{position:fixed;inset:0;z-index:200;}
  h1,h2,h3,.display{font-family:var(--font-display);letter-spacing:.02em;font-weight:400;}
  .mono{font-family:var(--font-mono);}
  button{font-family:var(--font-body);cursor:pointer;border:none;color:var(--text);}
  button:focus-visible, select:focus-visible, input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  ::selection{background:var(--red-dim);color:var(--text);}
  ::placeholder{color:var(--text-dim);opacity:1;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg, rgba(59,240,122,.03), transparent);}
  .brand{font-family:var(--font-display);font-size:23px;letter-spacing:.06em;color:var(--text);}
  .brand span{color:var(--neon);text-shadow:0 0 14px var(--neon-glow);}
  .restart-btn{background:none;color:var(--text-dim);font-size:12px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;}
  .restart-btn:hover{color:var(--text);border-color:var(--neon-deep);}

  .hero{padding:80px 24px 48px;text-align:center;min-height:100vh;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;
    background:radial-gradient(ellipse 520px 400px at 50% 36%, rgba(59,240,122,.10), transparent 62%);}
  .hero::after{content:'';position:absolute;top:26%;left:50%;transform:translateX(-50%);width:340px;height:340px;border-radius:50%;background:radial-gradient(circle, rgba(59,240,122,.16), transparent 68%);filter:blur(20px);pointer-events:none;z-index:0;}
  .hero>*{position:relative;z-index:1;}
  .hero-eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--neon);margin-bottom:20px;}
  .hero h1{font-size:92px;line-height:.84;margin:0 0 6px;text-shadow:0 0 50px rgba(59,240,122,.28);}
  .hero h1 .accent{color:var(--neon);text-shadow:0 0 44px var(--neon-glow);}
  .hero p{color:var(--text-dim);font-size:16px;max-width:470px;margin:22px auto 38px;line-height:1.6;}
  .cta{background:linear-gradient(180deg,#4bff88,#16b055);color:#04140a;font-family:var(--font-display);font-size:25px;letter-spacing:.06em;padding:17px 56px;border-radius:8px;box-shadow:0 0 0 1px rgba(120,255,170,.4), 0 14px 46px -8px var(--neon-glow), inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s ease, box-shadow .15s ease;}
  .cta:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(120,255,170,.6), 0 20px 56px -8px var(--neon-glow);}
  .hero-strip{display:flex;justify-content:center;gap:14px;margin-top:54px;flex-wrap:wrap;}
  .hero-strip div{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.05em;color:var(--text-dim);text-align:center;background:var(--bg-elev);border:1px solid var(--line);border-radius:12px;padding:13px 20px;min-width:94px;}
  .hero-strip b{display:block;font-family:var(--font-display);font-size:27px;margin-bottom:2px;color:var(--neon);}

  .section{padding:20px 20px;}
  .card{background:linear-gradient(180deg, rgba(59,240,122,.03), var(--bg-elev));border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px -18px rgba(0,0,0,.9);}
  .label{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--neon);margin-bottom:10px;display:block;opacity:.9;}
  input[type=text]{width:100%;background:var(--bg-elev-2);border:1px solid var(--line);color:var(--text);padding:12px 13px;border-radius:8px;font-size:15px;font-family:var(--font-body);}
  input[type=text]:focus{border-color:var(--neon-deep);}
  select{width:100%;background:var(--bg-elev-2);border:1px solid var(--line);color:var(--text);padding:12px 36px 12px 13px;border-radius:8px;font-size:15px;font-family:var(--font-body);
    -webkit-appearance:none;-moz-appearance:none;appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233bf07a' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right 13px center;background-size:16px;}
  select:focus{border-color:var(--neon-deep);}
  select option{background:#121a15;color:#f4f7f4;}
  input[type=range]{width:100%;accent-color:var(--neon);}
  .error-text{color:var(--red);font-size:13px;margin-top:6px;min-height:16px;}
  .helper{color:var(--text-dim);font-size:12.5px;margin-top:6px;}

  .spec-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .spec-card{background:var(--bg-elev-2);border:1.5px solid var(--line);border-radius:12px;padding:16px 8px;text-align:center;color:var(--text);transition:transform .12s ease, border-color .12s ease;}
  .spec-card:hover{transform:translateY(-2px);border-color:var(--steel);}
  .spec-card.selected{border-color:var(--neon);background:radial-gradient(circle at 50% 30%, rgba(59,240,122,.16), var(--bg-elev-2));box-shadow:0 0 0 1px var(--neon-deep), 0 0 22px -6px var(--neon-glow);}
  .spec-card .ico{font-size:26px;display:block;margin-bottom:8px;}
  .spec-card .nm{font-family:var(--font-display);font-size:17px;}
  .spec-card .desc{color:var(--text-dim);font-size:11px;margin-top:5px;line-height:1.4;}

  .primary-btn{width:100%;background:linear-gradient(180deg,#4bff88,#16b055);color:#04140a;font-family:var(--font-display);font-size:21px;letter-spacing:.05em;padding:15px;border-radius:10px;margin-top:6px;box-shadow:0 0 0 1px rgba(120,255,170,.35), 0 10px 30px -10px var(--neon-glow), inset 0 1px 0 rgba(255,255,255,.3);transition:transform .12s ease;}
  .primary-btn:hover{transform:translateY(-1px);}
  .primary-btn:disabled{background:var(--steel);opacity:.5;cursor:not-allowed;box-shadow:none;color:#0c110e;}
  .secondary-btn{width:100%;background:var(--bg-elev-2);color:var(--text);font-size:14px;font-weight:600;padding:13px;border-radius:10px;border:1px solid var(--line);}
  .secondary-btn:hover{border-color:var(--steel);}
  .gold-btn{width:100%;background:linear-gradient(180deg,#ffe07a,#d4a520);color:#1a1400;font-family:var(--font-display);font-size:21px;letter-spacing:.05em;padding:15px;border-radius:10px;box-shadow:0 10px 30px -10px rgba(242,201,76,.5), inset 0 1px 0 rgba(255,255,255,.4);}

  .fighter-id{display:flex;align-items:center;gap:14px;}
  .fighter-id .flag{font-size:40px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));}
  .fighter-id .nm{font-family:var(--font-display);font-size:30px;line-height:1;}
  .fighter-id .sub{color:var(--text-dim);font-size:13px;margin-top:4px;font-family:var(--font-mono);}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .chip{font-family:var(--font-mono);font-size:11.5px;background:var(--bg-elev-2);border:1px solid var(--line);padding:6px 11px;border-radius:20px;color:var(--text-dim);}
  .chip b{color:var(--text);}
  .chip.money{color:var(--gold);border-color:var(--gold-dim);background:rgba(242,201,76,.06);}
  .chip.money b{color:var(--gold);}
  .chip.tokens{color:var(--neon);border-color:var(--neon-deep);background:rgba(59,240,122,.06);}
  .chip.tokens b{color:var(--neon);}

  .statbar-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .statbar-row .snm{width:78px;font-size:12.5px;color:var(--text-dim);flex-shrink:0;}
  .statbar-track{flex:1;height:11px;background:var(--bg-elev-2);border-radius:6px;overflow:hidden;border:1px solid var(--line);}
  .statbar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--neon-deep),var(--neon));box-shadow:0 0 12px -2px var(--neon-glow);}
  .statbar-row .sval{width:26px;text-align:right;font-family:var(--font-mono);font-size:12.5px;color:var(--text);}

  .hub-actions{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:6px;}
  .action-tile{background:linear-gradient(180deg, rgba(255,255,255,.015), var(--bg-elev-2));border:1px solid var(--line);border-radius:12px;padding:17px 14px;text-align:left;color:var(--text);transition:transform .12s ease, border-color .12s ease;}
  .action-tile:hover{border-color:var(--neon-deep);transform:translateY(-2px);}
  .action-tile .t{font-family:var(--font-display);font-size:20px;}
  .action-tile .d{color:var(--text-dim);font-size:11.5px;margin-top:4px;line-height:1.4;}
  .action-tile.hero-tile{grid-column:1/-1;background:linear-gradient(120deg, rgba(59,240,122,.16), var(--bg-elev-2) 70%);border-color:var(--neon-deep);box-shadow:0 0 26px -12px var(--neon-glow);}
  .action-tile.hero-tile .t{font-size:24px;}

  .badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
  .badge{font-family:var(--font-mono);font-size:10.5px;background:rgba(59,240,122,.06);border:1px solid var(--neon-deep);color:var(--neon);padding:4px 9px;border-radius:12px;}

  .train-row{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line);}
  .train-row:last-child{border-bottom:none;}
  .train-row .snm{width:70px;font-size:13px;flex-shrink:0;}
  .train-btn{background:rgba(59,240,122,.06);border:1px solid var(--neon-deep);color:var(--neon);font-size:12px;padding:8px 11px;border-radius:8px;white-space:nowrap;flex-shrink:0;font-weight:600;}
  .train-btn:hover{background:rgba(59,240,122,.14);}
  .train-btn:disabled{opacity:.3;color:var(--text-dim);border-color:var(--line);cursor:not-allowed;background:none;}
  .cooldown-note{background:rgba(255,46,70,.1);border:1px solid var(--red-dim);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--text-dim);margin-bottom:14px;}

  .modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(3px);padding:16px;overflow-y:auto;}
  .modal{background:var(--bg-elev);border:1px solid var(--line);border-top:3px solid var(--neon);border-radius:16px;margin:auto;padding:24px 22px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 -10px 40px -10px var(--neon-glow);}
  @media(min-width:600px){.modal{border-radius:16px;}}
  .modal h3{font-size:26px;margin:0 0 12px;}
  .modal p{color:var(--text-dim);font-size:14.5px;line-height:1.6;margin-bottom:18px;}
  .modal-choice{display:block;width:100%;text-align:left;background:var(--bg-elev-2);border:1px solid var(--line);border-radius:10px;padding:14px 15px;margin-bottom:10px;font-size:14px;color:var(--text);transition:border-color .12s ease;}
  .modal-choice:hover{border-color:var(--neon-deep);}
  .modal-choice .cl{font-weight:700;display:block;margin-bottom:2px;}
  .modal-choice .ce{color:var(--text-dim);font-size:12px;}

  .diff-chip{display:inline-block;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;padding:6px 14px;border-radius:20px;margin:0 auto 10px;text-align:center;font-weight:600;}
  .diff-wrap{text-align:center;margin-bottom:6px;}
  .diff-msg{text-align:center;color:var(--text-dim);font-size:12.5px;margin-bottom:16px;padding:0 20px;}
  .totp{position:relative;background:linear-gradient(180deg, rgba(59,240,122,.03), var(--bg-elev));border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px;box-shadow:0 8px 24px -18px rgba(0,0,0,.9);}
  .totp-header{text-align:center;padding:16px 10px 10px;font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;color:var(--neon);text-transform:uppercase;}
  .totp-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 18px 22px;}
  .totp-fighter{text-align:center;}
  .totp-fighter .flagbig{font-size:30px;display:block;margin-bottom:4px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.5));}
  .totp-fighter .nm{font-family:var(--font-display);font-size:21px;line-height:1.05;}
  .totp-fighter .rec{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);margin-top:4px;}
  .totp-vs{font-family:var(--font-display);font-size:30px;color:var(--red);padding:0 14px;text-shadow:0 0 16px var(--red-glow);}
  .totp-diag{height:3px;background:linear-gradient(90deg,var(--neon),var(--red));margin:0 18px;}
  .stat-compare-row{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:8px;margin-bottom:8px;}
  .stat-compare-row .v{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);}
  .stat-compare-row .v.right{text-align:right;}
  .stat-compare-row .lbl{text-align:center;font-size:11px;color:var(--text-dim);}

  .fight-vs-line{text-align:center;font-family:var(--font-mono);font-size:12px;color:var(--text-dim);margin-bottom:12px;}
  .fight-vs-line b{color:var(--text);}
  .hp-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .hp-name{font-family:var(--font-display);font-size:16px;width:130px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.02em;}
  .hp-track{flex:1;height:15px;background:var(--bg-elev-2);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.4);}
  .hp-fill{height:100%;transition:width .3s ease;}
  .hp-fill.me{background:linear-gradient(90deg,var(--neon-deep),var(--neon));box-shadow:0 0 12px -2px var(--neon-glow);}
  .hp-fill.opp{background:linear-gradient(90deg,var(--red-dim),var(--red));box-shadow:0 0 12px -2px var(--red-glow);}
  .round-badge{text-align:center;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.12em;color:var(--neon);text-transform:uppercase;margin:16px 0 4px;}
  .phase-title{text-align:center;font-family:var(--font-display);font-size:32px;margin-bottom:2px;letter-spacing:.02em;}
  .phase-sub{text-align:center;color:var(--text-dim);font-size:12.5px;margin-bottom:16px;padding:0 14px;line-height:1.5;}

  .meter-wrap{position:relative;height:52px;background:var(--bg-elev-2);border:1px solid var(--line);border-radius:10px;margin:0 4px 22px;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.4);}
  .meter-zone{position:absolute;top:0;bottom:0;background:rgba(59,240,122,.24);border-left:2px solid var(--neon);border-right:2px solid var(--neon);box-shadow:0 0 18px var(--neon-glow);}
  .meter-zone-core{position:absolute;top:0;bottom:0;background:rgba(59,240,122,.5);}
  .meter-marker{position:absolute;top:-4px;bottom:-4px;width:5px;background:#fff;border-radius:3px;box-shadow:0 0 12px 3px rgba(255,255,255,.8);}

  .silhouette-wrap{position:relative;width:168px;height:232px;margin:0 auto 30px;}
  .silhouette{width:100%;height:100%;display:block;opacity:.5;}
  .guard-icon{position:absolute;left:50%;transform:translateX(-50%);font-size:30px;top:8%;transition:top .14s ease;z-index:2;pointer-events:none;filter:drop-shadow(0 0 8px rgba(255,46,70,.8));}
  .boxer-fig{position:absolute;left:50%;margin-left:-20px;font-size:40px;top:8%;z-index:3;pointer-events:none;transition:top .16s ease, transform .16s ease;filter:drop-shadow(0 0 10px rgba(0,0,0,.6));}
  .zone-hit{position:absolute;left:2%;right:2%;background:rgba(18,26,21,.5);border:1.5px dashed var(--line);border-radius:10px;color:var(--text-dim);font-family:var(--font-mono);font-size:11.5px;display:flex;align-items:center;justify-content:center;transition:border-color .1s,background .1s,color .1s,box-shadow .1s;text-align:center;padding:0 6px;}
  .zone-hit.top{top:0;height:28%;} .zone-hit.mid{top:31%;height:36%;} .zone-hit.bottom{top:70%;height:30%;}
  .zone-hit.zone-open{border-color:var(--neon);border-style:solid;background:rgba(59,240,122,.2);color:var(--neon);font-weight:700;box-shadow:0 0 0 2px var(--neon-deep),0 0 20px var(--neon-glow);}
.zone-hit.zone-danger{border-color:var(--red);border-style:solid;background:rgba(255,46,70,.3);color:#fff;font-weight:700;
    box-shadow:0 0 0 3px var(--red-dim),0 0 26px var(--red-glow);animation:dangerPulse .5s ease-in-out infinite alternate;}
  @keyframes dangerPulse{from{box-shadow:0 0 0 3px var(--red-dim),0 0 18px var(--red-glow);}to{box-shadow:0 0 0 3px var(--red),0 0 34px var(--red-glow);}}
  .dodge-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 4px 14px;}
  .dodge-btn{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--bg-elev-2);border:1.5px solid var(--red-dim);
    border-radius:14px;padding:22px 8px;font-size:26px;color:var(--text);}
  .dodge-btn span{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);}
  .dodge-btn.dodge-safe{border-color:var(--neon-deep);}
  .dodge-btn.dodge-safe:hover{background:rgba(59,240,122,.12);}
  .zone-hit.zone-guard{border-color:var(--red);border-style:solid;background:rgba(255,46,70,.2);color:#ff8a97;font-weight:700;box-shadow:0 0 0 2px var(--red-dim),0 0 18px var(--red-glow);}
  .target-timer-track{position:absolute;left:0;right:0;bottom:-16px;height:6px;background:var(--bg-elev-2);border-radius:3px;overflow:hidden;}
  .target-timer-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--neon));width:100%;}

  .mash-track{height:30px;background:var(--bg-elev-2);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 4px 18px;box-shadow:inset 0 2px 6px rgba(0,0,0,.4);}
  .mash-fill{height:100%;background:linear-gradient(90deg,var(--neon-deep),var(--neon));box-shadow:0 0 14px -2px var(--neon-glow);transition:width .05s linear;}

  .dmg-popup{text-align:center;font-family:var(--font-display);font-size:28px;letter-spacing:.03em;margin-bottom:2px;animation:floatFade .9s ease forwards;min-height:32px;}
  .dmg-popup.opp{color:var(--neon);text-shadow:0 0 16px var(--neon-glow);} .dmg-popup.me{color:var(--red);text-shadow:0 0 16px var(--red-glow);}
  @keyframes floatFade{0%{opacity:0;transform:translateY(6px) scale(.8);}15%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-16px);}}

  .fight-log{min-height:36px;text-align:center;color:var(--text-dim);font-size:13.5px;font-style:italic;margin-bottom:14px;padding:0 10px;}
  .action-button{width:100%;background:linear-gradient(180deg,#4bff88,#16b055);color:#04140a;font-family:var(--font-display);font-size:25px;letter-spacing:.05em;padding:18px;border-radius:12px;box-shadow:0 0 0 1px rgba(120,255,170,.35),0 12px 30px -10px var(--neon-glow), inset 0 1px 0 rgba(255,255,255,.3);transition:transform .1s ease;}
  .action-button:active{transform:scale(.97);}
  .flash-hit{animation:flashGreen .4s ease;} .flash-miss{animation:flashRed .4s ease;}
  @keyframes flashGreen{0%{background:rgba(59,240,122,.22);}100%{background:transparent;}}
  @keyframes flashRed{0%{background:rgba(255,46,70,.22);}100%{background:transparent;}}

  .train-hero{text-align:center;padding:6px 20px 8px;}
  .train-hero .stat-nm{font-size:40px;margin:2px 0 4px;letter-spacing:.03em;text-shadow:0 0 30px var(--neon-glow);color:var(--neon);}
  .train-result{text-align:center;padding:30px 20px;min-height:60vh;display:flex;flex-direction:column;justify-content:center;}
  .train-result .tier{font-family:var(--font-display);font-size:44px;margin-bottom:8px;text-shadow:0 0 24px var(--neon-glow);}
  .train-result .gain{font-family:var(--font-mono);color:var(--neon);font-size:20px;margin-bottom:26px;}

  .memo-lives{text-align:center;font-size:24px;margin-bottom:16px;letter-spacing:4px;}
  .memo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:0 4px 18px;}
  .memo-card{aspect-ratio:1;background:linear-gradient(155deg,var(--bg-elev-2),var(--bg-elev));border:1.5px solid var(--line);border-radius:14px;color:var(--text-dim);font-size:38px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1;transition:transform .12s ease, border-color .12s ease, background .12s ease;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);}
  .memo-card:not(.flipped):not(.matched):hover{border-color:var(--neon-deep);transform:translateY(-2px);}
  .memo-card .qmark{font-family:var(--font-display);font-size:34px;color:#2c3a30;}
  .memo-card.flipped{border-color:var(--neon);background:radial-gradient(circle at 50% 40%, rgba(59,240,122,.2), var(--bg-elev-2));transform:scale(1.05);box-shadow:0 0 20px -4px var(--neon-glow);}
  .memo-card.matched{border-color:var(--neon);background:radial-gradient(circle at 50% 40%, rgba(59,240,122,.26), var(--bg-elev-2));animation:matchPop .4s ease;}
  @keyframes matchPop{0%{transform:scale(1.16);}100%{transform:scale(1);}}

  .reaction-wrap{text-align:center;padding:16px;}
  .reaction-idle{color:var(--text-dim);font-family:var(--font-mono);font-size:13px;padding:48px 0;}
  .reaction-go-btn{width:100%;background:linear-gradient(180deg,#4bff88,#16b055);color:#04140a;font-family:var(--font-display);font-size:34px;padding:40px;border-radius:14px;box-shadow:0 0 40px -6px var(--neon-glow);}
  .reaction-dots{display:flex;justify-content:center;gap:9px;margin-top:20px;}
  .reaction-dot{width:16px;height:16px;border-radius:50%;background:var(--bg-elev-2);border:1px solid var(--line);}
  .reaction-dot.hit{background:var(--neon);border-color:var(--neon);box-shadow:0 0 10px var(--neon-glow);}
  .reaction-dot.miss{background:var(--red);border-color:var(--red);}

  .click-counter{text-align:center;font-family:var(--font-display);font-size:76px;color:var(--neon);margin:8px 0;text-shadow:0 0 30px var(--neon-glow);}
  .click-btn{width:100%;background:linear-gradient(180deg,#4bff88,#16b055);color:#04140a;font-family:var(--font-display);font-size:30px;padding:30px;border-radius:14px;box-shadow:0 0 36px -8px var(--neon-glow);}
  .click-timer-track{height:6px;background:var(--bg-elev-2);border-radius:3px;overflow:hidden;margin:0 4px 18px;}
  .click-timer-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--neon));width:100%;}

  .combo-progress{text-align:center;font-family:var(--font-mono);color:var(--neon);font-size:13px;margin-top:4px;}

  .result-banner{text-align:center;padding:36px 16px;border-radius:14px;margin-bottom:16px;position:relative;overflow:hidden;}
  .result-banner.win{background:radial-gradient(ellipse at 50% 0%, rgba(59,240,122,.22), transparent 70%), var(--bg-elev);border:1px solid var(--neon-deep);box-shadow:0 0 40px -14px var(--neon-glow);}
  .result-banner.loss{background:radial-gradient(ellipse at 50% 0%, rgba(255,46,70,.2), transparent 70%), var(--bg-elev);border:1px solid var(--red-dim);}
  .result-banner.draw{background:linear-gradient(180deg, rgba(154,160,166,.14), transparent);border:1px solid var(--line);}
  .result-banner .method{font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;}
  .result-banner h2{font-size:56px;margin:0;letter-spacing:.02em;}
  .result-banner.win h2{color:var(--neon);text-shadow:0 0 30px var(--neon-glow);}
  .result-banner.loss h2{color:var(--red);text-shadow:0 0 30px var(--red-glow);}
  .result-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .result-stat{background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;padding:12px 14px;}
  .result-stat .v{font-family:var(--font-mono);font-size:17px;}
  .result-stat .v.pos{color:var(--green);} .result-stat .v.neg{color:var(--red);}

  .statpick-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .statpick-card{background:var(--bg-elev-2);border:1.5px solid var(--line);border-radius:12px;padding:18px 12px;text-align:center;color:var(--text);transition:transform .12s ease, border-color .12s ease;}
  .statpick-card:hover{border-color:var(--neon);transform:translateY(-2px);box-shadow:0 0 20px -8px var(--neon-glow);}
  .statpick-card .nm{font-family:var(--font-display);font-size:20px;}
  .statpick-card .cur{font-family:var(--font-mono);color:var(--text-dim);font-size:12px;margin:5px 0;}
  .statpick-card .gain{font-family:var(--font-mono);color:var(--neon);font-size:16px;font-weight:600;}

  .rank-row{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line);}
  .rank-row:last-child{border-bottom:none;}
  .rank-row.me{background:rgba(59,240,122,.1);border-radius:8px;padding-left:8px;box-shadow:inset 0 0 0 1px var(--neon-deep);}
  .rank-pos{font-family:var(--font-mono);font-size:13px;color:var(--text-dim);width:22px;}
  .rank-row.champ{background:linear-gradient(90deg, rgba(242,201,76,.08), transparent);border-radius:8px;padding-left:8px;}
  .rank-row.champ .rank-pos{color:var(--gold);}
  .rank-flag{font-size:20px;}
  .rank-nm{flex:1;font-size:14.5px;}
  .rank-row.me .rank-nm{font-weight:700;}
  .rank-pw{font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);}
  .champ-tag{font-family:var(--font-mono);font-size:10px;color:var(--neon);border:1px solid var(--neon-deep);border-radius:10px;padding:2px 7px;background:rgba(59,240,122,.08);}
  .tier-track{display:flex;gap:6px;margin-bottom:16px;}
  .tier-step{flex:1;text-align:center;padding:9px 4px;border-radius:8px;font-family:var(--font-mono);font-size:10.5px;background:var(--bg-elev-2);border:1px solid var(--line);color:var(--text-dim);}
  .tier-step.active{border-color:var(--neon);color:var(--neon);background:rgba(59,240,122,.1);box-shadow:0 0 14px -4px var(--neon-glow);}
  .tier-step.done{color:var(--gold);border-color:var(--gold-dim);}

  .shop-cat-title{font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--neon);margin:20px 4px 12px;}
  .shop-item{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg, rgba(59,240,122,.02), var(--bg-elev));border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:10px;}
  .shop-item .info{flex:1;}
  .shop-item .nm{font-family:var(--font-display);font-size:18px;}
  .shop-item .ds{color:var(--text-dim);font-size:12px;margin-top:3px;line-height:1.45;}
  .shop-item .cost{font-family:var(--font-mono);color:var(--gold);font-size:12.5px;margin-top:7px;}
  .shop-buy-btn{background:linear-gradient(180deg,#4bff88,#16b055);color:#04140a;font-family:var(--font-display);font-size:15px;padding:10px 16px;border-radius:8px;flex-shrink:0;box-shadow:0 6px 18px -8px var(--neon-glow);}
  .shop-buy-btn:disabled{background:var(--steel);opacity:.4;cursor:not-allowed;box-shadow:none;color:#0c110e;}
  .shop-buy-btn.owned{background:var(--bg-elev-2);color:var(--neon);border:1px solid var(--neon-deep);box-shadow:none;}

  .belt-wrap{text-align:center;padding:60px 20px 24px;min-height:100vh;display:flex;flex-direction:column;justify-content:center;}
  .belt-svg{width:240px;height:auto;margin:0 auto 24px;filter:drop-shadow(0 12px 40px rgba(242,201,76,.45));animation:beltIn .7s cubic-bezier(.2,.8,.2,1);}
  @keyframes beltIn{from{transform:scale(.7) rotate(-8deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
  .belt-wrap .eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.24em;color:var(--gold);text-transform:uppercase;}
  .belt-wrap h1{font-size:52px;margin:10px 0 6px;text-shadow:0 0 30px rgba(242,201,76,.3);}
  .belt-wrap p{color:var(--text-dim);font-size:14.5px;max-width:400px;margin:0 auto 28px;line-height:1.6;}

  /* --- Minijuego A: striking target (puntos débiles) --- */
  .strike-stage{position:relative;padding:6px 0 10px;cursor:crosshair;}
  .st-dot{position:absolute;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle at 40% 35%, rgba(255,90,110,.95), rgba(200,20,45,.85) 65%, rgba(140,10,30,.7));
    border:2px solid #ff9aa8;color:#fff;font-family:var(--font-mono);font-size:9.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;text-align:center;line-height:1;
    box-shadow:0 0 0 3px rgba(255,46,70,.25), 0 0 26px var(--red-glow);z-index:5;padding:0;}
  .st-dot.st-pop{animation:stPop .22s cubic-bezier(.2,.9,.3,1.4);}
  @keyframes stPop{0%{transform:translate(-50%,-50%) scale(.3);opacity:.2;}100%{transform:translate(-50%,-50%) scale(1);opacity:1;}}
  .mini-timer-track{height:7px;background:var(--bg-elev-2);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin:14px 4px 16px;}
  .mini-timer-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--neon));width:100%;}

  /* --- Minijuego C: memotest de guardia --- */
  .md-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 4px 14px;}
  .md-slot{aspect-ratio:1.25;font-size:11px;}
  .md-slot{aspect-ratio:1.5;background:linear-gradient(155deg,var(--bg-elev-2),var(--bg-elev));border:1.5px solid var(--line);
    border-radius:14px;color:var(--text-dim);font-family:var(--font-mono);font-size:12px;display:flex;align-items:center;justify-content:center;
    transition:transform .1s ease, border-color .1s ease, background .1s ease, box-shadow .1s ease;}
  .md-slot:hover{border-color:var(--neon-deep);}
  .md-slot.md-lit{border-color:var(--neon);color:var(--neon);background:radial-gradient(circle at 50% 45%, rgba(59,240,122,.35), var(--bg-elev-2));
    box-shadow:0 0 0 2px var(--neon-deep), 0 0 26px var(--neon-glow);transform:scale(1.04);}

  /* --- Minijuego B: nodos de sumisión --- */
  .sn-field{position:relative;width:230px;height:250px;margin:0 auto 10px;}
  .sn-field .silhouette{width:100%;height:100%;opacity:.35;}
  .sn-node{position:absolute;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;
    background:linear-gradient(160deg,var(--bg-elev-2),var(--bg-elev));border:2px solid var(--neon-deep);
    color:var(--neon);font-family:var(--font-display);font-size:19px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 16px -4px var(--neon-glow);transition:transform .12s ease, background .12s ease, border-color .12s ease;z-index:4;padding:0;}
  .sn-node:hover{transform:translate(-50%,-50%) scale(1.1);}
  .sn-node.sn-done{background:radial-gradient(circle at 45% 40%, rgba(59,240,122,.45), var(--neon-deep));color:#04140a;border-color:var(--neon);
    box-shadow:0 0 24px var(--neon-glow);}


  /* ---- modales del HUB ---- */
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .modal-head h3{margin:0;}
  .modal-x{background:var(--bg-elev-2);border:1px solid var(--line);color:var(--text-dim);width:34px;height:34px;border-radius:50%;font-size:15px;flex-shrink:0;}
  .modal-x:hover{color:var(--text);border-color:var(--neon-deep);}

  /* ---- creación de personaje ---- */
  .create-wrap{padding:26px 20px 40px;max-width:560px;margin:0 auto;}
  .create-title{font-family:var(--font-mono);font-size:12px;letter-spacing:.28em;color:var(--neon);text-align:center;margin-bottom:18px;}
  .create-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
  .create-field .label{margin-bottom:6px;}
  .name-input{width:100%;background:var(--bg-elev);border:1px solid var(--line);color:var(--text);padding:16px;border-radius:12px;
    font-size:19px;text-align:center;font-family:var(--font-body);}
  .name-input:focus{border-color:var(--neon);box-shadow:0 0 24px -8px var(--neon-glow);}
  .name-hint{text-align:center;color:var(--text-dim);font-size:12px;margin:8px 0 18px;}
  .arch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
  .arch-card{padding:16px 8px;}
  .arch-nm{font-size:21px;}
  .arch-card{background:linear-gradient(170deg,var(--bg-elev-2),var(--bg-elev));border:1.5px solid var(--line);border-radius:14px;
    padding:20px 12px;text-align:center;color:var(--text);transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease;}
  .arch-card:hover{transform:translateY(-2px);border-color:var(--steel);}
  .arch-card.selected{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon-deep),0 0 30px -8px var(--neon-glow);
    background:radial-gradient(circle at 50% 22%, rgba(59,240,122,.16), var(--bg-elev-2));}
  .arch-ico{font-size:34px;margin-bottom:6px;}
  .arch-nm{font-family:var(--font-display);font-size:24px;letter-spacing:.04em;}
  .arch-desc{color:var(--text-dim);font-size:11.5px;margin-top:5px;line-height:1.45;}
  .arch-bonus{margin-top:9px;font-family:var(--font-mono);font-size:11px;color:var(--neon);}

  /* ---- barra de precisión (striking A) ---- */
  .pb-zone{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;pointer-events:none;}
  .pb-hit{background:rgba(59,240,122,.2);border-left:2px solid var(--neon-deep);border-right:2px solid var(--neon-deep);color:var(--neon);}
  .pb-ko{background:rgba(255,46,70,.34);border-left:2px solid var(--red);border-right:2px solid var(--red);color:#fff;font-weight:700;
    box-shadow:0 0 20px var(--red-glow);}

  /* ---- control de cadera (grappling B) ---- */
  .hc-track{position:relative;height:56px;background:var(--bg-elev-2);border:1px solid var(--line);border-radius:10px;
    margin:0 4px 12px;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.4);}
  .hc-safe{position:absolute;top:0;bottom:0;background:rgba(59,240,122,.2);border-left:2px solid var(--neon);border-right:2px solid var(--neon);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px;color:var(--neon);letter-spacing:.08em;}
  .hc-end{position:absolute;top:0;bottom:0;width:22%;display:flex;align-items:center;font-family:var(--font-mono);font-size:9px;color:#ff8a97;
    background:rgba(255,46,70,.12);letter-spacing:.06em;}
  .hc-end.left{left:0;justify-content:flex-start;padding-left:6px;}
  .hc-end.right{right:0;justify-content:flex-end;padding-right:6px;}
  .hc-ball{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;
    background:radial-gradient(circle at 38% 32%, #fff, #9fb3a6);box-shadow:0 0 16px rgba(255,255,255,.7);z-index:3;}
  .hc-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .hc-btns .action-button{font-size:19px;padding:16px;}

  /* ---- defensa de derribo (flechas) ---- */
  .td-seq{display:flex;justify-content:center;gap:10px;margin:0 0 16px;}
  .td-step{width:46px;height:46px;border-radius:12px;background:var(--bg-elev-2);border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--text-dim);}
  .td-step.td-done{border-color:var(--neon);color:var(--neon);background:rgba(59,240,122,.16);box-shadow:0 0 16px -4px var(--neon-glow);}
  .td-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
  .td-btn{aspect-ratio:1;background:linear-gradient(160deg,var(--bg-elev-2),var(--bg-elev));border:1.5px solid var(--line);
    border-radius:14px;color:var(--text);font-size:28px;transition:transform .1s ease,border-color .1s ease;}
  .td-btn:hover{border-color:var(--neon-deep);}
  .td-btn:active{transform:scale(.94);border-color:var(--neon);}


  /* ---- banderas por API ---- */
  .flag-img{width:24px;height:16px;border-radius:3px;vertical-align:-3px;box-shadow:0 1px 3px rgba(0,0,0,.6);display:inline-block;}
  .flag-img.flag-lg{width:40px;height:27px;border-radius:4px;vertical-align:-7px;}
  .flag-fallback{font-family:var(--font-mono);font-size:11px;background:var(--bg-elev-2);border:1px solid var(--line);
    padding:2px 5px;border-radius:4px;color:var(--text-dim);}
  /* ---- dropdown de país ---- */
  .cdd{position:relative;}
  .cdd-btn{width:100%;display:flex;align-items:center;gap:9px;background:var(--bg-elev-2);border:1px solid var(--line);
    color:var(--text);padding:11px 13px;border-radius:8px;font-size:15px;text-align:left;}
  .cdd-btn:hover{border-color:var(--neon-deep);}
  .cdd-caret{margin-left:auto;color:var(--neon);}
  .cdd-list{position:absolute;z-index:30;top:calc(100% + 6px);left:0;right:0;max-height:260px;overflow-y:auto;
    background:var(--bg-elev);border:1px solid var(--neon-deep);border-radius:10px;box-shadow:0 18px 40px -12px rgba(0,0,0,.9);}
  .cdd-opt{width:100%;display:flex;align-items:center;gap:9px;background:none;border:none;border-bottom:1px solid var(--line);
    color:var(--text);padding:10px 12px;font-size:14px;text-align:left;}
  .cdd-opt:last-child{border-bottom:none;}
  .cdd-opt:hover{background:rgba(59,240,122,.1);}
  .cdd-opt.sel{background:rgba(59,240,122,.16);color:var(--neon);}
  /* ---- contragolpe visible ---- */
  .counter-hit{position:relative;text-align:center;height:74px;margin:-4px 0 2px;pointer-events:none;}
  .counter-glove{font-size:34px;animation:cgIn .55s cubic-bezier(.2,.8,.25,1.3) forwards;display:inline-block;}
  @keyframes cgIn{0%{transform:scale(.25) translateY(34px) rotate(-25deg);opacity:0;}
                  55%{transform:scale(2.5) translateY(-4px) rotate(6deg);opacity:1;}
                  100%{transform:scale(1.7) translateY(0) rotate(0);opacity:.85;}}
  .counter-txt{font-family:var(--font-display);font-size:22px;color:var(--red);letter-spacing:.06em;
    text-shadow:0 0 18px var(--red-glow);animation:cgTxt .6s ease forwards;}
  @keyframes cgTxt{0%{opacity:0;transform:scale(.7);}45%{opacity:1;transform:scale(1.15);}100%{opacity:1;transform:scale(1);}}


  /* ---- primer plano del remate ---- */
  .closeup{position:relative;width:230px;height:200px;margin:6px auto 14px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 45%, rgba(255,46,70,.16), transparent 68%);border-radius:20px;cursor:crosshair;}
  .closeup-fig{font-size:120px;line-height:1;animation:wobble 1.1s ease-in-out infinite;filter:drop-shadow(0 8px 26px rgba(0,0,0,.7));}
  @keyframes wobble{0%,100%{transform:translateX(-9px) rotate(-6deg);}50%{transform:translateX(9px) rotate(6deg);}}
  .closeup-ring{position:absolute;inset:12px;border:2px dashed var(--red-dim);border-radius:50%;opacity:.5;animation:ringPulse 1.4s ease-in-out infinite;}
  @keyframes ringPulse{0%,100%{transform:scale(.95);opacity:.35;}50%{transform:scale(1.04);opacity:.7;}}

  const country = pool.length ? choice(pool) : choice(COUNTRIES);

/* ============================================================
   FÍSICO — la altura y el peso cambian cómo jugás de verdad:
   · Más alto  -> ALCANCE: ventanas y zonas más grandes en los juegos de golpear.
   · Más bajo y liviano -> VELOCIDAD: más tiempo en reacción y más empuje en los forcejeos.
   ============================================================ */
function physOf(p){
  const wc = WEIGHT_CLASSES.find(w=>w.id===p.weightClass);
  if(!wc) return {reach:0, speed:0};
  const hMid = (wc.hMin+wc.hMax)/2, wMid = (wc.wMin+wc.wMax)/2;
  const hDev = (p.height - hMid) / ((wc.hMax-wc.hMin)/2);            // -1 .. +1
  const wDev = ((p.weightKg||wMid) - wMid) / ((wc.wMax-wc.wMin)/2);  // -1 .. +1
  return {
    reach: Math.round(hDev*6),                       // alto = más rango
    speed: Math.round((-hDev*3 - wDev*4)),           // bajo y liviano = rápido
    power: Math.round(wDev*5 + hDev*1),              // pesado = pega más fuerte (liviano pega poco)
  };
}
function reachMult(){ const r=physOf(state.player).reach; return 1 + r*0.035; }   // hasta ±21%
function speedMult(){ const v=physOf(state.player).speed; return 1 + v*0.040; }   // hasta ±28%
function powerMult(){ const w=physOf(state.player).power; return 1 + w*0.050; }   // hasta ±30% de daño
function powerScore(f){ return Math.round(f.striking*0.3 + f.wrestling*0.3 + f.sumision*0.25 + f.cardio*0.1 + f.chin*0.05); }
function genOpponentStats(basePower){
  // En MMA las diferencias son chicas: ±4 de ruido y una especialidad marcada (+5 / -4).
  const s={};
  STAT_KEYS.forEach(k=>{ s[k]=clamp(Math.round(basePower+rand(-4,4)),15,99); });
  const spec = choice(['striking','wrestling','sumision']);
  const weak = choice(['striking','wrestling','sumision'].filter(k=>k!==spec));
  s[spec] = clamp(s[spec]+5, 15, 99);
  s[weak] = clamp(s[weak]-4, 15, 99);
  return s;
}
function orgBasePower(orgId){ const t=ORGS[orgId].tier; if(t==='global') return rand(76,90); if(t==='continental') return rand(56,68); return rand(36,48); }
function tierBaseMoney(tier){ if(tier==='global') return rand(26000,45000); if(tier==='continental') return rand(5000,8500); return rand(500,1100); }
function effStriking(){ const p=state.player; return p.striking + (p.consumables.vendas>0?6:0); }
function effCardio(){ const p=state.player; return p.cardio + (p.staff.nutri?5:0) + (p.consumables.energetica>0?10:0); }

function ufcSeedFor(wc){
  const list = (UFC_ROSTER[wc]||[]).map(r=>({name:r[0], cc:r[1], flag:'', power:r[2], pot:r[3], age:r[4], isPlayer:false}));
  while(list.length<15){ const f=genFighter(choice(Object.keys(CONTINENTS))); list.push({name:f.name, cc:f.cc, flag:f.flag, power:randi(78,84), pot:randi(84,92), age:randi(24,30), isPlayer:false}); }
  list.sort((a,b)=>b.power-a.power);
  return list;
}
/* El roster evoluciona: los pibes crecen, los veteranos se retiran. */
function advanceUfcRoster(wc){
  const key = 'ufc_'+wc;
  const rk = rankingsCache[key];
  if(!rk) return;
  const all = [rk.champion, ...rk.contenders];
  const news = [];
  all.forEach(f=>{
    if(f.isPlayer) return;
    f.age = (f.age||30) + 0.5;
    if(f.pot && f.power < f.pot && f.age < 31 && Math.random()<0.5) f.power = Math.min(f.pot, f.power+1);
    if(f.age >= 36 && Math.random()<0.10) f.power = Math.max(70, f.power-1);      // el declive
    if(f.age >= 38 && Math.random()<0.30) f.retired = true;                        // se retira
  });
  let ret = rk.contenders.filter(f=>f.retired);
  rk.contenders = rk.contenders.filter(f=>!f.retired);
  if(rk.champion.retired && !rk.champion.isPlayer){
    news.push(rk.champion.name+' anunció su retiro y dejó el cinturón vacante.');
    const next = rk.contenders.shift();
    if(next){ rk.champion = next; news.push(next.name+' es el nuevo campeón.'); }
  }
  ret.forEach(f=>news.push(f.name+' se retiró.'));
  while(rk.contenders.length<14){
    const f = genFighter(choice(Object.keys(CONTINENTS)));
    const nm = choice(UFC_PROSPECTS);
    rk.contenders.push({name:nm, cc:f.cc, flag:f.flag, power:randi(76,82), pot:randi(88,96), age:randi(22,26), isPlayer:false});
    news.push(nm+' debuta en la organización.');
  }
  rk.contenders.sort((a,b)=>b.power-a.power);
  state.ufcNews = news.slice(0,3);
}

function rankKey(orgId, wc){ return orgId+'_'+wc; }
function getRankings(orgId, wc, cont){
  const key = rankKey(orgId, wc);
  if(!rankingsCache[key]){
    if(orgId==='ufc'){
      const seed = ufcSeedFor(wc);
      rankingsCache[key] = {champion: seed[0], contenders: seed.slice(1,15)};
      return rankingsCache[key];
    }
    const base = orgBasePower(orgId);
    const champFighter = genFighter(cont||choice(Object.keys(CONTINENTS)));
    const champ = {name:champFighter.name, flag:champFighter.flag, cc:champFighter.cc, power:Math.round(base+rand(7,11)), isPlayer:false};
    const contenders = [];
    for(let i=0;i<14;i++){
      const f = genFighter(choice(Object.keys(CONTINENTS)));
      contenders.push({name:f.name, flag:f.flag, cc:f.cc, power:Math.round(base+rand(-3,5)-i*0.7), isPlayer:false});
    }
    contenders.sort((a,b)=>b.power-a.power);
    rankingsCache[key] = {champion:champ, contenders};
  }
  return rankingsCache[key];
}
function playerRankIndex(rk){ return rk.contenders.findIndex(c=>c.isPlayer); }

// Serie de contendientes: si venís invicto y con nombre en el circuito regional,
// te llega la invitación. Ganarla te catapulta (reputación + contrato).
function dwcsAvailable(){
  const p = state.player;
  const total = p.record.w + p.record.l + p.record.d;
  const regionalId = p.orgChain[0];
  return !p.dwcsDone
      && ORGS[p.orgId].tier==='regional'
      && total >= 6                                   // mínimo 6 peleas
      && p.record.w >= 5 && p.record.l <= 1           // buen récord
      && p.isChampionOf.includes(regionalId)          // ya campeón de la liga chica
      && p.rep >= 40;
}
function acceptDwcs(){
  const p = state.player;
  p.dwcsPending = true;
  state.modal = null;
  pendingOpponent = pickOpponent();
  pendingOpponent.isDwcs = true;
  pendingOpponent.name = 'Contendiente ' + pendingOpponent.name.split(' ')[1];
  startFight();
}
function pickOpponent(){
  const p = state.player;
  const rk = getRankings(p.orgId, p.weightClass, p.continent);
  const idx = playerRankIndex(rk);
  if(idx === -1){
    let base = orgBasePower(p.orgId);
    const n = fightsSoFar();
    if(n < 4){                                  // debut y primeros pasos: rivales accesibles
      const handicap = [14, 9, 5, 2][n];
      base = clamp(Math.min(base, powerScore(p) - handicap), 18, 99);
    }
    const stats = genOpponentStats(base + rand(-6,6));
    const f = genFighter(choice(Object.keys(CONTINENTS)));
    return {name:f.name, flag:f.flag, cc:f.cc, ...stats, isTitle:false, record:`${randi(3,9)}-${randi(0,4)}-0`};
  } else if(idx === 0){
    const stats = genOpponentStats(rk.champion.power);
    return {name:rk.champion.name, flag:rk.champion.flag, cc:rk.champion.cc, ...stats, isTitle:true, record:`${randi(12,20)}-${randi(0,2)}-0`};
  } else {
    const target = rk.contenders[idx-1];
    const stats = genOpponentStats(target.power);
    return {name:target.name, flag:target.flag, cc:target.cc, ...stats, isTitle:false, record:`${randi(6,14)}-${randi(0,5)}-0`};
  }
}
function applyRankingResult(won, opponent, wasFinish){
  const p = state.player;
  const rk = getRankings(p.orgId, p.weightClass, p.continent);
  const idx = playerRankIndex(rk);
  if(opponent.isTitle){
    if(won){
      rk.contenders = rk.contenders.filter(c=>!c.isPlayer);
      rk.contenders.unshift({name:rk.champion.name, flag:rk.champion.flag, cc:rk.champion.cc, power:rk.champion.power, isPlayer:false});
      rk.champion = {name:p.name, flag:p.flag, cc:p.cc, power:powerScore(p), isPlayer:true};
      p.isChampionOf.push(p.orgId);
    }
    return;
  }
  const me = {name:p.name, flag:p.flag, cc:p.cc, power:powerScore(p), isPlayer:true};
  if(won){
    // Regla UFC: SIEMPRE quedás por encima del que venciste, y si la diferencia
    // era chica o lo finalizaste, podés saltar todavía más arriba.
    const bi = rk.contenders.findIndex(c=>c.name===opponent.name);
    let target = bi>=0 ? bi : Math.max(0, rk.contenders.length-1);
    if(bi>=0){
      const upset = Math.max(0, (rk.contenders[bi].power||0) - powerScore(p));
      // Quedás en su puesto; solo un batacazo o una finalización te dan 1-2 lugares extra.
      let jump = 0;
      if(upset>=5) jump += 1;
      if(wasFinish) jump += 1;
      jump = Math.min(jump, 2);
      // Al #1 solo se llega venciendo al #1 o al #2: arriba de todo cuesta más moverse.
      target = (bi>=2) ? Math.max(1, bi - jump) : 0;
    }
    if(idx>=0) rk.contenders.splice(idx,1);
    if(idx>=0 && idx < target) target = Math.max(0, target-1);
    rk.contenders.splice(target, 0, me);
    // el vencido cae por debajo tuyo
    const nbi = rk.contenders.findIndex(c=>c.name===opponent.name);
    if(nbi>=0 && nbi <= target){
      const [beaten] = rk.contenders.splice(nbi,1);
      rk.contenders.splice(Math.min(rk.contenders.length, target+1), 0, beaten);
    }
    state.rankNews = `Subiste al puesto #${rk.contenders.findIndex(c=>c.isPlayer)+1} de la división.`;
  } else {
    if(idx>=0){
      rk.contenders.splice(idx,1);
      const drop = Math.min(rk.contenders.length, idx + 1 + randi(1,2));
      rk.contenders.splice(drop, 0, me);
      state.rankNews = `Caés al puesto #${rk.contenders.findIndex(c=>c.isPlayer)+1}.`;
    } else state.rankNews = null;
  }
  rk.contenders = rk.contenders.slice(0,15);
}

function physHintFor(d){
  if(!d.weightClass) return '';
  const ph = physOf({weightClass:d.weightClass, height:d.height, weightKg:d.weightKg});

  parts.push(ph.reach>0? `Alcance +${ph.reach} (llegás de más lejos)` : (ph.reach<0? `Alcance ${ph.reach} (te falta rango)` : 'Alcance neutro'));
  parts.push(ph.speed>0? `Velocidad +${ph.speed} (reaccionás más rápido)` : (ph.speed<0? `Velocidad ${ph.speed} (sos más lento)` : 'Velocidad neutra'));
  parts.push(ph.power>0? `Potencia +${ph.power} (pegás más fuerte)` : (ph.power<0? `Potencia ${ph.power} (te falta pegada)` : 'Potencia neutra'));
  return parts.join(' · ');
}

function ownedOrCharge(p, item){
  if(item.cat==='staff') return p.staff[item.id];
  if(item.cat==='lujo') return p.lujo[item.id];
  return p.consumables[item.id]>0 ? p.consumables[item.id] : 0;
}
function buyItem(id){
  const item = SHOP.find(s=>s.id===id);
  const p = state.player;
  if(!item || p.money<item.cost) return;
  if(item.cat==='staff'){ if(p.staff[id]) return; p.money-=item.cost; p.staff[id]=true; }
  else if(item.cat==='lujo'){ if(p.lujo[id]) return; p.money-=item.cost; p.lujo[id]=true; p.rep=clamp(p.rep+(id==='auto'?6:8),0,100); }
  else { p.money-=item.cost; p.consumables[id]=(p.consumables[id]||0)+item.duration; }
  render();
}
function shopItemHtml(item){
  const p = state.player;
  const owned = ownedOrCharge(p, item);
  let btnLabel, disabled=false, ownedClass='';
  if(item.cat==='staff'||item.cat==='lujo'){
    if(owned){ btnLabel='COMPRADO'; disabled=true; ownedClass='owned'; }
    else { btnLabel = p.money<item.cost ? 'SIN PLATA' : 'COMPRAR'; disabled = p.money<item.cost; }
  } else {
    btnLabel = p.money<item.cost ? 'SIN PLATA' : (owned? `COMPRAR (tenés ${owned})` : 'COMPRAR');
    disabled = p.money<item.cost;
  }
  return `<div class="shop-item"><div class="info"><div class="nm">${item.name}</div><div class="ds">${item.desc}</div>
    <div class="cost">${fmtMoney(item.cost)}${item.duration?` · dura ${item.duration} campamento(s)`:''}</div></div>
    <button class="shop-buy-btn ${ownedClass}" ${disabled?'disabled':''} onclick="buyItem('${item.id}')">${btnLabel}</button></div>`;
}

// Soft cap by tier: you can't get elite stats in the regional circuit.
// regional -> 62, continental -> 80, global -> 99
// Techo de puntos repartidos: si querés subir todo, algo se te cae.
function statBudget(){
  const t = ORGS[state.player.orgId].tier;
  return t==='global' ? 252 : (t==='continental' ? 204 : 150);
}
function statSum(){ const p=state.player; return p.striking + p.wrestling + p.sumision; }
function statSoftCap(){
  const tier = ORGS[state.player.orgId].tier;
  if(tier==='global') return 99;
  if(tier==='continental') return 80;
  return 62;
}
function finalizeTrainingGain(stat, rawGain){
  const p = state.player;
  const cap = statSoftCap();
  if(p[stat] >= cap) return 0; // already at the ceiling for this level
  let gain = rawGain;
  if(p.staff.prep) gain = Math.round(gain*1.25);
  if(p.consumables.suple>0) gain += 1;
  // steep diminishing returns as the stat climbs
  const factor = clamp(1.05 - Math.pow(p[stat]/100, 1.8), 0.12, 1.0);
  gain = Math.max(2, Math.round(gain*factor));
  p[stat] = clamp(p[stat]+gain, 10, cap);
  // si ya estirás el presupuesto, descuidás otra área
  if(['striking','wrestling','sumision'].includes(stat) && statSum() > statBudget()){
    const others = ['striking','wrestling','sumision'].filter(k=>k!==stat && p[k]>15);
    if(others.length){
      const k = others.reduce((a,b)=> p[a]>=p[b]?a:b);
      p[k] = clamp(p[k]-1, 10, 99);
      state.trainTradeoff = 'Por enfocarte tanto, perdiste 1 de '+STAT_LABELS[k]+'.';
    }
  } else state.trainTradeoff = null;
  return gain;
}

/* =========================================================
   TRAINING DRILLS
   ========================================================= */
function launchTrainingGame(stat){
  const p = state.player;
  if(p.trainingTokens<=0 || p[stat]>=99) return;
  p.trainingTokens -= 1;
  state.modal = null;
  if(stat==='striking'){
    const pairs = shuffle(MEMO_MOVES).slice(0,6);
    const deck = shuffle([...pairs, ...pairs]).map((m,i)=>({id:i, move:m, revealed:false, matched:false}));
    trainCtx = {kind:'memo', stat, deck, firstPick:null, busy:false, lives:5, pairsFound:0, totalPairs:pairs.length, phase:'ready', result:null};
  } else if(stat==='wrestling'){
    trainCtx = {kind:'mash', stat, meter:0, phase:'ready', result:null};
  } else if(stat==='sumision'){
    const n=5, pts=[];
    for(let i=0;i<n;i++){
      let tries=0,pos;
      do{ pos={x:rand(14,86),y:rand(12,88)}; tries++; }
      while(tries<50 && pts.some(q=>Math.hypot(q.x-pos.x,q.y-pos.y)<24));
      pts.push(pos);
    }
    trainCtx = {kind:'chain', stat, nodes:pts.map((o,i)=>({x:o.x,y:o.y,n:i+1})), next:1, limitMs:3200, phase:'ready', result:null};
  } else if(stat==='cardio'){
    trainCtx = {kind:'click', stat, count:0, phase:'ready', result:null};
  } else {
    trainCtx = {kind:'reaction', stat, round:0, hits:0, total:5, results:[], phase:'ready', result:null};
  }
  state.screen='training';
  render();
}
function finishTrainingResult(tier){
  cancelAnimationFrame(rafId);
  const rawGain = tier==='perfecto'?7:(tier==='bien'?4:2);
  const gain = finalizeTrainingGain(trainCtx.stat, rawGain);
  trainCtx.result = {tier:tier.toUpperCase(), gain};
  trainCtx.phase = 'resolved';
  render();
}

function startTrainingDrill(){
  if(trainCtx.kind==='memo'){
    trainCtx.phase='playing'; render();
  } else if(trainCtx.kind==='mash'){
    trainCtx.phase='mashing'; trainCtx._start=performance.now(); render();
    startTrainMashAnim();
  } else if(trainCtx.kind==='chain'){
    trainCtx.phase='chaining'; trainCtx._start=performance.now(); render();
    startTrainChainAnim();
  } else if(trainCtx.kind==='click'){
    trainCtx.phase='running'; trainCtx._start=performance.now(); render();
    startTrainClickAnim();
  } else if(trainCtx.kind==='reaction'){
    scheduleReactionRound();
  }
}

/* --- memo (pairs matching) --- */
function memoCardHtml(card){
  const shown = card.revealed || card.matched;
  return `<button id="memoCard${card.id}" class="memo-card ${card.matched?'matched':''} ${shown?'flipped':''}" onclick="clickMemoCard(${card.id})">${shown?card.move:'<span class="qmark">?</span>'}</button>`;
}
function updateMemoCardDOM(id){
  const card = trainCtx.deck.find(c=>c.id===id);
  const el = document.getElementById('memoCard'+id);
  if(!el || !card) return;
  const shown = card.revealed || card.matched;
  el.innerHTML = shown ? card.move : '<span class="qmark">?</span>';
  el.classList.toggle('flipped', shown);
  el.classList.toggle('matched', card.matched);
}
function updateMemoLivesDOM(){
  const el = document.getElementById('memoLives');
  if(el) el.textContent = '❤️'.repeat(Math.max(0,trainCtx.lives)) + '🖤'.repeat(Math.max(0,5-trainCtx.lives));
}
function clickMemoCard(id){
  if(!trainCtx || trainCtx.kind!=='memo' || trainCtx.phase!=='playing' || trainCtx.busy) return;
  const card = trainCtx.deck.find(c=>c.id===id);
  if(!card || card.revealed || card.matched) return;
  card.revealed = true;
  updateMemoCardDOM(id);
  if(trainCtx.firstPick===null){
    trainCtx.firstPick = id;
    return;
  }
  trainCtx.busy = true;
  const first = trainCtx.deck.find(c=>c.id===trainCtx.firstPick);
  if(first.move===card.move){
    first.matched=true; card.matched=true; trainCtx.pairsFound++;
    updateMemoCardDOM(first.id); updateMemoCardDOM(card.id);
    trainCtx.firstPick=null; trainCtx.busy=false;
    if(trainCtx.pairsFound>=trainCtx.totalPairs){
      const tier = trainCtx.lives>=4?'perfecto':(trainCtx.lives>=2?'bien':'flojo');
      finishTrainingResult(tier);
    }
  } else {
    trainCtx.lives--;
    updateMemoLivesDOM();
    setTimeout(()=>{
      if(!trainCtx || trainCtx.kind!=='memo') return;
      first.revealed=false; card.revealed=false;
      updateMemoCardDOM(first.id); updateMemoCardDOM(card.id);
      trainCtx.firstPick=null; trainCtx.busy=false;
      if(trainCtx.lives<=0){
        const tier = trainCtx.pairsFound>=4?'bien':'flojo';
        finishTrainingResult(tier);
      }
    }, 650);
  }
}

/* --- mash (training) --- */
function startTrainMashAnim(){
  cancelAnimationFrame(rafId);
  let lastT = performance.now();
  function tick(t){
    if(!trainCtx || trainCtx.kind!=='mash' || trainCtx.phase!=='mashing') return;
    const dt=t-lastT; lastT=t;
    const el=t-trainCtx._start;
    trainCtx.meter = clamp(trainCtx.meter-8*(dt/1000), 0, 140);
    const fillEl = document.getElementById('trainMashFill');
    if(fillEl) fillEl.style.width = Math.min(100,trainCtx.meter)+'%';
    if(el>=2400){ const tier=trainCtx.meter>=95?'perfecto':(trainCtx.meter>=65?'bien':'flojo'); finishTrainingResult(tier); return; }
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
}
function mashClickTrain(){
  if(!trainCtx || trainCtx.kind!=='mash' || trainCtx.phase!=='mashing') return;

/* --- flash (training) --- */
function startTrainChainAnim(){
  cancelAnimationFrame(rafId);
  (function tick(t){
    if(!trainCtx || trainCtx.kind!=='chain' || trainCtx.phase!=='chaining') return;
    const el=t-trainCtx._start;
    const bar=document.getElementById('tcTimer');
    if(bar) bar.style.width=Math.max(0,(1-el/trainCtx.limitMs)*100)+'%';
    if(el>=trainCtx.limitMs){ finishTrainingResult(trainCtx.next>3?'bien':'flojo'); return; }
    rafId=requestAnimationFrame(tick);
  })(performance.now());
}
function clickTrainChain(n){
  if(!trainCtx || trainCtx.kind!=='chain' || trainCtx.phase!=='chaining') return;
  if(n!==trainCtx.next){ cancelAnimationFrame(rafId); finishTrainingResult('flojo'); return; }
  const el=document.getElementById('tcNode'+n); if(el) el.classList.add('sn-done');
  trainCtx.next++;
  if(trainCtx.next>trainCtx.nodes.length){
    cancelAnimationFrame(rafId);
    const took=performance.now()-trainCtx._start;
    finishTrainingResult(took < trainCtx.limitMs*0.55 ? 'perfecto' : 'bien');
  }
}
function startTrainFlashAnim(){
  cancelAnimationFrame(rafId);
  let hidTriggered = false;
  function tick(t){
    if(!trainCtx || trainCtx.kind!=='flash' || trainCtx.phase!=='flashwait') return;
    const el = t-trainCtx._start;
    if(!hidTriggered && el>=850){
      hidTriggered=true; trainCtx.hidden=true;
      const btn = document.getElementById('tzf'+trainCtx.limb);
      if(btn) btn.classList.remove('zone-open');
    }
    const timerEl = document.getElementById('trainSubTimer');
    if(timerEl) timerEl.style.width = Math.max(0,(1-el/2400)*100)+'%';
    if(el>=2400){ finishTrainingResult('flojo'); return; }
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
}
function clickFlashTrain(idx){
  if(!trainCtx || trainCtx.kind!=='flash' || trainCtx.phase!=='flashwait') return;
  cancelAnimationFrame(rafId);
  const success = idx===trainCtx.limb;
  const tier = !success ? 'flojo' : (trainCtx.hidden ? 'perfecto' : 'bien');
  finishTrainingResult(tier);
}

/* --- click counter (training) --- */
function startTrainClickAnim(){
  cancelAnimationFrame(rafId);
  function tick(t){
    if(!trainCtx || trainCtx.kind!=='click' || trainCtx.phase!=='running') return;
    const el = t-trainCtx._start;
    const timerEl = document.getElementById('clickTimer');
    if(timerEl) timerEl.style.width = Math.max(0,(1-el/3500)*100)+'%';
    if(el>=3500){ const tier=trainCtx.count>=21?'perfecto':(trainCtx.count>=14?'bien':'flojo'); finishTrainingResult(tier); return; }
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
}
function clickCounterTrain(){

  trainCtx.count++;
  const el = document.getElementById('clickCount');
  if(el) el.textContent = trainCtx.count;
}

/* --- reaction (training) --- */
function scheduleReactionRound(){
  if(!trainCtx || trainCtx.kind!=='reaction') return;
  if(trainCtx.round>=trainCtx.total){ const tier=trainCtx.hits>=4?'perfecto':(trainCtx.hits>=3?'bien':'flojo'); finishTrainingResult(tier); return; }
  trainCtx.phase='waiting'; render();
  const delay = randi(500,1200);
  setTimeout(()=>{
    if(!trainCtx || trainCtx.kind!=='reaction') return;
    trainCtx.phase='live'; render();
    setTimeout(()=>{
      if(trainCtx && trainCtx.kind==='reaction' && trainCtx.phase==='live'){
        trainCtx.results.push('miss'); trainCtx.round++;
        setTimeout(scheduleReactionRound, 350);
      }
    }, 430);
  }, delay);
}
function hitReaction(){
  if(!trainCtx || trainCtx.kind!=='reaction' || trainCtx.phase!=='live') return;
  trainCtx.phase='between'; // block the pending miss-timeout from also firing
  trainCtx.hits++; trainCtx.results.push('hit'); trainCtx.round++;
  render();
  setTimeout(scheduleReactionRound, 350);
}

/* Dificultad de un desafío según la habilidad EN JUEGO, no la general */
function skillDiffLabel(cat){
  const c = cat || (fight && fight.currentCat) || 'striking';
  const g = catGap(c);
  const mine = Math.round(myStatFor(c)), his = Math.round((fight&&fight.opponent[c])||0);
  const NM = {striking:'striking', wrestling:'lucha', sumision:'sumisión'};
  let t,col;
  if(g<=-8){ t='MUY FÁCIL'; col='var(--neon)'; }
  else if(g<=-3){ t='FÁCIL'; col='var(--neon)'; }
  else if(g<3){ t='PAREJO'; col='var(--text)'; }
  else if(g<7){ t='DIFÍCIL'; col='var(--gold)'; }
  else if(g<12){ t='MUY DIFÍCIL'; col='#ff9a4a'; }
  else { t='BRUTAL'; col='var(--red)'; }
  const why = g<=-3 ? `por tu mejor ${NM[c]||'nivel'} (${mine} vs ${his})`
            : (g>=3 ? `su ${NM[c]||'nivel'} te supera (${mine} vs ${his})`
            : `${NM[c]||'nivel'} parejo (${mine} vs ${his})`);
  return {t, col, why};
}
/* Ofertas de pelea: elegís cuál firmar */
function boutPurse(o){
  const base = tierBaseMoney(ORGS[state.player.orgId].tier);
  const r = opponentRankPos(o);
  let rankMult = 1;
  if(r==='C') rankMult = 4.5;                 // pelear con el campeón paga otra cosa
  else if(r && r<=3) rankMult = 3.2;
  else if(r && r<=8) rankMult = 2.1;
  else if(r) rankMult = 1.5;
  const oPow = powerScore(o), myPow = powerScore(state.player);
  const gapQ = (isFinite(oPow) && isFinite(myPow)) ? Math.max(0, oPow - myPow) : 0;
  const q = 1 + gapQ*0.03;
  return Math.round(base * rankMult * q);
}
function generateBoutOffers(){
  const p=state.player;
  const rk=getRankings(p.orgId,p.weightClass,p.continent);
  const idx=playerRankIndex(rk);
  const offers=[];
  const mk=(o,tag)=>({o, tag, purse:boutPurse(o)});
  if(idx===0){
    offers.push(mk(pickOpponent(),'Pelea titular'));
  } else if(idx>0){
    const step=pickOpponent();                       // el de arriba
    offers.push(mk(step,'El siguiente en la fila'));
    const safeIdx=Math.min(rk.contenders.length-1, idx+1);
    const safe=rk.contenders[safeIdx];
    if(safe && !safe.isPlayer) offers.push(mk({name:safe.name, flag:safe.flag, cc:safe.cc, ...genOpponentStats(safe.power), isTitle:false, record:`${randi(5,12)}-${randi(1,5)}-0`},'Trámite más accesible'));
    const bigIdx=Math.max(0, idx-4);
    const big=rk.contenders[bigIdx];
    if(big && !big.isPlayer && bigIdx<idx-1) offers.push(mk({name:big.name, flag:big.flag, cc:big.cc, ...genOpponentStats(big.power), isTitle:false, record:`${randi(9,16)}-${randi(0,3)}-0`},'Salto de categoría · paga más'));
  } else {
    for(let i=0;i<3;i++) offers.push(mk(pickOpponent(), ['Debutante','Rival de cartelera','Veterano duro'][i]));
  }
  return offers.slice(0,3);
}
