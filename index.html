<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="description" content="El Ídolo: MMA — armá la carrera de un peleador en 5 minutos: cartas de mejora, decisiones sin vuelta atrás y peleas que se definen con minijuegos.">
<meta name="theme-color" content="#050807">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>El Ídolo: MMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg:#050807; --bg-elev:#0c110e; --bg-elev-2:#121a15; --bg-elev-3:#18231c; --line:#213026; --line-2:#2c3f32;
    --neon:#3bf07a; --neon-deep:#12994a; --neon-glow:rgba(59,240,122,.45); --neon-soft:rgba(59,240,122,.12);
    --red:#ff2e46; --red-dim:#8a1122; --red-glow:rgba(255,46,70,.5); --red-soft:rgba(255,46,70,.12);
    --gold:#f2c94c; --gold-dim:#8a7020; --gold-glow:rgba(242,201,76,.45); --gold-soft:rgba(242,201,76,.12);
    --blue:#4aa8ff; --purple:#b36bff; --orange:#ff9a4a;
    --text:#f4f7f4; --text-dim:#87968c; --text-mute:#5d6b62; --steel:#46564c;
    --font-display:'Bebas Neue', 'Oswald', 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue Condensed', Impact, sans-serif-condensed, sans-serif; --font-body:'Inter', system-ui, sans-serif; --font-mono:'JetBrains Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 720px 480px at 50% -6%, rgba(59,240,122,.13), transparent 60%),
      radial-gradient(ellipse 500px 400px at 100% 40%, rgba(255,46,70,.05), transparent 60%),
      var(--bg);
    color:var(--text);font-family:var(--font-body);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  #app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 0 40px;position:relative;}
  #app::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
    background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.022) 1px, transparent 0);background-size:24px 24px;}
  #app>*{position:relative;z-index:1;}
  #app>.modal-bg{position:fixed;z-index:80;}
  h1,h2,h3,.display{font-family:var(--font-display);letter-spacing:.03em;font-weight:400;margin:0;}
  .mono{font-family:var(--font-mono);}
  button{font-family:var(--font-body);cursor:pointer;border:none;color:var(--text);background:none;padding:0;touch-action:manipulation;}
  button:focus-visible, input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  button:disabled{cursor:not-allowed;}
  ::selection{background:var(--red-dim);color:var(--text);}
  b.g,.g{color:var(--neon);} b.y,.y{color:var(--gold);} b.r,.r{color:#ff6b7d;}

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(59,240,122,.035), transparent);position:sticky;top:0;z-index:20;backdrop-filter:blur(8px);}
  .brand{font-family:var(--font-display);font-size:22px;letter-spacing:.07em;}
  .brand span{color:var(--neon);text-shadow:0 0 14px var(--neon-glow);}
  .tb-right{display:flex;gap:8px;align-items:center;}
  .icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg-elev);font-size:16px;display:flex;align-items:center;justify-content:center;}
  .icon-btn:hover{border-color:var(--neon-deep);}

  /* ---------- botones ---------- */
  .btn{display:block;width:100%;font-family:var(--font-display);font-size:22px;letter-spacing:.05em;line-height:1.1;padding:15px 12px;border-radius:12px;
    background:linear-gradient(180deg,#4bff88,#16b055);color:#04140a;box-shadow:0 0 0 1px rgba(120,255,170,.35), 0 10px 30px -10px var(--neon-glow), inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .1s ease, filter .1s ease;}
  .btn:hover{filter:brightness(1.06);} .btn:active{transform:scale(.97);}
  .btn.gold{background:linear-gradient(180deg,#ffe07a,#d4a520);color:#1a1400;box-shadow:0 10px 30px -10px var(--gold-glow), inset 0 1px 0 rgba(255,255,255,.4);}
  .btn.red{background:linear-gradient(180deg,#ff5568,#b8172c);color:#fff;box-shadow:0 10px 30px -10px var(--red-glow), inset 0 1px 0 rgba(255,255,255,.25);}
  .btn.ghost{background:var(--bg-elev-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line);font-family:var(--font-body);font-weight:700;font-size:14px;letter-spacing:.02em;padding:13px;}
  .btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--steel);}
  .btn.sm{font-size:17px;padding:11px 14px;}
  .btn:disabled{filter:grayscale(1) brightness(.6);}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stack>*+*{margin-top:10px;}

  .chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:11.5px;background:var(--bg-elev-2);border:1px solid var(--line);
    padding:5px 9px;border-radius:20px;color:var(--text-dim);white-space:nowrap;}
  .chip b{color:var(--text);font-weight:700;}
  .chip.gold{color:var(--gold);border-color:var(--gold-dim);background:var(--gold-soft);} .chip.gold b{color:var(--gold);}
  .chip.green{color:var(--neon);border-color:var(--neon-deep);background:var(--neon-soft);} .chip.green b{color:var(--neon);}
  .chip.red{color:#ff8a97;border-color:var(--red-dim);background:var(--red-soft);} .chip.red b{color:#ff8a97;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--neon);}
  .muted{color:var(--text-dim);}
  .center{text-align:center;}

  /* ---------- flags ---------- */
  .flag{width:22px;height:15px;border-radius:3px;vertical-align:-3px;box-shadow:0 1px 3px rgba(0,0,0,.6);display:inline-block;flex-shrink:0;}
  .flag.lg{width:34px;height:23px;border-radius:4px;vertical-align:-6px;}
  .flag.xl{width:54px;height:36px;border-radius:5px;}
  .flag-fb{font-family:var(--font-mono);font-size:10px;background:var(--bg-elev-2);border:1px solid var(--line);padding:1px 4px;border-radius:4px;color:var(--text-dim);}

  /* ---------- MENU ---------- */
  .hero{padding:56px 20px 30px;text-align:center;min-height:calc(100vh - 62px);display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;}
  .hero::after{content:'';position:absolute;top:18%;left:50%;transform:translateX(-50%);width:360px;height:360px;border-radius:50%;
    background:radial-gradient(circle, rgba(59,240,122,.16), transparent 68%);filter:blur(24px);pointer-events:none;z-index:-1;}
  .hero-oct{width:150px;height:150px;margin:0 auto 18px;animation:octSpin 30s linear infinite;filter:drop-shadow(0 0 24px var(--neon-glow));}
  @keyframes octSpin{to{transform:rotate(360deg);}}
  .hero h1{font-size:74px;line-height:.86;text-shadow:0 0 50px rgba(59,240,122,.25);}
  .hero h1 .accent{color:var(--neon);text-shadow:0 0 44px var(--neon-glow);}
  .hero .tag{font-family:var(--font-mono);font-size:12px;letter-spacing:.3em;color:var(--gold);margin:14px 0 6px;}
  .hero p{color:var(--text-dim);font-size:15px;max-width:360px;margin:10px auto 28px;line-height:1.6;}
  .hero .btn{max-width:330px;margin:0 auto;}
  .hero-feats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:30px auto 0;max-width:380px;}
  .hero-feats div{background:var(--bg-elev);border:1px solid var(--line);border-radius:12px;padding:11px 6px;font-size:10.5px;color:var(--text-dim);font-family:var(--font-mono);}
  .hero-feats b{display:block;font-family:var(--font-display);font-size:24px;color:var(--neon);font-weight:400;}
  .best-line{margin-top:16px;font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);}
  .best-line b{color:var(--gold);}
  footer.credits{text-align:center;color:var(--text-mute);font-size:10.5px;padding:22px 20px 6px;font-family:var(--font-mono);line-height:1.6;}

  /* ---------- CREATE ---------- */
  .wrap{padding:16px 16px 24px;}
  .sec-title{font-family:var(--font-display);font-size:24px;margin:18px 2px 8px;display:flex;align-items:baseline;gap:8px;}
  .sec-title small{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);letter-spacing:.1em;}
  .name-row{display:flex;gap:8px;}
  .name-input{flex:1;min-width:0;background:var(--bg-elev);border:1px solid var(--line);color:var(--text);padding:14px;border-radius:12px;font-size:18px;font-family:var(--font-body);font-weight:600;}
  .name-input:focus{outline:none;border-color:var(--neon);box-shadow:0 0 24px -8px var(--neon-glow);}
  .dice-btn{width:52px;border-radius:12px;border:1px solid var(--line);background:var(--bg-elev);font-size:22px;}
  .flag-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .flag-chip{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg-elev);font-size:9.5px;color:var(--text-dim);
    font-family:var(--font-mono);transition:transform .1s, border-color .1s;}
  .flag-chip .flag{width:30px;height:20px;}
  .flag-chip.sel{border-color:var(--neon);color:var(--neon);background:var(--neon-soft);box-shadow:0 0 16px -6px var(--neon-glow);}
  .wc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .wc-chip{padding:9px 4px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg-elev);text-align:center;}
  .wc-chip .n{font-family:var(--font-display);font-size:16px;letter-spacing:.04em;}
  .wc-chip .k{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);}
  .wc-chip.sel{border-color:var(--neon);background:var(--neon-soft);box-shadow:0 0 16px -6px var(--neon-glow);}
  .wc-chip.sel .n{color:var(--neon);}
  .wc-note{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);margin:7px 2px 0;min-height:14px;}
  .pick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .pick-grid.two{grid-template-columns:1fr 1fr;}
  .pick{position:relative;border-radius:14px;border:1.5px solid var(--line);background:linear-gradient(170deg,var(--bg-elev-2),var(--bg-elev));padding:14px 9px 12px;text-align:center;
    transition:transform .12s, border-color .12s, box-shadow .12s;}
  .pick:hover{transform:translateY(-2px);border-color:var(--steel);}
  .pick .ico{font-size:30px;line-height:1;margin-bottom:6px;}
  .pick .nm{font-family:var(--font-display);font-size:20px;letter-spacing:.05em;}
  .pick .tg{font-family:var(--font-mono);font-size:9.5px;color:var(--gold);margin:3px 0 5px;letter-spacing:.04em;}
  .pick .ds{font-size:11px;color:var(--text-dim);line-height:1.42;}
  .pick.sel{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon-deep), 0 0 28px -8px var(--neon-glow);background:radial-gradient(circle at 50% 18%, rgba(59,240,122,.15), var(--bg-elev-2));}
  .pick.sel::after{content:'✓';position:absolute;top:7px;right:9px;color:var(--neon);font-weight:800;font-size:13px;}
  .create-cta{position:sticky;bottom:0;padding:12px 16px 16px;background:linear-gradient(0deg, var(--bg) 60%, transparent);z-index:5;}
  .err{color:#ff8a97;font-size:12.5px;text-align:center;min-height:18px;margin-bottom:6px;}

  /* ---------- CAREER: player strip ---------- */
  .pstrip{display:flex;gap:12px;align-items:stretch;padding:14px 16px 10px;}
  .ovr{width:78px;flex-shrink:0;border-radius:12px;padding:8px 6px 7px;text-align:center;position:relative;overflow:hidden;
    background:linear-gradient(160deg,#6b4a2a,#3a2716);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12), 0 8px 24px -12px #000;}
  .ovr::before{content:'';position:absolute;inset:0;background:linear-gradient(115deg, transparent 35%, rgba(255,255,255,.18) 50%, transparent 65%);transform:translateX(-100%);animation:shine 4.5s ease-in-out infinite;}
  @keyframes shine{0%,70%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
  .ovr.t1{background:linear-gradient(160deg,#9aa6ad,#4d575d);}
  .ovr.t2{background:linear-gradient(160deg,#e9c252,#8a6a12);}
  .ovr.t3{background:linear-gradient(160deg,#3bf07a,#0b5f2d);}
  .ovr.t4{background:linear-gradient(160deg,#c99bff,#4c1f8a);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.2), 0 0 26px -6px rgba(179,107,255,.7);}
  .ovr .v{font-family:var(--font-display);font-size:42px;line-height:.9;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.4);}
  .ovr .l{font-family:var(--font-mono);font-size:9px;letter-spacing:.2em;color:rgba(255,255,255,.8);}
  .ovr .s{font-size:18px;margin-top:3px;}
  .pinfo{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px;}
  .pname{font-family:var(--font-display);font-size:25px;line-height:1;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .psub{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);}
  .porg{font-size:12.5px;font-weight:600;}
  .porg .champ{color:var(--gold);}
  .res-row{display:flex;gap:5px;flex-wrap:wrap;padding:0 16px;}
  .res-row .chip{padding:5px 8px;}
  .st-row{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:10px 16px 4px;}
  .st{background:var(--bg-elev);border:1px solid var(--line);border-radius:9px;padding:6px 2px 5px;text-align:center;position:relative;}
  .st .k{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.12em;color:var(--text-dim);}
  .st .v{font-family:var(--font-display);font-size:21px;line-height:1.05;}
  .st .bar{height:3px;border-radius:2px;background:var(--bg-elev-3);margin:3px 6px 0;overflow:hidden;}
  .st .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--neon-deep),var(--neon));}
  .st.hl{border-color:var(--neon-deep);}
  .st .up{position:absolute;top:-8px;right:-4px;font-family:var(--font-mono);font-size:10px;font-weight:700;color:#04140a;background:var(--neon);border-radius:8px;padding:1px 5px;animation:upPop .5s cubic-bezier(.2,.9,.3,1.5);}
  .st .up.dn{background:var(--red);color:#fff;}
  @keyframes upPop{0%{transform:scale(.2);opacity:0;}100%{transform:scale(1);opacity:1;}}

  /* ---------- CAREER: step panel ---------- */
  .panel{margin:12px 16px 0;background:linear-gradient(180deg, rgba(59,240,122,.035), var(--bg-elev));border:1px solid var(--line);border-radius:18px;padding:18px 16px 16px;
    box-shadow:0 18px 40px -26px #000;animation:panelIn .35s cubic-bezier(.2,.8,.2,1);}
  @keyframes panelIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  .panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;}
  .panel-t{font-family:var(--font-display);font-size:30px;line-height:1;margin:2px 0 4px;}
  .panel-s{color:var(--text-dim);font-size:13px;line-height:1.5;margin-bottom:14px;}
  .growth{display:flex;flex-wrap:wrap;gap:5px;margin:-4px 0 12px;}

  /* cartas de mejora */
  .ucards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;perspective:900px;}
  .ucards.four{grid-template-columns:repeat(2,1fr);}
  .ucard{position:relative;border-radius:14px;padding:12px 8px 10px;text-align:center;min-height:178px;display:flex;flex-direction:column;align-items:center;
    background:linear-gradient(170deg,#2a332e,#141a16);border:1.5px solid #56645b;box-shadow:0 12px 26px -16px #000;
    transition:transform .15s ease, box-shadow .15s ease;animation:deal .5s cubic-bezier(.2,.8,.25,1.2) backwards;}
  .ucards.four .ucard{min-height:150px;}
  .ucard:nth-child(2){animation-delay:.08s;} .ucard:nth-child(3){animation-delay:.16s;} .ucard:nth-child(4){animation-delay:.24s;}
  @keyframes deal{0%{transform:rotateY(90deg) translateY(30px) scale(.8);opacity:0;}100%{transform:none;opacity:1;}}
  .ucard:hover:not(:disabled){transform:translateY(-4px);}
  .ucard .rar{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.18em;color:#b9c4bd;margin-bottom:6px;}
  .ucard .ico{font-size:34px;line-height:1;margin:2px 0 6px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));}
  .ucard .nm{font-family:var(--font-display);font-size:17px;line-height:1.02;letter-spacing:.03em;min-height:34px;display:flex;align-items:center;}
  .ucard .fx{font-family:var(--font-mono);font-size:10.5px;color:var(--neon);margin-top:6px;line-height:1.45;font-weight:700;}
  .ucard .fx .neg{color:#ff8a97;}
  .ucard .cost{margin-top:auto;padding-top:6px;font-family:var(--font-mono);font-size:10px;color:var(--gold);}
  .ucard.r-r{background:linear-gradient(170deg,#18314a,#0d1620);border-color:#3f86c9;}
  .ucard.r-r .rar{color:var(--blue);}
  .ucard.r-e{background:linear-gradient(170deg,#2f1a48,#140c20);border-color:#8e52d6;box-shadow:0 0 22px -10px rgba(179,107,255,.7);}
  .ucard.r-e .rar{color:var(--purple);}
  .ucard.r-l{background:linear-gradient(170deg,#4a3a10,#1a1406);border-color:var(--gold);box-shadow:0 0 30px -8px var(--gold-glow);}
  .ucard.r-l .rar{color:var(--gold);}
  .ucard.r-l::after{content:'';position:absolute;inset:0;border-radius:13px;background:linear-gradient(115deg, transparent 30%, rgba(255,230,150,.22) 50%, transparent 70%);
    animation:shine 2.6s ease-in-out infinite;pointer-events:none;}
  .ucard:disabled{opacity:.45;}
  .ucard.picked{transform:scale(1.06) translateY(-6px);box-shadow:0 0 0 2px var(--neon), 0 0 40px -6px var(--neon-glow);}
  .ucard.gone{opacity:.25;transform:scale(.92);}

  /* evento */
  .ev-who{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .ev-ava{width:58px;height:58px;border-radius:16px;background:radial-gradient(circle at 50% 35%, var(--bg-elev-3), var(--bg-elev-2));border:1px solid var(--line-2);
    display:flex;align-items:center;justify-content:center;font-size:34px;flex-shrink:0;box-shadow:0 8px 20px -12px #000;}
  .ev-name{font-family:var(--font-display);font-size:22px;line-height:1;}
  .ev-role{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);letter-spacing:.1em;margin-top:3px;text-transform:uppercase;}
  .ev-text{font-size:15.5px;line-height:1.55;margin-bottom:16px;}
  .ev-choice{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg-elev-2);border:1.5px solid var(--line);border-radius:12px;padding:13px 13px;margin-bottom:9px;
    font-size:14.5px;font-weight:600;transition:border-color .12s, transform .1s;}
  .ev-choice:hover{border-color:var(--neon-deep);}
  .ev-choice:active{transform:scale(.98);}
  .ev-choice .k{width:24px;height:24px;border-radius:7px;background:var(--bg-elev-3);font-family:var(--font-mono);font-size:11px;color:var(--text-dim);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ev-choice .t{flex:1;}
  .ev-choice .h{font-size:13px;letter-spacing:1px;opacity:.8;white-space:nowrap;}
  .ev-res{background:var(--bg-elev-2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:12px;font-size:14px;line-height:1.5;animation:panelIn .3s ease;}
  .deltas{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}

  /* temporada */
  .srow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);animation:rowIn .35s ease backwards;}
  .srow:last-of-type{border-bottom:none;}
  @keyframes rowIn{from{opacity:0;transform:translateX(-14px);}to{opacity:1;transform:none;}}
  .srow .res{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:18px;flex-shrink:0;}
  .srow .res.w{background:var(--neon-soft);color:var(--neon);border:1px solid var(--neon-deep);}
  .srow .res.l{background:var(--red-soft);color:#ff8a97;border:1px solid var(--red-dim);}
  .srow .who{flex:1;min-width:0;}
  .srow .who .n{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .srow .who .m{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);margin-top:2px;}
  .srow .rk{font-family:var(--font-mono);font-size:10.5px;text-align:right;white-space:nowrap;}
  .rk-up{color:var(--neon);} .rk-dn{color:#ff8a97;}
  .inj{text-align:center;padding:18px 8px;color:var(--text-dim);font-size:14px;}
  .inj b{display:block;font-size:40px;margin-bottom:6px;}

  /* VS preview */
  .fight-tag{display:inline-block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;padding:5px 12px;border-radius:20px;border:1px solid var(--neon-deep);color:var(--neon);background:var(--neon-soft);}
  .fight-tag.title{border-color:var(--gold-dim);color:var(--gold);background:var(--gold-soft);box-shadow:0 0 20px -8px var(--gold-glow);}
  .fight-tag.clasico{border-color:var(--red-dim);color:#ff8a97;background:var(--red-soft);}
  .vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin:16px 0 12px;}
  .vs-side{text-align:center;min-width:0;}
  .vs-side .nm{font-family:var(--font-display);font-size:20px;line-height:1.05;margin-top:6px;overflow-wrap:anywhere;}
  .vs-side .meta{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);margin-top:3px;}
  .vs-side .o{display:inline-block;margin-top:6px;font-family:var(--font-display);font-size:26px;line-height:1;padding:4px 10px 2px;border-radius:9px;background:var(--bg-elev-3);}
  .vs-side.me .o{color:var(--neon);} .vs-side.op .o{color:#ff6b7d;}
  .vs-mid{font-family:var(--font-display);font-size:34px;color:var(--red);text-shadow:0 0 18px var(--red-glow);}
  .cmp{margin:6px 0 12px;}
  .cmp-row{display:grid;grid-template-columns:28px 1fr 64px 1fr 28px;align-items:center;gap:6px;margin-bottom:6px;font-family:var(--font-mono);font-size:11px;}
  .cmp-row .l{text-align:center;color:var(--text-dim);font-size:9.5px;letter-spacing:.1em;}
  .cmp-row .a{text-align:right;} .cmp-row .b{text-align:left;}
  .cmp-bar{height:6px;border-radius:3px;background:var(--bg-elev-3);overflow:hidden;display:flex;}
  .cmp-bar.me{justify-content:flex-end;}
  .cmp-bar i{display:block;height:100%;}
  .cmp-bar.me i{background:linear-gradient(90deg,var(--neon-deep),var(--neon));}
  .cmp-bar.op i{background:linear-gradient(90deg,#ff6b7d,var(--red-dim));}
  .odds{display:flex;align-items:center;gap:8px;margin:4px 0 14px;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);}
  .odds-bar{flex:1;height:10px;border-radius:6px;background:var(--red-dim);overflow:hidden;}
  .odds-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--neon-deep),var(--neon));}
  .how-line{font-size:12px;color:var(--text-dim);text-align:center;margin:-4px 0 12px;line-height:1.5;}

  /* fin de año */
  .headline{border-left:3px solid var(--gold);background:linear-gradient(90deg, var(--gold-soft), transparent);padding:10px 12px;border-radius:0 10px 10px 0;margin-bottom:12px;}
  .headline .src{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.2em;color:var(--gold);}
  .headline .tx{font-family:var(--font-display);font-size:23px;line-height:1.08;margin-top:3px;}
  .ye-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px;}
  .ye{background:var(--bg-elev-2);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;}
  .ye .k{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.12em;color:var(--text-dim);text-transform:uppercase;}
  .ye .v{font-family:var(--font-display);font-size:21px;margin-top:2px;}
  .news{font-size:12.5px;color:var(--text-dim);line-height:1.5;margin-bottom:12px;}
  .news div{padding:3px 0;}

  /* timeline */
  .tl{margin:18px 16px 0;}
  .tl h4{font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:var(--text-dim);margin:0 0 8px;font-weight:600;}
  .tl-row{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--bg-elev);border:1px solid var(--line);margin-bottom:6px;}
  .tl-row .y{font-family:var(--font-display);font-size:18px;color:var(--text-dim);line-height:1;}
  .tl-row .y small{display:block;font-family:var(--font-mono);font-size:9px;}
  .tl-row .t{font-size:12.5px;line-height:1.35;min-width:0;}
  .tl-row .t .o{font-family:var(--font-mono);font-size:9.5px;color:var(--text-dim);}
  .tl-row .r{font-family:var(--font-mono);font-size:11px;font-weight:700;}
  .tl-row.gold{border-color:var(--gold-dim);background:linear-gradient(90deg, var(--gold-soft), var(--bg-elev) 70%);}

  /* ---------- FIGHT ---------- */
  .fhead{padding:10px 16px 6px;}
  .fh-top{display:flex;justify-content:center;margin-bottom:8px;}
  .fh-vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;}
  .fh-side{display:flex;align-items:center;gap:7px;min-width:0;}
  .fh-side.op{justify-content:flex-end;text-align:right;}
  .fh-side .n{font-family:var(--font-display);font-size:18px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fh-side .o{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);}
  .rdots{display:flex;gap:5px;justify-content:center;}
  .rdot{width:14px;height:14px;border-radius:50%;background:var(--bg-elev-3);border:1px solid var(--line-2);}
  .rdot.w{background:var(--neon);border-color:var(--neon);box-shadow:0 0 10px var(--neon-glow);}
  .rdot.l{background:var(--red);border-color:var(--red);box-shadow:0 0 10px var(--red-glow);}
  .fbody{padding:4px 16px 0;}
  .round-banner{text-align:center;font-family:var(--font-display);font-size:16px;letter-spacing:.3em;color:var(--text-dim);margin:6px 0 2px;}
  .mg-name{text-align:center;font-family:var(--font-display);font-size:34px;line-height:1;margin:2px 0 4px;}
  .mg-sub{text-align:center;font-size:12.5px;color:var(--text-dim);line-height:1.5;min-height:19px;margin-bottom:8px;padding:0 6px;}
  .intro-card{background:linear-gradient(180deg, rgba(59,240,122,.06), var(--bg-elev));border:1.5px solid var(--line);border-radius:18px;padding:22px 18px 18px;text-align:center;margin-top:10px;
    animation:panelIn .35s cubic-bezier(.2,.8,.2,1);}
  .intro-card .ico{font-size:52px;line-height:1;margin-bottom:6px;animation:bob 1.6s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  .intro-card .nm{font-family:var(--font-display);font-size:34px;line-height:1;}
  .intro-card .how{font-size:14px;color:var(--text-dim);line-height:1.55;margin:10px 0 12px;}
  .intro-card .new{display:inline-block;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.2em;color:#04140a;background:var(--gold);border-radius:6px;padding:2px 7px;margin-bottom:8px;}
  .diffline{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;margin-bottom:14px;}
  .stage{position:relative;width:100%;max-width:360px;aspect-ratio:1/1;margin:0 auto;border-radius:22px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;
    background:radial-gradient(circle at 50% 45%, #122018, #07100b 70%);border:1px solid var(--line);box-shadow:inset 0 0 60px rgba(0,0,0,.6), 0 20px 40px -26px #000;}
  .stage.tall{aspect-ratio:1/1.08;}
  .stage svg{width:100%;height:100%;display:block;}
  .mg-hud{display:flex;justify-content:center;align-items:center;gap:8px;min-height:30px;margin:10px 0 6px;font-family:var(--font-mono);font-size:12px;color:var(--text-dim);}
  .pip{width:16px;height:16px;border-radius:50%;background:var(--bg-elev-3);border:1px solid var(--line-2);display:inline-block;}
  .pip.gold{background:var(--gold);border-color:var(--gold);box-shadow:0 0 10px var(--gold-glow);}
  .pip.ok{background:var(--neon);border-color:var(--neon);box-shadow:0 0 10px var(--neon-glow);}
  .pip.bad{background:var(--red);border-color:var(--red);}
  .mg-act{margin-top:6px;}
  .tapbtn{display:block;width:100%;font-family:var(--font-display);font-size:30px;letter-spacing:.08em;padding:20px;border-radius:16px;background:linear-gradient(180deg,#4bff88,#16b055);color:#04140a;
    box-shadow:0 0 0 1px rgba(120,255,170,.35), 0 14px 34px -12px var(--neon-glow), inset 0 1px 0 rgba(255,255,255,.35);user-select:none;-webkit-user-select:none;touch-action:none;}
  .tapbtn:active,.tapbtn.on{transform:scale(.97);filter:brightness(1.1);}
  .tapbtn.red{background:linear-gradient(180deg,#ff5568,#b8172c);color:#fff;}
  .tapbtn.gold{background:linear-gradient(180deg,#ffe07a,#d4a520);color:#1a1400;box-shadow:0 14px 34px -12px var(--gold-glow), inset 0 1px 0 rgba(255,255,255,.4);}
  .tapbtn:disabled{filter:grayscale(.4) brightness(.8);}
  .stage svg text:not([font-family]), .stage .emo{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',var(--font-body);}
  .lane-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .lane-btns button{font-family:var(--font-display);font-size:22px;padding:16px 4px;border-radius:14px;background:var(--bg-elev-2);border:1.5px solid var(--line-2);}
  .lane-btns button:active{background:var(--neon-soft);border-color:var(--neon);}
  .lane-btns button small{display:block;font-family:var(--font-mono);font-size:9px;color:var(--text-dim);letter-spacing:.1em;}
  .timer{height:6px;border-radius:3px;background:var(--bg-elev-3);overflow:hidden;margin:8px auto 0;max-width:360px;}
  .timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--red),var(--gold),var(--neon));transform-origin:left;}

  /* textos flotantes y efectos */
  .pop{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--font-display);font-size:44px;letter-spacing:.04em;pointer-events:none;z-index:30;white-space:nowrap;
    animation:popUp .9s cubic-bezier(.2,.9,.3,1.2) forwards;text-shadow:0 4px 18px rgba(0,0,0,.6);}
  .pop.gold{color:var(--gold);text-shadow:0 0 24px var(--gold-glow);} .pop.ok{color:var(--neon);text-shadow:0 0 24px var(--neon-glow);} .pop.bad{color:#ff5b6e;text-shadow:0 0 24px var(--red-glow);}
  .pop.sm{font-size:28px;}
  @keyframes popUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.5);}18%{opacity:1;transform:translate(-50%,-55%) scale(1.15);}70%{opacity:1;transform:translate(-50%,-70%) scale(1);}100%{opacity:0;transform:translate(-50%,-95%) scale(.95);}}
  .shake{animation:shake .38s ease;}
  @keyframes shake{0%,100%{transform:none;}20%{transform:translate(-7px,3px) rotate(-.6deg);}40%{transform:translate(6px,-3px) rotate(.5deg);}60%{transform:translate(-4px,2px);}80%{transform:translate(3px,-1px);}}
  #flash{position:fixed;inset:0;pointer-events:none;z-index:90;opacity:0;}
  #flash.g{background:radial-gradient(circle, rgba(59,240,122,.28), transparent 70%);animation:flashA .35s ease;}
  #flash.r{background:radial-gradient(circle, rgba(255,46,70,.35), transparent 70%);animation:flashA .4s ease;}
  #flash.y{background:radial-gradient(circle, rgba(242,201,76,.35), transparent 70%);animation:flashA .45s ease;}
  @keyframes flashA{0%{opacity:1;}100%{opacity:0;}}
  .confetti{position:fixed;top:-20px;width:9px;height:14px;z-index:95;pointer-events:none;border-radius:2px;animation:fall linear forwards;}
  @keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot));}}

  .round-res{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(3,6,4,.72);backdrop-filter:blur(3px);
    animation:fadeIn .2s ease;border-radius:22px;text-align:center;padding:16px;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .round-res .big{font-family:var(--font-display);font-size:52px;line-height:.95;animation:koPop .45s cubic-bezier(.2,.8,.2,1.3);}
  .round-res .big.ok{color:var(--neon);text-shadow:0 0 30px var(--neon-glow);} .round-res .big.bad{color:#ff5b6e;text-shadow:0 0 30px var(--red-glow);} .round-res .big.gold{color:var(--gold);text-shadow:0 0 30px var(--gold-glow);}
  .round-res .sm{color:var(--text-dim);font-size:13.5px;margin-top:8px;max-width:280px;line-height:1.45;}
  .round-res .btns{margin-top:16px;width:100%;max-width:280px;}

  /* cara a cara */
  .bubble{position:relative;background:var(--bg-elev-2);border:1px solid var(--line-2);border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.45;font-style:italic;margin:12px 0 16px;}
  .bubble::after{content:'';position:absolute;left:30px;bottom:-9px;width:16px;height:16px;background:var(--bg-elev-2);border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);transform:rotate(45deg);}
  .tt-face{display:flex;align-items:center;gap:10px;}
  .tt-face .f{font-size:42px;}

  /* ---------- KO ---------- */
  .ko-screen{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:radial-gradient(ellipse at 50% 45%, rgba(255,46,70,.16), transparent 60%), var(--bg);animation:shake .5s ease;}
  .ko-screen.win{background:radial-gradient(ellipse at 50% 45%, rgba(59,240,122,.16), transparent 60%), var(--bg);}
  .ko-burst{position:absolute;top:44%;left:50%;width:40px;height:40px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle, rgba(255,60,80,.85), rgba(255,46,70,.2) 60%, transparent 72%);animation:koBurst .6s cubic-bezier(.15,.7,.3,1) forwards;}
  .ko-screen.win .ko-burst{background:radial-gradient(circle, rgba(59,240,122,.8), rgba(59,240,122,.15) 60%, transparent 72%);}
  @keyframes koBurst{0%{width:20px;height:20px;opacity:1;}100%{width:560px;height:560px;opacity:0;}}
  .ko-speck{position:absolute;top:44%;left:50%;border-radius:50% 50% 48% 52%;background:radial-gradient(circle at 40% 35%, #ff4a5e, #9c0d1e);opacity:0;animation:koSpeck .7s ease-out forwards;}
  @keyframes koSpeck{0%{opacity:0;transform:rotate(var(--ang)) translateX(0) scale(.4);}20%{opacity:1;}100%{opacity:.85;transform:rotate(var(--ang)) translateX(var(--dist)) scale(1);}}
  .ko-content{position:relative;z-index:2;text-align:center;padding:0 20px;animation:koPop .5s cubic-bezier(.2,.8,.2,1);}
  @keyframes koPop{0%{transform:scale(.6);opacity:0;}100%{transform:scale(1);opacity:1;}}
  .ko-method{font-family:var(--font-mono);font-size:12px;letter-spacing:.22em;color:var(--red);text-transform:uppercase;margin-bottom:8px;}
  .ko-screen.win .ko-method{color:var(--neon);}
  .ko-big{font-family:var(--font-display);font-size:118px;line-height:.88;color:#fff;text-shadow:0 0 40px rgba(255,46,70,.7), 0 0 8px rgba(255,46,70,.9);letter-spacing:.04em;}
  .ko-screen.win .ko-big{text-shadow:0 0 40px rgba(59,240,122,.7), 0 0 8px rgba(59,240,122,.9);}
  .ko-big.long{font-size:78px;}
  .ko-sub{color:var(--text-dim);font-size:14px;margin-top:10px;}

  /* ---------- RESULT ---------- */
  .result-banner{text-align:center;padding:30px 16px 24px;border-radius:18px;margin:14px 16px 12px;position:relative;overflow:hidden;}
  .result-banner.win{background:radial-gradient(ellipse at 50% 0%, rgba(59,240,122,.24), transparent 70%), var(--bg-elev);border:1px solid var(--neon-deep);box-shadow:0 0 40px -14px var(--neon-glow);}
  .result-banner.loss{background:radial-gradient(ellipse at 50% 0%, rgba(255,46,70,.2), transparent 70%), var(--bg-elev);border:1px solid var(--red-dim);}
  .result-banner .m{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px;}
  .result-banner h2{font-size:62px;line-height:.95;}
  .result-banner.win h2{color:var(--neon);text-shadow:0 0 30px var(--neon-glow);}
  .result-banner.loss h2{color:#ff5b6e;text-shadow:0 0 30px var(--red-glow);}
  .result-banner .vs{font-size:13px;color:var(--text-dim);margin:8px 0 0;display:block;}
  .belt{width:210px;margin:6px auto 4px;display:block;filter:drop-shadow(0 12px 40px rgba(242,201,76,.5));animation:beltIn .8s cubic-bezier(.2,.8,.2,1);}
  @keyframes beltIn{from{transform:scale(.6) rotate(-10deg);opacity:0;}to{transform:none;opacity:1;}}
  .notes{margin:0 16px 12px;}
  .note{background:var(--bg-elev);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:13.5px;line-height:1.45;margin-bottom:8px;}
  .note.gold{border-color:var(--gold-dim);background:linear-gradient(90deg,var(--gold-soft),var(--bg-elev) 80%);}
  .note.green{border-color:var(--neon-deep);}
  .note.red{border-color:var(--red-dim);}

  .fres{border-radius:14px;padding:12px 12px 10px;margin-bottom:12px;border:1px solid var(--line);background:var(--bg-elev-2);}
  .fres.win{border-color:var(--neon-deep);background:linear-gradient(180deg, rgba(59,240,122,.08), var(--bg-elev-2));}
  .fres.loss{border-color:var(--red-dim);background:linear-gradient(180deg, rgba(255,46,70,.07), var(--bg-elev-2));}
  .fres .deltas{margin-top:6px;}

  /* ---------- END ---------- */
  .end-card{margin:16px;border-radius:22px;padding:22px 18px 18px;text-align:center;position:relative;overflow:hidden;
    background:radial-gradient(ellipse at 50% 0%, rgba(59,240,122,.14), transparent 60%), linear-gradient(180deg,var(--bg-elev-2),var(--bg-elev));border:1.5px solid var(--line-2);box-shadow:0 20px 50px -26px #000;}
  .end-card.gold{border-color:var(--gold-dim);background:radial-gradient(ellipse at 50% 0%, rgba(242,201,76,.2), transparent 60%), linear-gradient(180deg,#1b1a10,var(--bg-elev));}
  .end-rank{font-family:var(--font-display);font-size:40px;line-height:1;margin:8px 0 2px;}
  .end-score{font-family:var(--font-display);font-size:66px;line-height:1;}
  .end-score span{font-family:var(--font-mono);font-size:13px;color:var(--text-dim);}
  .end-name{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-display);font-size:26px;margin:10px 0 2px;}
  .end-sub{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);margin-bottom:14px;}
  .end-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px;}
  .legend{border-radius:14px;padding:13px 14px;margin:0 0 12px;text-align:left;background:linear-gradient(120deg, rgba(179,107,255,.14), var(--bg-elev-2) 70%);border:1px solid #5a3a8a;}
  .legend .k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.18em;color:var(--purple);}
  .legend .n{font-family:var(--font-display);font-size:26px;line-height:1.05;margin-top:3px;}
  .legend .d{font-size:12.5px;color:var(--text-dim);margin-top:3px;line-height:1.45;}
  .belts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px;}
  .ach-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:0 16px 14px;}
  .ach{background:var(--bg-elev);border:1px solid var(--line);border-radius:12px;padding:9px 4px 8px;text-align:center;opacity:.32;filter:grayscale(1);}
  .ach.on{opacity:1;filter:none;border-color:var(--gold-dim);background:linear-gradient(180deg,var(--gold-soft),var(--bg-elev));}
  .ach .i{font-size:22px;line-height:1.1;}
  .ach .t{font-size:9.5px;line-height:1.25;margin-top:4px;color:var(--text-dim);}
  .ach.on .t{color:var(--text);}
  .hof-row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;background:var(--bg-elev);border:1px solid var(--line);margin-bottom:6px;}
  .hof-row .p{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);}
  .hof-row .n{font-weight:700;font-size:13.5px;display:flex;gap:6px;align-items:center;min-width:0;}
  .hof-row .n span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hof-row .d{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);margin-top:2px;}
  .hof-row .s{font-family:var(--font-display);font-size:22px;color:var(--gold);}

const $ = id => document.getElementById(id);
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function rand(a,b){ return Math.random()*(b-a)+a; }
function randi(a,b){ return Math.floor(rand(a,b+1)); }
function choice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function lerp(a,b,t){ return a+(b-a)*t; }
function sigmoid(x){ return 1/(1+Math.exp(-x)); }
/* d: -1 (muy fácil) · 0 (parejo) · 1.5 (brutal) → interpola entre tres valores */
function byDiff(d, easy, normal, hard){ return d<=0 ? lerp(normal, easy, Math.min(1,-d)) : lerp(normal, hard, Math.min(1, d/1.5)); }
function lastName(n){ const parts=n.split(' '); return parts[parts.length-1]; }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtMoney(n){
  n = Math.round(n); const neg = n<0; n = Math.abs(n);
  let s;
  if(n >= 1e6) s = '$'+(n/1e6).toFixed(n>=1e7?1:2).replace('.',',')+' M';
  else s = '$'+n.toLocaleString('es-AR');
  return (neg?'−':'')+s;
}
function M(x){ return Math.round(x * TIERS[G.p.tier].money / 50) * 50 || 50; }
function countryOf(cc){ return COUNTRIES.find(c=>c.c===cc) || COUNTRIES[0]; }

/* ---------------------------------------------------------
   SONIDO — sintetizado con WebAudio (sin archivos)
   --------------------------------------------------------- */
const SFX = (()=>{
  let ctx = null, master = null, gesture = false;
  const arm = ()=>{ gesture = true; };
  window.addEventListener('pointerdown', arm, true); window.addEventListener('keydown', arm, true);
  function ac(){
    if(!sfxOn() || !gesture) return null;
    try{
      if(!ctx){ ctx = new (window.AudioContext||window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = .55; master.connect(ctx.destination); }
      if(ctx.state==='suspended') ctx.resume();
    }catch(e){ return null; }
    return ctx;
  }
  function tone(f, dur, type='sine', vol=.25, f2=null, delay=0){
    const c = ac(); if(!c) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t+dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.01); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.02);
  }
  let noiseBuf = null;
  function noise(dur, vol=.3, freq=1200, type='lowpass', delay=0, q=.8){
    const c = ac(); if(!c) return;
    if(!noiseBuf){ noiseBuf = c.createBuffer(1, c.sampleRate*1.5, c.sampleRate); const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
    const t = c.currentTime + delay, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+dur+.02);
  }
  return {
    unlock(){ ac(); },
    tap(){ tone(660,.05,'triangle',.12); },
    hit(){ noise(.14,.55,900); tone(110,.16,'sine',.5,45); },
    crit(){ noise(.22,.7,1400); tone(90,.25,'sine',.6,35); tone(1320,.12,'triangle',.12,null,.02); },
    whiff(){ noise(.22,.18,2600,'bandpass',0,1.2); },
    block(){ tone(240,.08,'square',.12); noise(.08,.3,3000,'highpass'); },
    hurt(){ noise(.2,.6,500); tone(70,.3,'sawtooth',.25,40); },
    tick(){ tone(1800,.025,'square',.06); },
    card(){ noise(.12,.18,4000,'highpass'); tone(880,.06,'triangle',.08,1320); },
    coin(){ tone(1320,.07,'square',.08); tone(1760,.12,'square',.08,null,.07); },
    good(){ [523,659,784].forEach((f,i)=>tone(f,.14,'triangle',.16,null,i*.07)); },
    great(){ [523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.18,null,i*.08)); noise(.9,.12,1800,'bandpass',.25,.6); },
    bad(){ [392,330,262].forEach((f,i)=>tone(f,.18,'sawtooth',.09,null,i*.09)); },
    bell(){ [0,.32].forEach(d=>{ tone(1180,1.1,'sine',.22,null,d); tone(2360,.6,'sine',.08,null,d); tone(1770,.8,'sine',.05,null,d); }); },
    crowd(){ noise(1.6,.22,900,'bandpass',0,.5); noise(1.2,.12,2200,'bandpass',.1,.7); },
    simon(i){ tone([392,523,330,262][i]||440,.28,'triangle',.22); },
    buzz(){ tone(110,.35,'sawtooth',.18); },
    spin(){ tone(300,.05,'square',.05); },
    whoosh(){ noise(.3,.25,700,'bandpass',0,.7); },
  };
})();

/* efectos de pantalla */
function flashScreen(kind){ const f=$('flash'); if(!f) return; f.className=''; void f.offsetWidth; f.className=kind; }
function shake(el){ el = el || $('app'); if(!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function popText(host, text, kind, extra){
  if(!host) return;
  const d = document.createElement('div');
  d.className = 'pop '+(kind||'')+(extra?' '+extra:'');
  d.textContent = text;
  host.appendChild(d);
  setTimeout(()=>d.remove(), 950);
}
function confetti(n=90, colors){
  colors = colors || ['#3bf07a','#f2c94c','#ffffff','#ff2e46','#4aa8ff'];
  for(let i=0;i<n;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = rand(0,100)+'vw';
    c.style.background = choice(colors);
    c.style.setProperty('--dx', rand(-120,120)+'px');
    c.style.setProperty('--rot', rand(-720,720)+'deg');
    c.style.animationDuration = rand(1.8,3.4)+'s';
    c.style.animationDelay = rand(0,.5)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 4200);
  }
}

let G = null;               // la partida (se guarda en localStorage)
