function ovrOf(s){
  const f = [s.striking, s.wrestling, s.sumision].sort((a,b)=>b-a);
  return clamp(Math.round(.42*f[0] + .18*f[1] + .10*f[2] + .15*s.cardio + .15*s.chin), 1, 99);
}
function bestStat(p){ return ['striking','wrestling','sumision'].reduce((a,b)=>p[b]>p[a]?b:a); }
function ovrClass(o){ return o>=90?'t4':o>=80?'t3':o>=70?'t2':o>=58?'t1':''; }
function orgIdOf(p, tier){ return p.orgChain[tier===undefined?p.tier:tier]; }
function orgShort(p, tier){ return ORGS[orgIdOf(p,tier)].short; }
function wcOf(p){ return WEIGHT_CLASSES.find(w=>w.id===p.wc) || WEIGHT_CLASSES[3]; }
function seasonYear(){ return G.startYear + G.season; }

function genName(cont){ const b = NAME_BANKS[cont] || NAME_BANKS.SA; return choice(b.f)+' '+choice(b.l); }
function genPerson(cont){
  const c = cont || choice(Object.keys(NAME_BANKS));
  const pool = COUNTRIES.filter(x=>x.cont===c);
  return {name:genName(c), cc:choice(pool).c};
}
function makeStats(target, spec){
  spec = spec || choice(['striking','wrestling','sumision']);
  const others = shuffle(['striking','wrestling','sumision'].filter(k=>k!==spec));
  const s = {};
  s[spec] = target + randi(3,7); s[others[0]] = target - randi(2,7); s[others[1]] = target - randi(4,10);
  s.cardio = target + randi(-4,3); s.chin = target + randi(-4,3);
  for(let it=0; it<4; it++){ const diff = target - ovrOf(s); if(!diff) break; STAT_KEYS.forEach(k=>s[k]+=diff); }
  STAT_KEYS.forEach(k=>s[k]=clamp(Math.round(s[k]),12,99));
  return {...s, spec, ovr:ovrOf(s)};
}
function makeOpp(target, ident, spec){
  const id = ident || genPerson();
  return {name:id.name, cc:id.cc, ...makeStats(Math.round(target), spec)};
}
function restat(f, target){ const n = makeStats(Math.round(target), f.spec); STAT_KEYS.forEach(k=>f[k]=n[k]); f.ovr = n.ovr; return f; }

/* ---------- ranking: lista de 15 contendientes + campeón por organización ---------- */
function rankOvr(tier, r){ const T=TIERS[tier]; return lerp(T.r15, T.r1, (15-r)/14); }
function listKey(p, tier){ return orgIdOf(p, tier)+'_'+p.wc; }
function getList(p, tier){
  tier = tier===undefined ? p.tier : tier;
  const key = listKey(p, tier);
  if(!G.lists[key]) G.lists[key] = tier===2 ? ufcList(p.wc) : genList(tier, p.cont);
  return G.lists[key];
}
function genList(tier, cont){
  const T = TIERS[tier];
  const champ = makeOpp(randi(T.champ[0], T.champ[1]), genPerson(Math.random()<.5?cont:null));
  const L = [];
  for(let r=1;r<=15;r++) L.push(makeOpp(rankOvr(tier,r)+rand(-1.5,1.5), genPerson(Math.random()<.45?cont:null)));
  return {champ, L};
}
function ufcList(wc){
  const ros = UFC_ROSTER[wc] || UFC_ROSTER.ligero;
  const all = ros.map(r=>({name:r[0], cc:r[1], ...makeStats(ufcPow(r[2]))}));
  while(all.length<16) all.push(ufcProspect());
  return {champ:all[0], L:all.slice(1,16)};
}
function ufcPow(v){ return Math.round(60 + (v-60)*.9); }   /* el roster real, comprimido a la escala del juego */
function ufcProspect(){ const id = genPerson(); return {name:choice(UFC_PROSPECTS), cc:id.cc, ...makeStats(randi(76,80))}; }
/* el jugador ocupa el puesto p.rank: se muestra antes de L[p.rank-1] */
function dispRank(i){ const p=G.p; return (p.rank && !p.champ && i+1>=p.rank) ? i+2 : i+1; }
function rankLabel(p){ p = p||G.p; return p.champ ? 'CAMPEÓN' : (p.rank ? '#'+p.rank : 'Sin ranking'); }
function findInList(lst, name){ return lst.L.findIndex(f=>f.name===name); }

/* ---------- el jugador ---------- */
function newPlayer(cfg){
  const c = countryOf(cfg.cc);
  const s = {striking:40, wrestling:40, sumision:40, cardio:46, chin:46};
  s[cfg.style] = 58;
  if(cfg.style==='striking') s.chin += 4;
  if(cfg.style==='wrestling') s.cardio += 4;
  if(cfg.style==='sumision') s.wrestling += 4;
  if(cfg.persona==='guerrero') s.chin += 8;
  STAT_KEYS.forEach(k=>s[k] += randi(-1,1));
  const p = {
    name:cfg.name, cc:c.c, countryName:c.n, cont:c.cont, wc:cfg.wc, style:cfg.style, persona:cfg.persona,
    ...s, age:21, fame:5, fans:20, money:1000, earned:1000,
    orgChain:ORG_CHAIN[c.cont], tier:0, rank:null, champ:false,
    record:{w:0,l:0}, ko:0, sub:0, streakL:0,
    titles:[], defenses:0, defByTier:[0,0,0], ufcDef:0, double:false, firstUfcAge:null,
    amuletos: cfg.persona==='cabulero' ? 3 : 0, arenga:1,
    peak:0, flags:{}, rival:null,
  };
  p.peak = ovrOf(p);
  return p;
}
function makeRival(p){
  const same = Math.random()<.65;
  let id = same ? {name:genName(p.cont), cc:p.cc} : genPerson(p.cont);
  if(id.name===p.name) id.name = genName(p.cont);
  return {name:id.name, cc:id.cc, nick:choice(NICKS), ovr:ovrOf(p)+randi(0,3), spec:choice(['striking','wrestling','sumision']),
          tier:0, w:0, l:0, titles:0, champOf:null, retired:false, h2hW:0, h2hL:0};
}

function newGame(cfg){
  G = { v:2, startYear:new Date().getFullYear(), season:0, p:newPlayer(cfg), lists:{}, timeline:[], pending:[], forced:null,
        step:'card', cards:null, event:null, evRes:null, seasonRes:null, big:null, lastBig:null, yearLog:null,
        usedEvents:[], usedTrash:[], seenGames:{}, bigCount:0, lastGames:[], picantes:0, retireAsk:false };
  G.p.rival = makeRival(G.p);
  startSeason(true);
}

/* ---------- crecimiento natural por edad ---------- */
function growthPoints(age, persona){
  const a = age + (persona==='guerrero' && age>=30 ? 1 : 0);
  if(a<=23) return 8; if(a<=26) return 6; if(a<=28) return 4; if(a<=30) return 2; if(a<=32) return 0;
  if(a<=34) return -3; if(a<=36) return -5; return -7;
}
function applyGrowth(p){
  const pts = growthPoints(p.age, p.persona), out = {};
  for(let i=0;i<Math.abs(pts);i++){
    const k = pts>0 ? (Math.random()<.4 ? p.style : choice(STAT_KEYS)) : (Math.random()<.5 ? choice(['cardio','chin']) : choice(STAT_KEYS));
    const b = p[k]; p[k] = clamp(p[k]+Math.sign(pts), 10, 99);
    if(p[k]!==b) out[k] = (out[k]||0) + Math.sign(pts);
  }
  return out;
}

/* ---------- el mundo sigue: rival, campeones, retiros ---------- */
function news(t){ if(G.yearLog) G.yearLog.news.push(t); }
function rivalTick(){
  const p = G.p, r = p.rival;
  if(!r || r.retired) return;
  const a = p.age;
  const g = a<=22?randi(3,6) : a<=25?randi(2,4) : a<=28?randi(0,3) : a<=31?randi(-1,1) : a<=34?randi(-3,0) : randi(-5,-2);
  r.ovr = clamp(r.ovr+g, 30, 96);
  const n = r.tier===2 ? 2 : 3;
  for(let i=0;i<n;i++){ if(Math.random() < winProb(r.ovr, rankOvr(r.tier, 8))) r.w++; else r.l++; }
  const T = TIERS[r.tier];
  if(r.tier<2 && r.ovr >= T.champ[0]-2 && Math.random()<.5){
    r.tier++; r.champOf = null;
    news(`${r.name} firmó con ${orgShort(p, r.tier)}.`);
  } else if(r.champOf===null && r.ovr >= T.champ[0]-4 && Math.random()<.33){
    if(!(r.tier===p.tier && p.champ)){ r.titles++; r.champOf = r.tier; news(`😤 Tu rival ${r.name} ganó el título de ${orgShort(p, r.tier)}.`); }
  } else if(r.champOf!==null && Math.random()<.22){
    r.champOf = null; news(`${r.name} perdió su cinturón.`);
  }
  if(a>=36 && Math.random()<.3){ r.retired = true; r.champOf = null; news(`${r.name}, tu rival de toda la vida, anunció su retiro.`); }
}
/* si el rival está en tu organización, aparece en tu ranking (o como campeón) */
function syncRival(){
  const p = G.p, r = p.rival;
  Object.values(G.lists).forEach(lst=>{
    const i = lst.L.findIndex(f=>f.isRival); if(i>=0) lst.L.splice(i,1);
    if(lst.champ && lst.champ.isRival){ lst.champ = lst.L.shift(); }
    while(lst.L.length<15) lst.L.push(makeOpp(lst.L.length ? lst.L[lst.L.length-1].ovr-1 : 60));
  });
  if(!r || r.retired || r.tier!==p.tier) return;
  const lst = getList(p);
  const f = {name:r.name, cc:r.cc, nick:r.nick, isRival:true, ...makeStats(r.ovr, r.spec)};
  if(r.champOf===p.tier && !p.champ){
    if(lst.champ) lst.L.unshift(lst.champ);
    lst.champ = f;
  } else {
    if(r.champOf===p.tier) r.champOf = null;
    let idx = lst.L.findIndex(x=>x.ovr < f.ovr); if(idx<0) idx = lst.L.length;
    lst.L.splice(idx, 0, f);
  }
  lst.L = lst.L.slice(0,15);
}
function worldTick(){
  const p = G.p, lst = getList(p);
  lst.L.forEach(f=>{ if(!f.isRival) restat(f, f.ovr + rand(-1.2,1.4)); });
  if(lst.champ && !lst.champ.isRival) restat(lst.champ, clamp(lst.champ.ovr + rand(-1.5,1), TIERS[p.tier].champ[0]-2, 97));
  if(!p.champ && lst.champ && !lst.champ.isRival && Math.random()<.2){
    const ch = lst.L[0];
    if(ch && !ch.isRival){ news(`${ch.name} le ganó el título a ${lst.champ.name}.`); lst.L.splice(0,1); lst.L.splice(randi(1,3),0,lst.champ); lst.champ = ch; }
  }
  if(Math.random()<.55){
    const i = randi(5,14), gone = lst.L[i];
    if(gone && !gone.isRival){
      lst.L.splice(i,1);
      const nu = p.tier===2 ? ufcProspect() : makeOpp(rankOvr(p.tier,14), genPerson());
      lst.L.push(nu);
      news(p.tier===2 ? `${gone.name} se retiró. Debuta ${nu.name}.` : `${gone.name} dejó la organización.`);
    }
  }
  lst.L.sort((a,b)=>b.ovr-a.ovr);
  syncRival();
}

/* ---------- temporada ---------- */
function startSeason(first){
  const p = G.p;
  if(!first){ p.age++; G.season++; }
  G.yearLog = {year:seasonYear(), age:p.age, w:0, l:0, ovr0:ovrOf(p), rank0:rankLabel(p), tier0:p.tier, money0:p.money, news:[], notes:[]};
  G.growth = first ? {} : applyGrowth(p);
  if(!first){ rivalTick(); worldTick(); } else syncRival();
  G.cards = drawCards(); G.picked = null;
  G.event = null; G.evRes = null; G.seasonRes = null; G.big = null; G.skipSeason = false;
  G.prevBig = G.lastBig; G.lastBig = null; G.lastFight = null;
  G.retireAsk = false;
  G.step = 'card';
  p.peak = Math.max(p.peak, ovrOf(p));
}
function drawCards(){
  const p = G.p, hab = p.persona==='habilidoso', n = hab ? 4 : 3, out = [];
  const pool = CARDS.filter(c=>!c.cond || c.cond(p));
  let guard = 0;
  while(out.length<n && guard++<200){
    const r = Math.random();
    const rar = r>0.95 ? 'l' : r>0.78 ? 'e' : r>0.45 ? 'r' : 'c';
    const opts = pool.filter(c=>c.r===rar && !out.includes(c));
    if(opts.length) out.push(choice(opts));
  }
  return out.map(c=>c.id);
}
function cardById(id){ return CARDS.find(c=>c.id===id); }
function cardCost(c){ return c.cost ? c.cost[G.p.tier] : 0; }
function cardFx(c){
  if(c.fx) return c.fx;
  if(c.fxf) return c.fxf(G.p);
  return Object.entries(c.g).map(([k,v])=>`<span class="${v<0?'neg':''}">${v>0?'+':''}${v} ${STAT_SHORT[k]}</span>`).join(' ');
}
function applyCard(id){
  const p = G.p, c = cardById(id), cost = cardCost(c);
  if(cost && p.money < cost) return false;
  p.money -= cost;
  if(c.g) Object.entries(c.g).forEach(([k,v])=>{ p[k] = clamp(p[k]+v, 10, 99); });
  if(c.fn) c.fn(p);
  G.picked = id;
  G.statFlash = c.g ? Object.assign({}, c.g) : {};
  p.peak = Math.max(p.peak, ovrOf(p));
  return true;
}
/* después de la carta: evento (o no) → temporada */
function afterCard(){
  G.event = drawEvent();
  if(G.event){ G.step = 'event'; }
  else playSeason();
}
function drawEvent(){
  const p = G.p;
  if(G.pending.length) return {special:G.pending.shift()};
  if(Math.random() > .68) return null;
  const pool = EVENTS.filter(e=>{
    if(e.persona && e.persona!==p.persona) return false;
    if(e.cond && !e.cond(p)) return false;
    if(G.usedEvents.includes(e.id)) return false;
    if((e.id==='redes'||e.id==='lesionrival') && (!p.rival || p.rival.retired)) return false;
    return true;
  });
  const persOwn = pool.filter(e=>e.persona===p.persona);
  const ev = (persOwn.length && Math.random()<.35) ? choice(persOwn) : choice(pool);
  if(!ev) return null;
  G.usedEvents.push(ev.id); if(G.usedEvents.length>28) G.usedEvents.shift();
  return {id:ev.id};
}
function evText(s){
  const p = G.p;
  return String(s).replace(/\{rival\}/g, p.rival ? p.rival.name : 'Tu rival').replace(/\{org\}/g, orgShort(p, Math.min(2,p.tier+1))).replace(/\{me\}/g, p.name);
}
function specialChoices(kind){
  const p = G.p;
  const next = orgShort(p, Math.min(2, p.tier+1));
  switch(kind){
    case 'oferta1': return [
      {t:`Firmar con ${next}`, h:'💰⭐📈', fx:()=>{ const wasChamp = p.champ; vacate(); moveTier(1, wasChamp?randi(11,13):null); return {fame:4, r:`Nueva casa: ${next}. Los rivales ahora son otra cosa.`}; }},
      {t:'Quedarme a defender el título', h:'❤️💰', fx:()=>{ p.flags.declines = (p.flags.declines||0)+1; return {fans:6, money:M(1500), r:'Tu gente te lo agradece. La oferta quizás vuelva.'}; }}].slice(0, (p.flags.declines||0)>=2 ? 1 : 2);
    case 'oferta2': return [
      {t:'¡Firmar con la UFC!', h:'👑💰⭐', fx:()=>{ const wasChamp = p.champ; vacate(); moveTier(2, wasChamp?randi(11,13):null); return {fame:8, fans:5, r:'Firmaste con la UFC. De chico lo soñabas. Ahora es real.'}; }},
      {t:'Quedarme donde soy rey', h:'❤️💰', fx:()=>{ p.flags.declines = (p.flags.declines||0)+1; return {fans:5, money:M(2000), r:'Seguís siendo el rey de tu casa.'}; }}].slice(0, (p.flags.declines||0)>=2 ? 1 : 2);
    case 'dwcs': return [
      {t:'Voy a la Serie', h:'🌟🎲', fx:()=>{ G.forced='dwcs'; p.flags.dwcsDone = true; return {r:'La pelea grande del año va a ser en la Serie de Contendientes. Todo o nada.'}; }},
      {t:'Sigo mi camino', h:'📈', fx:()=>{ p.flags.dwcsDone = true; return {fans:2, r:'Paso a paso. La UFC puede esperar.'}; }}];
    case 'shortnotice': return [
      {t:'¡Acepto!', h:'🏆🎲', fx:()=>{ G.forced='title'; return {fame:3, r:'Sin campamento, pero con hambre. Vas por el título.'}; }},
      {t:'No, sin campamento no', h:'', fx:()=>({r:'Prudencia. Ya va a llegar tu chance.'})}];
    case 'doble': return [
      {t:'Voy por el segundo cinturón', h:'💎🎲', fx:()=>{ G.forced='doble'; p.flags.dobleTried = true; return {fame:5, r:'Subís de división. Si ganás, hacés historia.'}; }},
      {t:'Defiendo el mío', h:'❤️', fx:()=>{ p.flags.dobleTried = true; return {fans:3, r:'Un cinturón bien defendido vale más que dos.'}; }}];
    case 'cortado': return [
      {t:'Volver a empezar desde abajo', h:'📉', fx:()=>{ moveTier(p.tier-1, randi(6,9)); p.streakL = 0; return {fame:-8, r:`Otra vez en ${orgShort(p)}. Los grandes se levantan.`}; }}];
  }
  return [];
}
function eventView(){
  const e = G.event; if(!e) return null;
  if(e.special){
    const s = SPECIALS[e.special];
    let text = evText(s.text);
    if((e.special==='oferta1'||e.special==='oferta2') && (G.p.flags.declines||0)>=2) text += ' Ya no quedan rivales para vos en tu liga: esta vez no hay vuelta atrás.';
    return {who:s.who, wn:evText(s.wn), role:s.role, text, choices:specialChoices(e.special), special:true};
  }
  const ev = EVENTS.find(x=>x.id===e.id);
  return {who:ev.who, wn:evText(ev.wn), role:ev.role, text:evText(ev.text), choices:[ev.a, ev.b]};
}
function chooseEvent(i){
  const v = eventView(); if(!v || G.evRes) return;
  const ch = v.choices[i]; if(!ch) return;
  const d = ch.fx(G.p) || {};
  G.evRes = {text:d.r || '', chips:applyDelta(d), choice:ch.t};
}
function applyDelta(d){
  const p = G.p, chips = [];
  if(d.money){ p.money += d.money; if(d.money>0) p.earned += d.money; chips.push({t:(d.money>0?'+':'')+fmtMoney(d.money), c:d.money>0?'gold':'red'}); }
  if(d.fame){ const b=p.fame; p.fame = clamp(p.fame+d.fame,0,100); if(p.fame!==b) chips.push({t:`${d.fame>0?'+':''}${p.fame-b} ⭐ Fama`, c:d.fame>0?'green':'red'}); }
  if(d.fans){ const b=p.fans; p.fans = clamp(p.fans+d.fans,0,100); if(p.fans!==b) chips.push({t:`${d.fans>0?'+':''}${p.fans-b} ❤️ Hinchada`, c:d.fans>0?'green':'red'}); }
  STAT_KEYS.forEach(k=>{ if(d[k]){ const b=p[k]; p[k]=clamp(p[k]+d[k],10,99); if(p[k]!==b) chips.push({t:`${d[k]>0?'+':''}${p[k]-b} ${STAT_SHORT[k]}`, c:d[k]>0?'green':'red'}); } });
  if(d.amuletos){ const b=p.amuletos; p.amuletos = Math.max(0,p.amuletos+d.amuletos); if(p.amuletos!==b) chips.push({t:`${d.amuletos>0?'+':''}${p.amuletos-b} 🍀 Amuleto`, c:d.amuletos>0?'green':'red'}); }
  if(d.skipSeason){ G.skipSeason = true; chips.push({t:'🩹 Te perdés la temporada', c:'red'}); }
  if(d.scouted){ p.flags.scouted = true; chips.push({t:'🎯 Próxima pelea grande más fácil', c:'green'}); }
  if(d.promise){ p.flags.promise = true; chips.push({t:'🏆 Si ganás, vas por el título', c:'gold'}); }
  if(STAT_KEYS.some(k=>d[k])) G.statFlash = Object.fromEntries(STAT_KEYS.filter(k=>d[k]).map(k=>[k,d[k]]));
  p.peak = Math.max(p.peak, ovrOf(p));
  return chips;
}
function vacate(){
  const p = G.p;
  if(!p.champ) return;
  const lst = getList(p);
  lst.champ = lst.L.shift(); lst.L.push(makeOpp(rankOvr(p.tier,15)));
  p.champ = false;
}
function moveTier(t, rank){
  const p = G.p;
  if(t>p.tier && p.persona==='cabulero'){ p.amuletos++; if(G.yearLog) G.yearLog.news.push('🍀 Cábala nueva para la liga nueva: +1 amuleto.'); }
  p.tier = clamp(t,0,2); p.champ = false; p.rank = rank || null; p.streakL = 0;
  if(p.tier===2) p.flags.ufc = true;
  p.flags.declines = 0;
  syncRival();
}

/* ---------- peleas de la temporada (simuladas) ---------- */
function winProb(a, b){ return clamp(sigmoid((a-b)/6.5), .04, .96); }
const KO_HOW = ['gancho de izquierda','patada a la cabeza','rodillazo volador','cross de derecha','uppercut','codazo giratorio'];
const SUB_HOW = ['mata león','guillotina','armbar','triangular','kimura','D\'Arce'];
const TKO_HOW = ['golpes en el piso','ground & pound','parada médica','lluvia de golpes'];
function methodFor(winner, loserOvr, winnerOvr, heavy){
  let fin = .42 + (winnerOvr-loserOvr)/70 + (heavy?.12:0);
  if(Math.random() >= clamp(fin,.2,.82)) return {m:Math.random()<.72?'Decisión unánime':'Decisión dividida', how:'3 rounds'};
  const r = Math.random(), s = winner;
  const rd = 'R'+randi(1,3);
  if(s==='striking') return r<.78 ? {m:'KO', how:choice(KO_HOW)+' · '+rd} : {m:'TKO', how:choice(TKO_HOW)+' · '+rd};
  if(s==='sumision') return r<.75 ? {m:'Sumisión', how:choice(SUB_HOW)+' · '+rd} : {m:'TKO', how:choice(TKO_HOW)+' · '+rd};
  return r<.5 ? {m:'TKO', how:choice(TKO_HOW)+' · '+rd} : r<.8 ? {m:'Sumisión', how:choice(SUB_HOW)+' · '+rd} : {m:'KO', how:choice(KO_HOW)+' · '+rd};
}
function simOpponent(){
  const p = G.p, lst = getList(p), T = TIERS[p.tier];
  if(p.champ){ const i = randi(3,10); return {...lst.L[i], dispRank:i+1}; }
  if(p.rank && Math.random()<.65){
    const i = clamp(p.rank-1+randi(0,4), 0, 14);
    const f = lst.L[i];
    if(f && !f.isRival) return {...f, dispRank:dispRank(i)<=15?dispRank(i):null};
  }
  const base = p.rank ? rankOvr(p.tier, Math.min(15, p.rank+4)) : rand(T.unr[0], T.unr[1]);
  return {...makeOpp(base + rand(-2,2)), dispRank:null};
}
function playSeason(){
  const p = G.p, res = [];
  const n = G.skipSeason ? 0 : TIERS[p.tier].sims;
  for(let i=0;i<n;i++){
    const opp = simOpponent();
    const me = ovrOf(p);
    const win = Math.random() < winProb(me, opp.ovr);
    const heavy = !!wcOf(p).heavy;
    const mm = win ? methodFor(p.style, opp.ovr, me, heavy) : methodFor(opp.spec, me, opp.ovr, heavy);
    const out = applyResult(opp, win, mm.m, 'sim');
    res.push({opp, win, m:mm.m, how:mm.how, rank:out.rank, money:out.money});
  }
  G.seasonRes = res;
  G.step = 'season';
}

/* ---------- pelea grande del año ---------- */
const TITLE_KINDS = ['title','defense','dwcs','doble'];
function setupBig(){
  const p = G.p, lst = getList(p);
  let type, opp;
  const forced = G.forced; G.forced = null;
  if(forced==='dwcs'){
    type = 'dwcs'; opp = {...makeOpp(randi(70,74), genPerson()), dispRank:null};
  } else if(forced==='doble'){
    const i = WEIGHT_CLASSES.findIndex(w=>w.id===p.wc);
    const other = WEIGHT_CLASSES[i<WEIGHT_CLASSES.length-1 ? i+1 : i-1];
    const r = UFC_ROSTER[other.id][0];
    type = 'doble'; opp = {name:r[0], cc:r[1], ...makeStats(ufcPow(r[2])+3), dispRank:'C', otherWc:other.n};
  } else if(p.champ){
    type = 'defense';
    const top = lst.L.slice(0,3), rv = top.find(f=>f.isRival);
    const f = (rv && Math.random()<.6) ? rv : choice(top);
    opp = {...f, dispRank:lst.L.indexOf(f)+1};
  } else if(forced==='title' || p.flags.promise2 || (p.rank && p.rank<=3)){
    p.flags.promise2 = false;
    type = 'title'; opp = {...lst.champ, dispRank:'C'};
  } else {
    const rv = lst.L.find(f=>f.isRival);
    if(rv && Math.random() < (G.lastClasico===G.season-1 ? .08 : .3)){ type = 'clasico'; G.lastClasico = G.season; const i=lst.L.indexOf(rv); opp = {...rv, dispRank:dispRank(i)<=15?dispRank(i):null}; }
    else {
      type = 'estelar';
      const i = p.rank ? Math.max(0, p.rank-1-randi(3,5)) : randi(5,9);
      opp = {...lst.L[i], dispRank:dispRank(i)<=15?dispRank(i):null};
      if(opp.isRival){ type = 'clasico'; G.lastClasico = G.season; }
    }
  }
  G.big = {type, opp, rounds:(TITLE_KINDS.includes(type) && (p.tier===2 || type==='doble')) ? 3 : 1, shortNotice:forced==='title'};
  G.step = 'preview';
}
function bigLabel(b){
  const p = G.p, org = orgShort(p);
  return ({title:`⭐ PELEA POR EL TÍTULO · ${org}`, defense:`👑 DEFENSA DEL TÍTULO · ${org}`, dwcs:'🌟 SERIE DE CONTENDIENTES', doble:`💎 POR EL SEGUNDO CINTURÓN · ${b.opp.otherWc||''}`,
           clasico:'🔥 EL CLÁSICO', estelar:`PELEA ESTELAR · ${org}`})[b.type] || 'PELEA DEL AÑO';
}

/* ---------- aplicar el resultado de cualquier pelea ---------- */
function applyResult(opp, win, method, kind){
  const p = G.p, T = TIERS[p.tier], big = kind!=='sim';
  const finish = !/Decisi/.test(method);
  const out = {win, method, kind, opp, finish, notes:[], money:0, fame:0, fans:0, rank:null, org:orgShort(p)};
  if(win){ p.record.w++; G.yearLog.w++; p.streakL = 0; if(method==='Sumisión') p.sub++; else if(finish) p.ko++; }
  else { p.record.l++; G.yearLog.l++; p.streakL++; }
  /* plata */
  let purse = big ? rand(T.big[0], T.big[1]) : rand(T.purse[0], T.purse[1]);
  if(['title','defense','doble'].includes(kind)) purse *= 2.3;
  if(kind==='dwcs') purse = 25000;
  if(!win) purse *= .45;
  if(p.persona==='bocon') purse *= 1.5;
  purse = Math.round(purse/100)*100;
  if(p.tier===2 && big && win && finish && Math.random()<.6){ purse += 50000; out.notes.push({t:'💥 Actuación de la Noche: +'+fmtMoney(50000), c:'gold'}); }
  p.money += purse; p.earned += purse; out.money = purse;
  /* fama e hinchada */
  let fame = (big ? (win?5:-3) : (win?2:-1)) * T.fame;
  if(win && finish) fame += big ? 2 : 1;
  if(win && TITLE_KINDS.includes(kind)) fame += 10;
  if(p.persona==='bocon') fame *= fame>0 ? 1.5 : 2;
  const fb = p.fame; p.fame = clamp(p.fame+Math.round(fame),0,100); out.fame = p.fame-fb;
  let fans = big ? (win?3:-2) : (win?1:0);
  if(win && TITLE_KINDS.includes(kind)) fans += 6;
  if(opp.isRival) fans += win ? 6 : -3;
  if(p.persona==='guerrero' && fans>0) fans = Math.round(fans*1.5);
  const nb = p.fans; p.fans = clamp(p.fans+fans,0,100); out.fans = p.fans-nb;
  /* ranking y títulos */
  const lst = getList(p);
  const oi = findInList(lst, opp.name);
  if(kind==='title'){
    if(win){
      const old = lst.champ;
      if(old && !old.isRival){ lst.L.unshift(old); lst.L = lst.L.slice(0,15); }
      if(old && old.isRival){ p.rival.champOf = null; lst.L.unshift(old); lst.L = lst.L.slice(0,15); }
      lst.champ = null; p.champ = true; p.rank = null;
      p.titles.push({tier:p.tier, org:orgShort(p), year:seasonYear(), age:p.age});
      if(p.tier===2 && !p.firstUfcAge) p.firstUfcAge = p.age;
      if(F && F.hist && F.hist[0] && F.hist[0].res==='l') p.flags.remontada = true;
      out.notes.push({t:`🏆 ¡Campeón de ${orgShort(p)}!`, c:'gold'});
      if(p.persona==='cabulero'){ p.amuletos++; out.notes.push({t:'🍀 +1 amuleto: esta cábala funciona', c:'green'}); }
      out.belt = true;
    } else { p.rank = randi(4,7); out.rank = {from:null, to:p.rank}; }
  } else if(kind==='defense'){
    if(win){ p.defenses++; p.defByTier[p.tier]++; if(p.tier===2) p.ufcDef++; out.notes.push({t:`🛡️ Defensa exitosa número ${p.defenses}`, c:'gold'});
      if(oi>=0){ const [f] = lst.L.splice(oi,1); lst.L.splice(Math.min(lst.L.length, oi+2),0,f); } }
    else {
      p.champ = false; p.rank = randi(1,2);
      if(oi>=0) lst.L.splice(oi,1);
      lst.champ = {...opp}; delete lst.champ.dispRank;
      if(opp.isRival){ p.rival.champOf = p.tier; p.rival.titles++; }
      while(lst.L.length<15) lst.L.push(makeOpp(rankOvr(p.tier,15)));
      out.notes.push({t:'💔 Perdiste el cinturón', c:'red'});
    }
  } else if(kind==='dwcs'){
    if(win){ p.flags.dwcs = true; vacate(); moveTier(2, null); out.notes.push({t:'🌟 ¡Te ganaste el contrato con la UFC!', c:'gold'}); }
    else out.notes.push({t:'La puerta de la UFC se cerró… por ahora.', c:'red'});
  } else if(kind==='doble'){
    if(win){ p.double = true; p.titles.push({tier:2, org:'UFC · '+(opp.otherWc||'2ª división'), year:seasonYear(), age:p.age}); out.notes.push({t:'💎 ¡DOBLE CAMPEÓN DE LA UFC!', c:'gold'}); out.belt = true; }
  } else if(!p.champ){
    const before = p.rank;
    if(win){
      let nr;
      if(opp.dispRank && opp.dispRank!=='C') nr = before ? Math.min(before, opp.dispRank) : opp.dispRank;
      else nr = before ? Math.max(1, before-1) : (big ? randi(9,11) : randi(11,14));
      if(finish && nr>1) nr--;
      if(before && nr>=before) nr = Math.max(1, before-1);
      if(big && p.flags.promise){ nr = 1; p.flags.promise2 = true; out.notes.push({t:'🏆 Promesa cumplida: vas por el título', c:'gold'}); }
      p.rank = nr;
      if(oi>=0 && opp.dispRank && nr<=opp.dispRank){ const [f] = lst.L.splice(oi,1); lst.L.splice(Math.min(lst.L.length, oi+1),0,f); }
    } else if(before){ const nr = before + randi(1,3); p.rank = nr>15 ? null : nr; }
    if(big) p.flags.promise = false;
    out.rank = {from:before, to:p.rank};
  }
  /* rival */
  if(opp.isRival && p.rival){ if(win) p.rival.h2hW++; else p.rival.h2hL++; }
  if(win && p.age>=37) p.flags.lobo = true;
  p.peak = Math.max(p.peak, ovrOf(p));
  return out;
}

/* ---------- fin de temporada ---------- */
const NEWSPAPERS = ['DIARIO OCTÓGONO','LA PIÑA DEPORTIVA','EL CRONISTA DE LA JAULA','TODO MMA','GUANTE DE ORO'];
function makeHeadline(){
  const p = G.p, lb = G.lastBig, ln = lastName(p.name), org = orgShort(p);
  if(G.skipSeason) return `${ln} pasó el año recuperándose`;
  if(!lb) return `${ln} suma rodaje en ${org}`;
  const on = lb.opp ? lastName(lb.opp.name) : '';
  if(lb.kind==='doble' && lb.win) return `¡HISTÓRICO! ${ln} es doble campeón de la UFC`;
  if(lb.kind==='title' && lb.win) return (p.tier===2 && NEVER_CHAMP.includes(p.cc)) ? `¡${ln}, el primer campeón de UFC de ${p.countryName}!` : choice([`¡${ln} es el nuevo campeón de ${lb.org}!`, `${ln} toca el cielo: campeón de ${lb.org}`]);
  if(lb.kind==='defense' && lb.win) return choice([`${ln} retiene el cinturón y agranda su leyenda`, `Nadie puede con ${ln}: otra defensa exitosa`]);
  if(lb.kind==='defense') return `Se terminó el reinado de ${ln}`;
  if(lb.kind==='dwcs') return lb.win ? `${ln} brilló en la Serie de Contendientes y firmó con la UFC` : `${ln} dejó pasar el tren de la UFC`;
  if(lb.kind==='doble') return `${ln} fue por el segundo cinturón y se quemó`;
  if(lb.opp && lb.opp.isRival) return lb.win ? `${ln} ganó el clásico ante ${on}` : `${on} se quedó con el clásico ante ${ln}`;
  if(lb.win && lb.finish) return `${ln} ${lb.method==='Sumisión'?'hizo rendir':'noqueó'} a ${on} y pide pista`;
  if(lb.win) return `${ln} le ganó a ${on} y sigue subiendo`;
  if(lb.kind==='title') return `${ln} se quedó en la puerta del título`;
  return `Golpe duro para ${ln}: cayó ante ${on}`;
}
function finishSeason(){
  const p = G.p, y = G.yearLog;
  y.ovr1 = ovrOf(p); y.rank1 = rankLabel(p); y.headline = makeHeadline(); y.paper = choice(NEWSPAPERS);
  y.money = p.money - y.money0; y.org = orgShort(p);
  y.gold = !!(G.lastBig && G.lastBig.win && TITLE_KINDS.includes(G.lastBig.kind) && G.lastBig.kind!=='dwcs');
  G.timeline.unshift({year:y.year, age:y.age, org:y.org, rank:y.rank1, w:y.w, l:y.l, h:y.headline, gold:y.gold});
  checkOffers();
  G.retireAsk = p.age>=34;
  G.step = 'yearEnd';
  save();
}
function checkOffers(){
  const p = G.p, ovr = ovrOf(p);
  G.pending = [];
  if(p.tier>0 && p.streakL>=3){ G.pending.push('cortado'); return; }
  if(p.tier===0 && p.champ && !p.flags.dwcsDone && p.fame>=38) G.pending.push('dwcs');
  else if(p.tier===0 && (p.champ || (p.rank && p.rank<=2 && ovr>=68)) && p.fame>=26) G.pending.push('oferta1');
  else if(p.tier===1 && (p.champ || (p.rank && p.rank<=2 && ovr>=84)) && p.fame>=48) G.pending.push('oferta2');
  else if(p.tier===2 && p.champ && p.defenses>=1 && !p.flags.dobleTried && !p.double && Math.random()<.3) G.pending.push('doble');
  else if(!p.champ && p.rank && p.rank>=3 && p.rank<=7 && Math.random()<.14) G.pending.push('shortnotice');
}
function nextSeason(){
  if(G.p.age>=39){ endCareer('age'); return; }
  startSeason(false);
  save();
}

/* ---------- retiro, logros y puntaje ---------- */
function careerSummary(){
  const p = G.p;
  return {name:p.name, cc:p.cc, country:p.countryName, persona:p.persona, style:p.style, wc:p.wc,
    w:p.record.w, l:p.record.l, ko:p.ko, sub:p.sub, titles:p.titles.slice(), def:p.defenses, ufcDef:p.ufcDef, double:p.double,
    ufcTitle:p.titles.some(t=>t.tier===2), tier:p.tier, reachedUfc:!!p.flags.ufc || p.tier===2, defByTier:(p.defByTier||[0,0,p.ufcDef]).slice(), peak:p.peak, fame:p.fame, fans:p.fans, earned:p.earned, money:p.money,
    firstUfcAge:p.firstUfcAge||0, age:p.age, rivalBeat:!!(p.rival && p.rival.h2hW>0), rival:p.rival, champ:p.champ, flags:p.flags, years:G.season+1};
}
function achievementsOf(c){
  const on = {};
  on.reg = c.titles.some(t=>t.tier===0);
  on.mun = c.titles.some(t=>t.tier===1);
  on.ufc = c.ufcTitle;
  on.double = c.double;
  on.def3 = c.def>=3;
  on.invicto = c.l===0 && c.w>=10;
  on.ko10 = c.ko>=10;
  on.sub8 = c.sub>=8;
  on.rival = c.rivalBeat;
  on.idolo = c.fans>=90;
  on.millon = c.earned>=1e6;
  on.dwcs = !!c.flags.dwcs;
  on.remontada = !!c.flags.remontada;
  on.lobo = !!c.flags.lobo;
  on.cima = c.champ && c.tier===2;
  on.pionero = c.ufcTitle && NEVER_CHAMP.includes(c.cc);
  return on;
}
function careerScore(c, achs){
  let s = c.w*8 - c.l*4 + (c.ko+c.sub)*4;
  c.titles.forEach(t=> s += [80,200,450][t.tier]);
  s += c.defByTier[0]*15 + c.defByTier[1]*35 + c.defByTier[2]*90;
  if(c.double) s += 300;
  s += Math.max(0, c.peak-60)*6 + c.fame + c.fans + Math.min(200, Math.round(c.earned/50000));
  s += Object.values(achs).filter(Boolean).length*25;
  if(c.rivalBeat) s += 50;
  return Math.max(0, Math.round(s));
}
/* el rango sale de lo que lograste; el puntaje ordena el salón de la fama */
function careerRank(sc, c){
  if(c.ufcTitle && (c.double || c.ufcDef>=3 || sc>=2300)) return {t:'LEYENDA DEL MMA', c:'var(--gold)', e:'👑', lv:6};
  if(c.ufcTitle) return {t:'CAMPEÓN DE LA UFC', c:'var(--gold)', e:'🏆', lv:5};
  if(c.reachedUfc) return {t:'PELEADOR DE UFC', c:'var(--neon)', e:'🥊', lv:4};
  if(c.titles.some(t=>t.tier===1)) return {t:'ESTRELLA INTERNACIONAL', c:'var(--neon)', e:'🌎', lv:3};
  if(c.titles.length) return {t:'ÍDOLO REGIONAL', c:'var(--text)', e:'⭐', lv:2};
  if(c.w>c.l) return {t:'PROFESIONAL', c:'var(--text)', e:'💪', lv:1};
  return {t:'SPARRING DE LUJO', c:'var(--text-dim)', e:'🥲', lv:0};
}
function legendOf(c){ return LEGENDS.find(l=>l.t(c)); }
function endCareer(reason){
  const c = careerSummary(), achs = achievementsOf(c), sc = careerScore(c, achs), rk = careerRank(sc, c), lg = legendOf(c);
  G.final = {c, achs, sc, rk, lg, reason};
  const hof = LS.get('idolo_mma_hof', []);
  const entry = {n:c.name, cc:c.cc, sc, rk:rk.t, lg:lg.n, pe:c.persona, rec:`${c.w}-${c.l}`, t:c.titles.length, d:Date.now()};
  hof.push(entry); hof.sort((a,b)=>b.sc-a.sc);
  LS.set('idolo_mma_hof', hof.slice(0,10));
  G.final.hofPos = hof.findIndex(h=>h===entry);
  LS.del('idolo_mma_save');
  G.step = 'end';
  UI.screen = 'end';
}
function save(){ if(G && G.step!=='end' && !UI.bot) LS.set('idolo_mma_save', G); }

/* =========================================================
   4. PELEA GRANDE — rounds que se definen con minijuegos
   ========================================================= */
function isLuck(){ return !!PERSONAS[G.p.persona].luck; }
function startBig(useArenga){
  const b = G.big, p = G.p;
  if(!b) return;
  F = {type:b.type, opp:b.opp, need:b.rounds===3?2:1, max:b.rounds, round:0, meW:0, opW:0, hist:[], used:[], hype:0,
       game:null, phase:null, shortNotice:!!b.shortNotice, scouted:!!p.flags.scouted};
  p.flags.scouted = false;
  G.bigCount++;
  if(useArenga && p.arenga>0 && !TITLE_KINDS.includes(b.type)){
    p.arenga--; F.arenga = true; SFX.crowd();
    return finishBig(true, Math.random()<.45 ? (p.style==='sumision' ? 'Sumisión' : 'KO') : 'Decisión unánime');
  }
  UI.screen = 'fight';
  if(p.persona==='bocon'){ F.phase = 'trash'; F.trash = pickTrash(); render(); return; }
  nextRound();
}
function pickTrash(){
  let pool = TRASH.map((t,i)=>i).filter(i=>!G.usedTrash.includes(i));
  if(!pool.length){ G.usedTrash = []; pool = TRASH.map((t,i)=>i); }
  const i = choice(pool); G.usedTrash.push(i);
  return {i, opts:shuffle(TRASH[i].o)};
}
function chooseTrash(k){
  if(!F || F.phase!=='trash' || F.trashRes) return;
  const q = k<0 ? 0 : F.trash.opts[k][1];
  F.hype = [-.3, .15, .5][q];
  F.trashRes = {q, k};
  if(q===2){ G.picantes++; G.p.fame = clamp(G.p.fame+2,0,100); SFX.crowd(); flashScreen('g'); }
  else if(q===0){ SFX.bad(); flashScreen('r'); }
  else SFX.good();
  render();
}
function pickGame(){
  const p = G.p;
  let pool;
  if(isLuck()) pool = LUCK_GAMES.slice();
  else if(F.max===1) pool = Math.random()<.6 ? STYLE_GAMES[p.style].slice() : SKILL_GAMES.slice();
  else if(F.round===0) pool = STYLE_GAMES[p.style].slice();
  else if(F.round===2) pool = STYLE_GAMES[F.opp.spec||'striking'].slice();
  else pool = SKILL_GAMES.slice();
  let opts = pool.filter(g=>!F.used.includes(g));
  if(F.round===0){ const fresh = opts.filter(g=>!G.lastGames.includes(g)); if(fresh.length) opts = fresh; }
  if(!opts.length) opts = pool;
  const g = choice(opts);
  F.used.push(g);
  if(F.round===0){ G.lastGames.push(g); if(G.lastGames.length>2) G.lastGames.shift(); }
  return g;
}
function nextRound(){
  F.game = pickGame(); F.phase = 'intro'; F.retry = false;
  render();
  if(UI.bot) setTimeout(beginRound, 20);
}
function roundDiff(gid){
  const p = G.p, o = F.opp, g = MG[gid];
  let mine, his;
  if(g.stat==='ovr'){ mine = ovrOf(p); his = o.ovr; }
  else if(g.stat==='defense'){ mine = p.chin*.4 + p.cardio*.3 + p.striking*.3; his = o.striking; }
  else { mine = p[g.stat]; his = o[g.stat]; }
  let d = (his - mine)/13;
  if(F.round>0) d += (o.cardio - p.cardio)/55;              // el cardio pesa en los rounds de campeonato
  if(G.bigCount<=2) d -= .55;                                // tus primeras peleas grandes son más amables
  if(F.round===0) d -= F.hype;                               // bocón: el cara a cara
  if(p.persona==='guerrero' && F.opW > F.meW) d -= .45;      // guerrero: se agranda cuando va abajo
  if(F.shortNotice) d += .3;
  if(F.scouted) d -= .3;
  if(wcOf(p).fast && ['bloqueo','zona','patada'].includes(gid)) d -= .12;
  return clamp(d, -1, 1.5);
}
function statsLine(gid){
  const p = G.p, o = F.opp, g = MG[gid];
  if(g.luck) return `TUS CHANCES: ${Math.round(luckP(roundDiff(gid))*100)}%`;
  if(g.stat==='ovr') return `TU OVR ${ovrOf(p)} · SU OVR ${o.ovr}`;
  if(g.stat==='defense') return `TU DEFENSA ${Math.round(p.chin*.4+p.cardio*.3+p.striking*.3)} · SU GOLPE ${o.striking}`;
  return `TU ${STAT_SHORT[g.stat]} ${p[g.stat]} · SU ${STAT_SHORT[g.stat]} ${o[g.stat]}`;
}
function diffLabel(d){
  if(d<-.5) return {t:'MUY FÁCIL', c:'var(--neon)'};
  if(d<-.15) return {t:'FÁCIL', c:'var(--neon)'};
  if(d<.25) return {t:'PAREJO', c:'var(--text)'};
  if(d<.7) return {t:'DIFÍCIL', c:'var(--gold)'};
  if(d<1.1) return {t:'MUY DIFÍCIL', c:'var(--orange)'};
  return {t:'BRUTAL', c:'var(--red)'};
}
function luckP(d){ return clamp(sigmoid(-1.05*d), .25, .88); }
function beginRound(){
  if(!F || F.phase!=='intro') return;
  G.seenGames[F.game] = true;
  F.phase = 'play';
  F.d = roundDiff(F.game);
  render();
  SFX.bell();
  mgRun(F.game, F.d);
}
/* tier: perfect · win · lose · zero (fallaste todo) · ko (te finalizaron) */
function roundDone(tier){
  if(!F || F.phase!=='play') return;
  const p = G.p;
  if(tier==='zero') tier = (p.persona!=='guerrero' && Math.random() < clamp(.28 + F.d*.22, .08, .6)) ? 'ko' : 'lose';
  if(tier==='ko' && p.persona==='guerrero') tier = 'lose';
  const res = (tier==='perfect'||tier==='win') ? 'w' : 'l';
  F.hist.push({g:F.game, tier, res});
  if(res==='w') F.meW++; else F.opW++;
  F.phase = 'roundEnd'; F.last = tier;
  if(tier==='perfect') F.end = {win:true, method:MG[F.game].fin || 'KO'};
  else if(tier==='ko') F.end = {win:false, method:F.opp.spec==='sumision' ? 'Sumisión' : (F.opp.spec==='wrestling' ? 'TKO' : 'KO')};
  else if(F.meW>=F.need) F.end = {win:true, method:(F.max===1 || F.opW===0) ? 'Decisión unánime' : 'Decisión dividida'};
  else if(F.opW>=F.need) F.end = {win:false, method:(F.max===1 || F.meW===0) ? 'Decisión unánime' : 'Decisión dividida'};
  else F.end = null;
  if(F.end && F.end.win && F.end.method!=='Decisión unánime' && F.end.method!=='Decisión dividida' && MG[F.game].luck) F.end.method = choice(['KO','KO','TKO','Sumisión']);
  F.canAmuleto = isLuck() && res==='l' && p.amuletos>0;
  if(res==='w') (tier==='perfect' ? SFX.great : SFX.good)(); else (tier==='ko' ? SFX.hurt : SFX.bad)();
  if(tier==='perfect'){ flashScreen('y'); vibrate([30,40,60]); } else if(tier==='ko'){ flashScreen('r'); vibrate(120); }
  showRoundOverlay();
  if(UI.bot){ if(F.canAmuleto && UI.bot>=.5) setTimeout(useAmuleto, 20); else setTimeout(afterRound, 20); return; }
  if(!F.canAmuleto){ clearTimeout(F._adv); F._adv = setTimeout(()=>{ if(F && F.phase==='roundEnd') afterRound(); }, 1700); }
}
function useAmuleto(){
  if(!F || !F.canAmuleto || F.phase!=='roundEnd') return;
  const p = G.p; p.amuletos--;
  const h = F.hist.pop(); F.opW--;
  F.used = F.used.filter(g=>g!==h.g);

/* =========================================================
   MINIJUEGOS — cada uno vive en #stage y termina con c.done(tier)
   ========================================================= */
const MG = {};
const MGR = {raf:0, tos:[], alive:false, key:null, keyup:null, up:null};
function mgStop(){ MGR.alive = false; cancelAnimationFrame(MGR.raf); MGR.tos.forEach(clearTimeout); MGR.tos = []; MGR.key = MGR.keyup = MGR.up = null; }
function mgAfter(ms, fn){ const t = setTimeout(()=>{ if(MGR.alive) fn(); }, ms); MGR.tos.push(t); return t; }
function mgLoop(fn){
  let last = performance.now();
  const tick = t=>{ if(!MGR.alive) return; const dt = Math.min(.05, Math.max(0,(t-last)/1000)); last = t; if(fn(dt, t)!==false && MGR.alive) MGR.raf = requestAnimationFrame(tick); };
  MGR.raf = requestAnimationFrame(tick);
}
const FACES = {idle:'😠', hit:'😣', crit:'😵', miss:'😏', scared:'😰', tap:'🏳️', pain:'😖', strain:'😤'};
const SVG_DEFS = `<defs>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="mat" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="#16261c"/><stop offset="100%" stop-color="#070d09"/></radialGradient>
</defs>`;
function polar(r, a){ const t = (a-90)*Math.PI/180; return [r*Math.cos(t), r*Math.sin(t)]; }
function arcPath(r, a0, a1){
  if(a1-a0>=359.9) a1 = a0+359.9;
  const [x0,y0] = polar(r,a0), [x1,y1] = polar(r,a1), large = (a1-a0)>180 ? 1 : 0;
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function octPts(r){ return Array.from({length:8},(_,i)=>polar(r, i*45+22.5).map(v=>v.toFixed(1)).join(',')).join(' '); }
function angDist(a, b){ return Math.abs(((a-b)%360+540)%360-180); }
function octagonBg(){ return `<polygon points="${octPts(156)}" fill="url(#mat)" stroke="#1f3527" stroke-width="3"/>
  <polygon points="${octPts(146)}" fill="none" stroke="rgba(59,240,122,.08)" stroke-width="1"/>`; }

function mgRun(gid, d){
  mgStop(); MGR.alive = true;
  const stage = $('stage'), hud = $('mgHud'), act = $('mgAct'), sub = $('mgSub'), timer = $('mgTimer');
  let finished = false;
  const c = {
    d, p:luckP(d), stage, hud, act, sub, opp:F.opp, me:G.p,
    done(tier){
      if(finished) return; finished = true;
      MGR.alive = false; cancelAnimationFrame(MGR.raf); MGR.key = MGR.keyup = MGR.up = null;
      setTimeout(()=>roundDone(tier), UI.bot ? 1 : 700);
    },
    pop(t, k, small){ popText(stage, t, k, small?'sm':''); },
    fb(pts){   /* feedback estándar de un golpe: 2 perfecto · 1 bien · 0 afuera */
      if(pts>=2){ c.pop('¡PERFECTO!','gold'); SFX.crit(); shake(stage); flashScreen('y'); vibrate(40); }
      else if(pts===1){ c.pop('¡BIEN!','ok'); SFX.hit(); flashScreen('g'); vibrate(20); }
      else { c.pop('¡AFUERA!','bad'); SFX.whiff(); }
    },
    pips(n, arr){ hud.innerHTML = Array.from({length:n},(_,i)=>{ const v = arr[i]; return `<span class="pip ${v===undefined?'':v>=2?'gold':v===1?'ok':'bad'}"></span>`; }).join(''); },
    timer(frac){ if(timer){ timer.parentNode.style.visibility = frac===null ? 'hidden' : 'visible'; if(frac!==null) timer.style.transform = `scaleX(${clamp(frac,0,1)})`; } },
    tapButton(label, cls){
      act.innerHTML = `<button class="tapbtn ${cls||''}" id="tapB">${label}</button>`;
      return $('tapB');
    },
    onTap(fn){
      const b = $('tapB');
      const h = e=>{ if(!MGR.alive) return; e.preventDefault(); fn(e); };
      stage.addEventListener('pointerdown', h);
      if(b) b.addEventListener('pointerdown', h);
      MGR.key = e=>{ if(e.code==='Space' || e.code==='Enter'){ e.preventDefault(); if(!e.repeat) fn(e); } };
    },
  };
  c.timer(null);
  if(UI.bot){ mgAfter(15, ()=>c.done(botTier(d, UI.bot, !!MG[gid].luck))); return; }
  MG[gid].run(c);
}
document.addEventListener('keydown', e=>{ if(MGR.key && MGR.alive) MGR.key(e); else if(!MGR.alive) screenKey(e); });
document.addEventListener('keyup', e=>{ if(MGR.keyup && MGR.alive) MGR.keyup(e); });
window.addEventListener('pointerup', e=>{ if(MGR.up && MGR.alive) MGR.up(e); });
window.addEventListener('pointercancel', e=>{ if(MGR.up && MGR.alive) MGR.up(e); });

function botTier(d, s, luck){
  const r = Math.random();
  if(luck){ const p = luckP(d); if(r < p*.3) return 'perfect'; if(r < p) return 'win'; if(r > 1-(1-p)*.2) return 'ko'; return 'lose'; }
  const pw = clamp(.5 + (s-.5)*.9 - d*.28, .05, .95);
  if(r < pw*(.2+.35*s)) return 'perfect';
  if(r < pw) return 'win';
  if(r > 1-(1-pw)*.2) return 'zero';
  return 'lose';
}

const TTT_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function tttWinner(b){ for(const l of TTT_LINES){ if(b[l[0]] && b[l[0]]===b[l[1]] && b[l[1]]===b[l[2]]) return {w:b[l[0]], l}; } return b.every(v=>v) ? {w:0} : null; }
function tttBest(b, me){
  const other = me===1 ? 2 : 1;
  let best = -2, move = null;
  for(let i=0;i<9;i++){ if(b[i]) continue; b[i] = me; const s = -tttScore(b, other); b[i] = 0; if(s>best){ best = s; move = i; } }
  return move;
}
function tttScore(b, turn){
  const w = tttWinner(b);
  if(w) return w.w===0 ? 0 : (w.w===turn ? 1 : -1);
  let best = -2;
  for(let i=0;i<9;i++){ if(b[i]) continue; b[i] = turn; const s = -tttScore(b, turn===1?2:1); b[i] = 0; if(s>best) best = s; if(best===1) break; }
  return best;
}

    deck.forEach((v,i)=>el(i).addEventListener('pointerdown', e=>{
      e.preventDefault();
      if(phase!=='pick' || picks.includes(i)) return;
      picks.push(i); flip(i,false); total += v; $('kPts').textContent = total;
      if(v>=2){ SFX.crit(); c.pop('💥 +2','gold',true); } else if(v===1){ SFX.hit(); c.pop('✅ +1','ok',true); } else if(v<0){ SFX.hurt(); c.pop('☠️ −2','bad',true); shake(c.stage); } else { SFX.whiff(); c.pop('❌','bad',true); }
      if(picks.length>=2){
        phase = 'done';
        setTimeout(()=>{ deck.forEach((_,j)=>{ if(!picks.includes(j) && el(j)){ flip(j,false); el(j).style.opacity = .45; } }); }, 450);
        c.done(total>=3 ? 'perfect' : total>=2 ? 'win' : total<=-2 ? 'ko' : 'lose');
      }
    }));
  }};

/* ---------- 10. LOS DADOS ---------- */
MG.dados = {ico:'🎲', nm:'LOS DADOS', stat:'ovr', luck:true, hint:'Sacá el número marcado o más',
  how:'Tirá los dos dados: necesitás sumar <b class="y">el número marcado o más</b>. Doble 6 es nocaut. Doble 1… mejor no saberlo.',
  run(c){
    const probGE = t=>{ let n = 0; for(let a=1;a<=6;a++) for(let b=1;b<=6;b++) if(a+b>=t && !(a===1&&b===1)) n++; return n/36; };
    let target = 7, bd = 9;
    for(let t=3;t<=12;t++){ const e = Math.abs(probGE(t)-c.p); if(e<bd){ bd = e; target = t; } }
    const PIPS = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
    const face = v=>`<div style="display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:100%;height:100%;padding:14%;gap:4%">${Array.from({length:9},(_,i)=>`<i style="border-radius:50%;background:${PIPS[v].includes(i)?'#0c110e':'transparent'}"></i>`).join('')}</div>`;
    c.stage.innerHTML = `<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 45%, #122018, #07100b 70%)">
      <div style="font-family:var(--font-mono);font-size:12px;letter-spacing:.2em;color:var(--text-dim)">NECESITÁS</div>
      <div style="font-family:var(--font-display);font-size:64px;line-height:.8;color:var(--gold);text-shadow:0 0 24px var(--gold-glow)">${target}+</div>
      <div style="display:flex;gap:22px">${[0,1].map(i=>`<div id="dD${i}" style="width:96px;height:96px;border-radius:20px;background:linear-gradient(160deg,#fff,#cfd8d2);box-shadow:0 14px 30px -10px #000, inset 0 -4px 0 rgba(0,0,0,.15);transition:transform .08s">${face(randi(1,6))}</div>`).join('')}</div>
      <div id="dS" style="font-family:var(--font-display);font-size:30px;min-height:32px"></div>
    </div>`;
    c.hud.innerHTML = `<span class="chip gold">🎲🎲 6-6 = KO</span><span class="chip red">1-1 = ☠️</span>`;
    c.tapButton('¡TIRÁ LOS DADOS!', 'gold');
    let rolling = false;
    function roll(){
      if(rolling) return; rolling = true; $('tapB').disabled = true;
      const vals = [randi(1,6), randi(1,6)], stop = [900, 1650], t0 = performance.now();
      let lastT = 0;
      mgLoop(()=>{
        const el = performance.now()-t0;
        if(el-lastT>75){ lastT = el; [0,1].forEach(i=>{ if(el<stop[i]){ const d = $('dD'+i); d.innerHTML = face(randi(1,6)); d.style.transform = `rotate(${rand(-25,25)}deg) scale(${rand(.92,1.05)})`; SFX.tick(); } }); }
        [0,1].forEach(i=>{ const d = $('dD'+i); if(el>=stop[i] && !d.dataset.done){ d.dataset.done = 1; d.innerHTML = face(vals[i]); d.style.transform = 'none'; SFX.block(); } });
        if(el>=stop[1]+150){
          const s = vals[0]+vals[1];
          let tier;
          if(vals[0]===6 && vals[1]===6){ tier = 'perfect'; c.pop('¡DOBLE SEIS!','gold'); }
          else if(vals[0]===1 && vals[1]===1){ tier = 'ko'; c.pop('DOBLE UNO…','bad'); }
          else if(s>=target){ tier = 'win'; c.pop(`¡${s}!`,'ok'); }
          else { tier = 'lose'; c.pop(`${s}…`,'bad'); }
          $('dS').innerHTML = `<span style="color:${tier==='win'||tier==='perfect'?'var(--neon)':'#ff6b7d'}">SUMA ${s}</span>`;
          c.done(tier); return false;
        }
      });
    }
    c.onTap(roll);
  }};

function screenKey(e){

  if(UI.modal && e.code==='Escape'){ closeModal(); return; }
  const n = {Digit1:1, Digit2:2, Digit3:3, Digit4:4, Numpad1:1, Numpad2:2, Numpad3:3, Numpad4:4}[e.code];
  if(n){ const b = document.querySelector(`[data-k="${n}"]`); if(b && !b.disabled){ e.preventDefault(); b.click(); } return; }
  if(e.code==='Enter' || e.code==='Space'){
    const b = document.querySelector('[data-k="enter"]');
    if(b && !b.disabled){ e.preventDefault(); b.click(); }
  }
}

/* ---------- bot de prueba (?bot=0.7) ---------- */
function botPickCard(){
  const p = G.p;
  let best = 0, bv = -1e9;
  G.cards.forEach((id,i)=>{
    const c = cardById(id), cost = cardCost(c);
    if(cost && p.money<cost) return;
    let v = 0;
    if(c.g){ const q = {...p}; Object.entries(c.g).forEach(([k,d])=>q[k]=clamp(q[k]+d,10,99)); v = ovrOf(q)-ovrOf(p) + (c.g[p.style]||0)*.15; }
    else v = c.r==='l' ? 3 : 1;
    if(v>bv){ bv = v; best = i; }
  });
  return best;
}
function botStep(){
  clearTimeout(UI._bt);
  UI._bt = setTimeout(()=>{
    try{
      if(UI.screen==='career'){
        if(G.step==='card'){ if(!G.picked) pickCard(botPickCard()); }
        else if(G.step==='event'){ if(!G.evRes){ const v = eventView(); doEvent(v.special ? 0 : randi(0, v.choices.length-1)); } else afterEvent(); }
        else if(G.step==='season') toBig();
        else if(G.step==='preview') goFight(Math.random()<.5);
        else if(G.step==='yearEnd'){ if(G.p.age>=39 || (G.retireAsk && G.p.age>=UI.botRetire)) retireNow(); else goNext(); }
      } else if(UI.screen==='fight'){ if(F && F.phase==='trash'){ if(F.trashRes) afterTrash(); else chooseTrash(randi(0,2)); } }
      else if(UI.screen==='ko') afterKO();
      else if(UI.screen==='end'){ if(UI.onBotEnd) UI.onBotEnd(G.final); }
    }catch(err){ console.error('BOT', err); window.__botError = String(err && err.stack || err); }
  }, UI.botDelay||1);
}

/* ---------- arranque ---------- */
function init(){
  const q = new URLSearchParams(location.search);
  if(q.has('bot')){
    UI.bot = parseFloat(q.get('bot')) || .6; UI.botRetire = parseInt(q.get('retire')) || 36;
    UI.draft = {name:'', cc:q.get('cc')||'AR', wc:q.get('wc')||choice(WEIGHT_CLASSES).id, style:q.get('style')||choice(STYLES).id, persona:q.get('persona')||choice(Object.keys(PERSONAS)), err:''};
    if(q.get('autostart')!=='0'){ startCareer(); return; }
  }
  render();
}
window.__idolo = { get G(){ return G; }, get F(){ return F; }, UI, MG, newGame, startCareer, render, LS };
init();
</script>
